<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a36">
<title>컨설팅 CRM</title>
<link rel="manifest" href="cassets/manifest.json">
<link rel="icon" type="image/png" href="cassets/icon192.png">
<link rel="apple-touch-icon" href="cassets/icon180.png">
<link rel="apple-touch-icon" sizes="167x167" href="cassets/icon167.png">
<link rel="apple-touch-icon" sizes="152x152" href="cassets/icon152.png">
<link rel="apple-touch-icon" sizes="120x120" href="cassets/icon120.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="컨설팅 CRM">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--sub:#64748b;--line:#eef1f6;--brand:#3b82f6;--dark:#101a36}
body{background:var(--bg);color:var(--ink);min-height:100vh}
.app{display:flex;min-height:100vh}
.side{width:228px;background:var(--dark);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:20}
.brand{padding:22px 22px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand .logo{width:38px;height:38px;background:linear-gradient(135deg,#63b3ed,#7c5cff);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.brand b{color:#fff;font-size:16px;display:block}.brand span{color:#6b7aa3;font-size:11px}
.nav{padding-top:12px;flex:1;overflow:auto}
.nav a{display:block;padding:12px 22px;color:#8a98bd;font-size:14px;font-weight:600;border-left:3px solid transparent;cursor:pointer;text-decoration:none}
.nav a.on{background:rgba(99,179,237,.15);border-left-color:#63b3ed;color:#dbeafe}
.me{padding:16px 22px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.me .av{width:34px;height:34px;border-radius:50%;background:#2a3a63;color:#cdd9f5;display:flex;align-items:center;justify-content:center;font-weight:700}
.me b{color:#dbeafe;font-size:13px;display:block}.me span{color:#6b7aa3;font-size:11px}
.main{margin-left:228px;flex:1;padding:26px 32px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.top h1{font-size:23px;font-weight:800}.top .date{font-size:13px;color:var(--sub);margin-top:3px}
.tbtns{display:flex;gap:10px;align-items:center}
.btn{padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;border:none}
.btn.g{background:#fff;border:1px solid #e2e8f0;color:#475569}
.btn.b{background:var(--brand);color:#fff}
.back{color:#3b82f6;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:14px;display:inline-block}
.sechead{font-size:13px;font-weight:800;color:#475569;margin:0 0 10px}
.rev{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.rev .c{flex:1;min-width:230px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.rev .c .h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rev .c .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px}
.rev .c .lb{font-size:14px;color:var(--sub);font-weight:700}
.rev .c .v{font-size:29px;font-weight:800}.rev .c .v small{font-size:15px;color:#94a3b8;font-weight:800}
.rev .c .s{font-size:12.5px;font-weight:700;margin-top:4px}
.midrow{display:flex;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.tax{flex:1.3;min-width:300px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.tax .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.tax .h b{font-size:15px;font-weight:800}.tax .h .sum{font-size:13px;color:#8b5cf6;font-weight:800}
.tax .grid{display:flex;gap:14px}
.tax .box{flex:1;border-radius:13px;padding:16px}
.tax .box .t{font-size:12.5px;color:var(--sub)}
.tax .box .n{font-size:26px;font-weight:800;margin:4px 0}.tax .box .n small{font-size:14px;color:var(--sub);font-weight:800}
.tax .box .m{font-size:12px;font-weight:700}
.acts{flex:1.7;min-width:300px;display:flex;gap:14px}
.act{flex:1;border-radius:16px;padding:18px;color:#fff;cursor:pointer}
.act .ic{font-size:22px}.act .n{font-size:32px;font-weight:800;margin:6px 0 0}.act .l{font-size:13px;opacity:.92;font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.panel .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.panel .ph b{font-size:15px;font-weight:800}.panel .ph .more{color:var(--brand);font-size:13px;font-weight:700;cursor:pointer}
.panel .ph .sub{font-size:12px;color:#94a3b8;font-weight:500;margin-left:6px}
.row{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid #f1f5f9;gap:12px}
.row:last-child{border-bottom:none}
.row.click{cursor:pointer;border-radius:10px;padding:12px 8px;margin:0 -8px}
.row.click:hover{background:#f8fafc}
.row .av{width:34px;height:34px;border-radius:10px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-weight:700;color:#475569;flex-shrink:0}
.row .info{flex:1;min-width:0}
.row .info b{font-weight:700;font-size:14px}.row .info b span{color:#cbd5e1;font-weight:400}
.row .info .memo{font-size:12px;color:#94a3b8}
.row .amt{font-size:13px;font-weight:700;white-space:nowrap}
.chip{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.row .call{background:var(--brand);color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
.aqrow{flex-wrap:wrap;column-gap:8px;row-gap:6px}
.aqrow .info b{white-space:normal;word-break:keep-all}
@media(max-width:600px){
  .aqrow .info{flex:1 1 100%;min-width:0}
  .aqrow .info b{font-size:13.5px}
}
.shx{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.shc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;border-top:3px solid var(--brand);cursor:pointer;transition:.15s}
.shc:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.07)}
.shc .hh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.shc .hh .av{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.shc .hh b{font-size:15px}.shc .hh span{font-size:12px;color:var(--sub)}
.shc .stat{display:flex;gap:16px}
.shc .stat div b{font-size:20px;font-weight:800;display:block}.shc .stat div span{font-size:11.5px;color:var(--sub)}
/* 팀장 상세 */
.tlhead{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 26px;margin-bottom:18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.tlhead .av{width:60px;height:60px;border-radius:16px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.tlhead .nm{font-size:22px;font-weight:800}.tlhead .og{color:var(--sub);font-size:14px;margin-top:2px}
.hedit{cursor:pointer;border-radius:6px;padding:0 4px;transition:background .12s}.hedit:hover{background:#eef2ff;outline:1px dashed #c7d2fe}
.tlhead .sum{display:flex;gap:24px;text-align:center;margin-left:auto}
.tlhead .sum div b{font-size:24px;font-weight:800;display:block}.tlhead .sum div span{font-size:12px;color:#94a3b8}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.ins{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #f1f5f9;gap:10px}
.ins:last-child{border-bottom:none}
.ins .nm{font-weight:700;font-size:14px}.ins .fd{color:#94a3b8;font-size:12.5px;margin-left:4px}
.ins .val{font-weight:800;font-size:14px;cursor:pointer;border-bottom:1px dashed #cbd5e1}
.st{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;border:none;white-space:nowrap}
.st.대기{background:#fef3c7;color:#d97706}.st.완료{background:#dcfce7;color:#16a34a}.st.취소{background:#fee2e2;color:#dc2626}
.fld{margin-bottom:14px}.fld label{font-size:12px;color:#94a3b8;font-weight:700;display:block;margin-bottom:5px}
.fld .ev{font-size:15px;font-weight:600;cursor:pointer;padding:9px 12px;background:#f8fafc;border:1px solid #eef1f6;border-radius:10px}
.fld .ev:hover,.val:hover{outline:1.5px dashed #c7d2fe}
.iedit{width:100%;font-size:15px;font-weight:600;padding:8px 11px;border:1.6px solid var(--brand);border-radius:10px;outline:none;font-family:inherit;background:#fff;color:var(--ink)}
.ins .iedit,.val .iedit{width:130px;font-size:13px;padding:5px 8px}
select.iedit{cursor:pointer}
.sharebar{background:linear-gradient(135deg,#101a36,#1e293b);color:#fff;padding:16px 22px;border-radius:16px;margin-bottom:18px;display:flex;align-items:center;gap:14px}
.sharebar .badge{background:rgba(255,255,255,.14);padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700}
.hide{display:none!important}
.menubtn{display:none}
@media(max-width:860px){
 .side{transform:translateX(-100%);transition:.25s}.side.open{transform:translateX(0)}
 .main{margin-left:0;padding:18px 14px}.menubtn{display:flex}
 .acts{flex-wrap:wrap}.act{min-width:46%}.rev .c{min-width:46%}.top h1{font-size:20px}
 .tlhead .sum{margin-left:0;width:100%;justify-content:space-around}
}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15}
.scrim.open{display:block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:700;z-index:99;opacity:0;transition:.2s}
.toast.on{opacity:1}
/* 서류함(폴더) */
.docbox{background:linear-gradient(180deg,#fffdf3,#fff);border:1px solid #f0e6c8;border-radius:14px;padding:14px 16px;margin-bottom:16px;position:relative}
.docbox::before{content:'';position:absolute;top:-8px;left:18px;width:52px;height:10px;background:#f6cf5b;border-radius:6px 6px 0 0}
.docbox .dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.docbox .dh b{font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px}
.docbox .add{background:#fff4cc;color:#a16207;border:1px solid #f0e0a0;padding:5px 11px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.docitem{display:flex;align-items:center;gap:9px;padding:8px 10px;background:#fff;border:1px solid #f1ecd9;border-radius:9px;margin-bottom:6px}
.docitem .nm{flex:1;font-size:13px;font-weight:600;cursor:pointer;min-width:0}
.docitem .x{color:#c9bda0;cursor:pointer;font-size:13px;font-weight:700}
.docitem .dl{color:#3b82f6;cursor:pointer;font-weight:700;font-size:14px}
.docempty{font-size:12.5px;color:#b9a96b;padding:6px 2px;line-height:1.5}
.docbox .dropzone{margin:8px 0 4px;padding:16px 12px}
/* 컨설팅 메모 */
.iarea{width:100%;min-height:180px;font-size:14px;line-height:1.65;padding:12px;border:1.6px solid var(--brand);border-radius:12px;outline:none;font-family:inherit;resize:vertical;background:#fff}
.notebox{min-height:180px;font-size:14px;line-height:1.65;color:#334155;white-space:pre-wrap;cursor:text;padding:8px 4px;border-radius:10px}
.notebox:hover{background:#f8fafc}.notebox.empty{color:#94a3b8}
/* 재무 요약 */
.fsum .bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:8px 4px 0;border-bottom:1px solid #eef1f6;margin-bottom:6px}
.fsum .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.fsum .bar .bb{width:100%;border-radius:7px 7px 0 0;display:flex;align-items:flex-start;justify-content:center;color:#fff;font-size:11.5px;font-weight:800;padding-top:5px;min-height:20px}
.fsum .bar .yl{font-size:11px;color:#94a3b8;margin-top:5px;font-weight:600}
.fsum .scards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.fsum .sc{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fsum .sc .t{font-size:12px;color:var(--sub)}.fsum .sc .n{font-size:20px;font-weight:800;margin-top:3px}
.fsum .warn{background:#fef2f2;color:#b91c1c;border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:700;margin-bottom:14px}
.fsum .ltot{font-size:13px;font-weight:800;color:#334155;margin:4px 0 8px}
.fsum .loan{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:8px}
.fsum .loan .lr{display:flex;justify-content:space-between;font-weight:800;font-size:13.5px}
.fsum .loan .ld{font-size:12px;color:var(--sub);margin:3px 0 5px}
.fsum .loan .lt{display:inline-block;background:#eff6ff;color:#3b82f6;font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px}
.fsum .credit{background:#ecfdf5;color:#15803d;border-radius:10px;padding:11px 13px;font-size:13px;font-weight:800;text-align:center;margin-top:10px}
.fsum .empty{text-align:center;color:#94a3b8;padding:24px 8px;font-size:13px;line-height:1.7}
/* 팀장 카드 삭제 버튼 — 평소 흐리게, 올리면 빨강 (실수 클릭 방지: confirm 2중) */
.shc-del{position:absolute;top:9px;right:9px;border:none;background:transparent;color:#cbd5e1;font-size:14px;font-weight:800;cursor:pointer;padding:4px 8px;border-radius:8px;line-height:1;z-index:2}
.shc-del:hover{background:#fef2f2;color:#dc2626}
/* ===== 재무 진단서 v2 (2026-07-16 사장님 양식) =====
   목표 = 스크롤 없이 한 장으로 읽히는 진단서. 색은 의미로만 씀(빨강=위험/초록=양호). */
.dg .dg-hd{background:linear-gradient(135deg,#1e3a5f,#2c4a72);border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;color:#fff}
.dg .dg-nm{font-size:21px;font-weight:900;letter-spacing:-.4px}
.dg .dg-sub{font-size:11.5px;color:#c3d3e8;margin-top:3px;line-height:1.5}
.dg .dg-bdgs{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.dg .dg-bdg{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#e8f0fb;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px}
.dg .dg-hd-r{text-align:right;flex-shrink:0}
.dg .dg-vt{font-size:10.5px;color:#a9bdd6;font-weight:600}
.dg .dg-vl{font-size:20px;font-weight:900;margin:1px 0 2px;white-space:nowrap}
.dg .dg-vs{font-size:10.5px;color:#a9bdd6}
.dg .dg-line{border-left:4px solid #dc2626;background:#fff;border-radius:0 10px 10px 0;padding:11px 14px;margin:12px 0;font-size:13px;font-weight:800;color:#991b1b;line-height:1.6;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.dg .dg-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}
.dg .dg-kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 8px;text-align:center}
.dg .dg-kv{font-size:19px;font-weight:900;letter-spacing:-.5px}
.dg .dg-kl{font-size:10.5px;color:var(--sub);margin-top:3px;font-weight:600}
.dg .dg-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dg .dg-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.dg .dg-bt{font-size:12.5px;font-weight:800;color:#1e3a5f;padding-bottom:7px;border-bottom:1px solid #eef1f6;margin-bottom:9px}
.dg .bars{height:118px}
.dg .bars .bb{background:linear-gradient(180deg,#3b6ea5,#26456b)}
.dg .dg-trend{font-size:11px;color:#dc2626;font-weight:700;text-align:center;margin-top:5px}
.dg .dg-fr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12.5px;border-bottom:1px dashed #f1f5f9}
.dg .dg-fr:last-child{border-bottom:none}
.dg .dg-fl{color:#475569}
.dg .dg-fv{font-weight:800;color:#1e293b}
.dg .dg-tb{width:100%;border-collapse:collapse;font-size:12.5px}
.dg .dg-tb th{background:#1e3a5f;color:#fff;font-size:11.5px;font-weight:700;padding:8px 10px;text-align:left;white-space:nowrap}
.dg .dg-tb th:first-child{border-radius:8px 0 0 0}.dg .dg-tb th:last-child{border-radius:0 8px 0 0}
.dg .dg-tb td{padding:9px 10px;border-bottom:1px solid #eef1f6;color:#334155}
.dg .dg-tb .dg-sum td{font-weight:900;color:#0f172a;background:#f8fafc;border-top:2px solid #1e3a5f;border-bottom:2px solid #1e3a5f}
.dg .dg-tag{font-size:10.5px;font-weight:700;padding:2.5px 8px;border-radius:6px;white-space:nowrap}
.dg .t-b{background:#eff6ff;color:#1d4ed8}   /* 보증부 */
.dg .t-p{background:#ecfdf5;color:#047857}   /* 정책자금 */
.dg .t-s{background:#fef3c7;color:#b45309}   /* 단기차입 */
.dg .t-o{background:#fff1e7;color:#c2410c}   /* 상거래 */
.dg .dg-note{font-size:11px;color:#c2410c;font-weight:700;margin-top:8px;line-height:1.5}
.dg .dg-ul{margin:0;padding-left:17px;font-size:12.5px;line-height:1.75;color:#334155}
.dg .dg-ul li{margin-bottom:7px}
@media(max-width:900px){
  .dg .dg-2,.dg .dg-kpis{grid-template-columns:1fr 1fr}
  .dg .dg-hd{flex-direction:column;gap:10px}
  .dg .dg-hd-r{text-align:left}
}
.spin{width:30px;height:30px;border:3px solid #e2e8f0;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.jsonarea{width:100%;min-height:230px;font-family:ui-monospace,Consolas,monospace;font-size:12px;padding:12px;border:1.6px solid var(--brand);border-radius:12px;outline:none;background:#0f172a;color:#cbd5e1;resize:vertical}
/* 모달 */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}
.modal .mc{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:470px;max-height:90vh;overflow:auto}
.modal h3{font-size:18px;font-weight:800;margin-bottom:4px}.modal .msub{font-size:12.5px;color:#94a3b8;margin-bottom:16px}
.modal .opt{display:flex;gap:12px;margin-bottom:14px}
.modal .ob{flex:1;border:1.5px solid #e2e8f0;border-radius:13px;padding:16px;text-align:center;cursor:pointer;font-weight:700;font-size:13px}
.modal .ob.on{border-color:var(--brand);background:#eff6ff}.modal .ob .bi{font-size:24px;display:block;margin-bottom:6px}
.modal label{font-size:12px;color:#64748b;font-weight:700;display:block;margin:10px 0 4px}
.modal input,.modal select,.modal textarea{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;font-family:inherit;outline:none}
.modal textarea{min-height:80px;resize:vertical;line-height:1.6}

<script>
/* ===== Firebase 실시간 DB ===== */
const firebaseConfig = {

  authDomain: "consult-crm-cfef6.firebaseapp.com",

};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let storage=null; try{ storage=firebase.storage(); }catch(e){ console.warn('storage init',e); }

const STAGE={연락전:'#94a3b8',통화완료:'#3b82f6',미팅전:'#a5b4fc',미팅완료:'#4338ca',서류요청완료:'#14b8a6',접수대기:'#64748b',심사중:'#f59e0b',확인필요:'#f97316',자금접수완료:'#8b5cf6',재접수:'#06b6d4',승인완료:'#10b981','부재중·재연락':'#ec4899','부결':'#ef4444'};
/* ★STAGES 순서 = 진행도. 뒤에 있을수록 '더 진행된 단계'로 쳐서 대표(primary) 단계를 뽑는다.
   그래서 아무 데나 넣으면 안 되고 실제 업무 흐름 순서대로 넣어야 한다.
   2026-07-15 '서류요청완료' 추가 — 통화 후 서류를 요청한 상태(아직 못 받음).
   ※ docStatus(접수전/접수완료)와 다름: docStatus는 "서류를 받았나", 이 단계는 "요청했나".
   2026-07-15 '미팅전'·'미팅완료' 추가 — 통화 뒤 미팅 잡힘(미팅전) → 미팅 끝남(미팅완료). */
const STAGES=['연락전','통화완료','미팅전','미팅완료','서류요청완료','접수대기','심사중','확인필요','자금접수완료','재접수','승인완료','부재중·재연락','부결'];
/* 단계 다중선택: c.stages[] 가 진실. c.stage=대표(가장 진행된 단계) — 카드뱃지·필터 하위호환 */
function custStages(c){ return (c&&Array.isArray(c.stages)&&c.stages.length)?c.stages:(c&&c.stage?[c.stage]:[]); }
function toggleStage(id,st){
  const c=getCust(id)||{}; let arr=custStages(c).slice();
  const i=arr.indexOf(st); if(i>=0)arr.splice(i,1); else arr.push(st);
  const primary=arr.length?arr.slice().sort((a,b)=>STAGES.indexOf(b)-STAGES.indexOf(a))[0]:'연락전';
  const patch={stages:arr,stage:primary,contacted:arr.some(s=>s!=='연락전')};
  /* ★2026-07-20 '접수중' 탭 — 자금접수완료를 켠 "그 순간"을 기록한다.
     사장님: "언제 접수 했는 지 확인 가능해야돼. 여긴 이게 중요해."
     - 켤 때: fundDate 없으면 오늘 날짜로 기록(이미 있으면 덮지 않음 = 최초 접수일 보존)
     - 끌 때: 날짜를 지우지 않는다. 실수로 껐다 켜도 원래 접수일이 살아있어야 하고,
       기록을 지우는 건 되돌릴 수 없기 때문. (지우려면 접수중 화면에서 직접 수정)
     ※ 이 함수가 단계 변경의 유일한 통로라 여기 한 곳만 잡으면 샐 구멍이 없다. */
  if(arr.indexOf('자금접수완료')>=0 && !c.fundDate){ patch.fundDate=today(); patch.fundAt=Date.now(); }
  setCust(id,patch);
}
/* 인라인 편집창(피커) 바깥 클릭 시 닫기 — 잘못 눌러도 사라짐 */
function _closePickers(e){
  const open=document.querySelector('.shrpick,.refpick,.bizpick,.typepick,.selpick');
  if(open && !open.contains(e.target) && !e.target.closest('.ev,.hedit')) rerender();
}
document.addEventListener('click',_closePickers);

/* ===== 시드(최초 1회 채움) ===== */
/* 🔒 보안: 실고객 데이터는 SEED에서 제거됨 (실데이터는 Firebase RTDB에만 존재, ages6917 로그인 시에만 접근).
   SEED는 최초 1회 빈 DB 부팅용 뼈대일 뿐 — 여기에 실명/전화 절대 넣지 말 것. */
const SEED={
 sharers:{},
 customers:{},
 revenue:{consulting:{v:'—',s:'수치 입력 예정'},insurance:{v:'—',s:'보험 정보 입력 시 집계'},tax:{personal:0,corp:0,perFee:60,corpFee:90}}
};

let DATA={sharers:{},customers:{},revenue:{}};
let ready=false, offline=false;
const params=new URLSearchParams(location.search);
const shareId=params.get('share');
/* 데모/테스트 분리: ?ns=demo 면 모든 데이터가 /demo 아래로 (실제 고객과 격리) */
let NS=(params.get('ns')||'').replace(/[^a-z0-9_]/gi,'');
let TENANT='', IS_SHARER=false, _sharerStarted=false;   // 팀장 전용 워크스페이스 루트(ws/<sid>)
const RAWREF=db.ref.bind(db);
function droot(){ return TENANT || NS || ''; }
function dref(p){ var r=droot(); if(r) return RAWREF(p?r+'/'+p:r); return p?RAWREF(p):RAWREF(); }
let LSKEY=NS?'consultDATA_'+NS:'consultDATA';
let VIEW = shareId ? {t:'ext'} : {t:'dash'};

/* 연결 실패/잠김이어도 절대 멈추지 않게: 로컬 시드로 부팅 */
function _lsave(){ try{ if(offline) localStorage.setItem(LSKEY, JSON.stringify(DATA)); }catch(e){} }
function bootLocal(reason){
  if(ready && !offline) return;          // 이미 실시간으로 떠 있으면 무시
  let base=null; try{ const ls=localStorage.getItem(LSKEY); if(ls) base=JSON.parse(ls); }catch(e){}
  DATA=(base&&base.customers)?base:JSON.parse(JSON.stringify(SEED));
  ready=true; offline=true; rerender();
  console.warn('오프라인 모드(이 PC 저장본 사용):', reason);
}
function startApp(){
  const bootTimer=setTimeout(()=>bootLocal('연결 시간초과(2.5s)'), 2500);
  /* 시드 → 실시간 구독 (실패 시 로컬 폴백) */
  try{
    dref().once('value').then(s=>{ if(!s.exists()||!s.child('sharers').exists()){
      let seed=SEED; try{ const ls=localStorage.getItem(LSKEY); if(ls){ const p=JSON.parse(ls); if(p&&p.customers&&Object.keys(p.customers).length) seed=p; } }catch(e){}
      dref().update(seed).catch(()=>{}); } }).catch(e=>bootLocal(e&&e.message));
    dref().on('value', s=>{
      clearTimeout(bootTimer);
      DATA=s.val()||JSON.parse(JSON.stringify(SEED));
      ready=true; offline=false; rerender();
      try{ if(!NS && !shareId && !SHARER_KEY) syncMirror(); }catch(e){}   // 사장님 화면에서만 팀장 미러 동기화
    }, e=>{ bootLocal(e&&e.message); });
    try{ subShared(); }catch(e){}
  }catch(e){ bootLocal(e&&e.message); }
}

/* ===== 🤝 쉐어 공유 풀 (/shared/<팀장sid>/items) — 사장님↔팀장 쉐어건만 양쪽에서 보고 같이 수정 ===== */
/* ★var로 둔다(let 아님) — let은 window에 안 붙어서 밖에서 상태를 들여다볼 수 없다.
   공유풀은 "사장님 화면과 팀장 화면이 같은 데이터인가"를 검증해야 하는 핵심 상태라
   콘솔·자동테스트에서 window.SHAREDPOOL 로 확인 가능해야 한다. */
var SHAREDPOOL={}, _sharedSubbed=false;
function subShared(){
  if(_sharedSubbed) return; _sharedSubbed=true;
  function boss(){
    RAWREF('shared').on('value', function(s){
      SHAREDPOOL={}; var all=s.val()||{};
      Object.keys(all).forEach(function(sid){ var it=(all[sid]&&all[sid].items)||{}; Object.keys(it).forEach(function(cid){ SHAREDPOOL[cid]=Object.assign({_sid:sid,_cid:cid}, it[cid]); }); });
      rerender();
    }, function(){});
  }
  function sharer(){
    RAWREF('shared/'+SHARER_KEY+'/items').on('value', function(s){
      SHAREDPOOL={}; var it=s.val()||{}; Object.keys(it).forEach(function(cid){ SHAREDPOOL[cid]=Object.assign({_sid:SHARER_KEY,_cid:cid}, it[cid]); });
      rerender();
    }, function(){});
  }
  try{ if(IS_SHARER) sharer(); else boss(); }catch(e){}
}
function sharedArr(){ return Object.keys(SHAREDPOOL).map(function(cid){ return SHAREDPOOL[cid]; }); }
/* ★2026-07-15 특정 팀장과의 공유건만 — [쉐어]→팀장카드 화면에서 씀 */
function sharedArrOf(sid){ return sharedArr().filter(function(it){ return it._sid===sid; }); }
/* 팀장 1명과의 공유 카드 HTML (사장님·팀장 양쪽에서 같은 모양으로 보이고, 양쪽 다 수정 가능) */
function sharedRowHtml(it){
  var cid=it._cid;
  return '<div class="ins" style="align-items:flex-start">'
    +'<div style="flex:1"><span class="nm">'+esc(it.nm||'(이름)')+'</span> '+chip(it.stage||'연락전')
    +'<div class="fd">'+esc(it.biz||'')+(it.phone?' · 📞 '+esc(it.phone):'')+(it.fund?' · '+esc(it.fund):'')+'</div>'
    +'<div style="font-size:11px;color:#94a3b8;margin-top:2px">공유: '+esc(it.owner||'')+(it.up?' · '+new Date(it.up).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'')+'</div>'
    +(it.memo?'<div style="font-size:12px;color:#475569;margin-top:4px;white-space:pre-wrap">'+esc(it.memo)+'</div>':'')+'</div>'
    +'<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">'
    +'<span class="st" style="cursor:pointer;background:#eef2ff;color:#4f46e5" onclick="event.stopPropagation();shCycleStage(\''+cid+'\')">단계 변경 ▾</span>'
    +'<span class="ev" style="font-size:12px;cursor:pointer" onclick="event.stopPropagation();shEditMemo(\''+cid+'\')">📝 메모</span>'
    +'</div></div>';
}
function shareTargets(c){
  if(IS_SHARER) return SHARER_KEY?[SHARER_KEY]:[];              // 팀장 → 사장님과의 공유풀(자기 sid)
  return custSharers(c).filter(function(sid){ var s=getSharer(sid); return s && sharerEmail(s); });   // 사장님 → 담당팀장(이메일 등록된)
}
/* ★2026-07-16 — summary(재무 진단서)·strategy(접수 전략)를 미러 대상에 추가.
   종전 스냅샷엔 이 둘이 빠져 있어서, 사장님 화면엔 진단서가 떠도 팀장 화면엔
   영영 안 보였다("공유했는데 팀장은 못 본다"의 원인). 서류(docs)는 _docMirror가 따로 복사. */
function shareSnapshot(id,c){ return {nm:c.nm||'', biz:c.biz||c.bizName||'', phone:c.phone||'', type:c.type||'개인', stage:c.stage||'연락전', fund:c.fund||'', memo:c.memo||'', fees:c.fees||null, summary:c.summary||null, strategy:c.strategy||'', owner:(IS_SHARER?((SHARER_NAME||'팀장')+' 팀장'):'사장님'), oid:id, up:Date.now()}; }
function toggleShare(id){
  var c=getCust(id); if(!c) return;
  var targets=shareTargets(c);
  if(!targets.length){ toast(IS_SHARER?'공유 대상이 없습니다':'먼저 담당 팀장을 지정하세요'); return; }
  var on=!c.shared;
  setCust(id,{shared:on});
  targets.forEach(function(sid){ var r=RAWREF('shared/'+sid+'/items/'+id); if(on) r.set(shareSnapshot(id,c)); else r.remove(); });
  toast(on?'🤝 쉐어됨 — 상대 "공유" 탭에 표시':'쉐어 해제');
}
function setShared(cid,patch){ var it=SHAREDPOOL[cid]; if(!it) return; try{ RAWREF('shared/'+it._sid+'/items/'+cid).update(Object.assign({up:Date.now()},patch)); }catch(e){} toast('저장됨 ✓'); }
function shEditMemo(cid){ var it=SHAREDPOOL[cid]||{}; var v=prompt('메모(공유)', it.memo||''); if(v!==null) setShared(cid,{memo:v}); }
function shCycleStage(cid){ var order=STAGES, it=SHAREDPOOL[cid]||{}; var cur=it.stage||'연락전'; setShared(cid,{stage:order[(order.indexOf(cur)+1)%order.length]}); }
function renderSharedPool(){
  buildNav(IS_SHARER?'share':'shared');   /* 팀장은 이 화면이 [쉐어] 탭이다 — 사이드바 하이라이트 일치 */
  var arr=sharedArr();
  var rows=arr.length?arr.map(function(it){
    var cid=it._cid;
    return '<div class="ins" style="align-items:flex-start"><div style="flex:1"><span class="nm">'+esc(it.nm||'(이름)')+'</span> '+chip(it.stage||'연락전')
      +'<div class="fd">'+esc(it.biz||'')+(it.phone?' · 📞 '+esc(it.phone):'')+'</div>'
      +'<div style="font-size:11px;color:#94a3b8;margin-top:2px">공유: '+esc(it.owner||'')+'</div>'
      +(it.memo?'<div style="font-size:12px;color:#475569;margin-top:4px;white-space:pre-wrap">'+esc(it.memo)+'</div>':'')+'</div>'
      +'<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">'
      +'<span class="st" style="cursor:pointer;background:#eef2ff;color:#4f46e5" onclick="shCycleStage(\''+cid+'\')">단계 변경 ▾</span>'
      +'<span class="ev" style="font-size:12px" onclick="shEditMemo(\''+cid+'\')">📝 메모</span>'
      +'</div></div>';
  }).join(''):'<div class="ins" style="color:#94a3b8">아직 공유된 고객이 없습니다. 고객 상세에서 <b>🤝 쉐어</b>를 켜면 여기(와 상대 화면)에 나타납니다.</div>';
  $('#main').innerHTML='<div class="top"><div style="display:flex;align-items:center;gap:10px"><button class="btn g menubtn" onclick="toggleMenu()">☰</button>'
    +'<div><h1>🤝 쉐어</h1><div class="date">'+(IS_SHARER?'사장님과 함께 진행하는 건 — 양쪽에서 같이 수정':'')+'</div></div></div></div>'
    +'<div class="panel"><div class="ph"><b>'+(IS_SHARER?'사장님과 공유한 건':'팀장과 공유한 건')+' ('+arr.length+')</b><span class="sub">양쪽에서 실시간으로 보고 같이 수정</span></div>'+rows+'</div>';
}

/* ===== 👥 팀장(쉐어) 로그인 모드 — 자기 담당 건만, /shares/<키>에서 (실고객 전체와 격리) ===== */
/* ★키는 sharers 노드의 name과 '정확히' 일치해야 한다(sharerEmail()이 name으로 조회).
   예: sharers.choi.name === '최병진 과장님' → 키도 '최병진 과장님'. '최병진'으로 넣으면 매칭 실패. */
const SHARER_EMAIL_BY_NAME = {'심연보':'shim7275@gmail.com','최병진 과장님':'eventist98@gmail.com'};   // 팀장 이름→구글 이메일 (여기 추가하면 자동 등록·잠금)
function sharerEmail(s){ return ((s&&s.email)||SHARER_EMAIL_BY_NAME[s&&s.name]||'').toLowerCase(); }
let SHARER_KEY='', SHARER_NAME='', SHARER_DEALS={};
function startSharer(email){
  if(_sharerStarted) return; _sharerStarted=true;
  email=(email||'').toLowerCase();
  try{
    RAWREF('shareAccess').once('value').then(function(s){
      var acc=s.val()||{}, key='';
      Object.keys(acc).forEach(function(k){ if(((acc[k]&&acc[k].email)||'').toLowerCase()===email) key=k; });
      if(!key){ showLogin('denied', email); try{firebase.auth().signOut();}catch(e){} return; }
      SHARER_KEY=key; SHARER_NAME=(acc[key]&&acc[key].name)||''; IS_SHARER=true;
      TENANT='ws/'+key;                     // ★팀장 전용 데이터 루트 (사장님 실데이터와 완전 분리)
      LSKEY='consultDATA_ws_'+key;
      startApp();                           // ★사장님과 동일한 풀 CRM을 자기 공간에서 실행
    }).catch(function(){ showLogin('denied', email); try{firebase.auth().signOut();}catch(e){} });
  }catch(e){ showLogin('denied', email); }
}
function sStColor(st){ return ({'대기':'#94a3b8','진행':'#3b82f6','완료':'#10b981','보류':'#f59e0b'})[st]||'#94a3b8'; }
function renderSharerBoard(){
  document.querySelectorAll('.side').forEach(function(x){ x.classList.add('hide'); });
  var m=$('#main'); if(!m) return; m.style.marginLeft='0'; m.style.maxWidth='760px'; m.style.margin='0 auto';
  var deals=Object.keys(SHARER_DEALS).map(function(id){ return Object.assign({id:id}, SHARER_DEALS[id]); });
  function feeRow(d,k){ var f=(k==='ins'?d.ins:d.tax)||{};
    return '<div class="ins"><div><span class="nm">'+esc(d.nm)+'</span><span class="fd">'+esc(d.biz||'')+' · '+esc(d.fund||'')+'</span><div style="margin-top:3px">'+chip(d.stage||'연락전')+'</div></div>'
    +'<div style="display:flex;align-items:center;gap:10px">'
    +'<span class="val" title="금액 수정" onclick="sEditAmt(\''+d.id+'\',\''+k+'\')">'+(f.amt?esc(''+f.amt):'＋ 금액')+'</span>'
    +'<span class="st" style="background:'+sStColor(f.status)+'1a;color:'+sStColor(f.status)+'" title="상태 변경(클릭)" onclick="sCycleStatus(\''+d.id+'\',\''+k+'\')">'+esc(f.status||'대기')+' ▾</span>'
    +'</div></div>'; }
  m.innerHTML='<div class="sharebar"><div class="badge">실시간 협업</div><div><b style="font-size:16px">'+esc(SHARER_NAME||'팀장')+'님 협업 보드</b>'
    +'<div style="font-size:12px;color:#a5b4fc">내 담당 건만 · 수정하면 실시간 반영 · 다른 고객/수익 안 보임</div></div>'
    +'<button class="btn" style="margin-left:auto;background:#1e293b;color:#cbd5e1;border:1px solid #334155;font-size:12px;padding:6px 12px" onclick="doSignOut()">로그아웃</button></div>'
    +'<div class="panel"><div class="ph"><b>🛡️ 보험 계약 ('+deals.length+'건)</b><span class="sub">금액·상태 눌러 수정</span></div>'+(deals.length?deals.map(function(d){return feeRow(d,'ins');}).join(''):'<div class="ins">담당 건이 없습니다.</div>')+'</div>'
    +'<div class="panel"><div class="ph"><b>🧾 세무 이관</b><span class="sub">금액·상태 눌러 수정</span></div>'+(deals.length?deals.map(function(d){return feeRow(d,'tax');}).join(''):'<div class="ins">담당 건이 없습니다.</div>')+'</div>';
}
function sCycleStatus(id,k){
  var order=['대기','진행','보류','완료'], fk=(k==='ins'?'ins':'tax');
  var cur=(SHARER_DEALS[id]&&SHARER_DEALS[id][fk]&&SHARER_DEALS[id][fk].status)||'대기';
  var next=order[(order.indexOf(cur)+1)%order.length];
  RAWREF('shares/'+SHARER_KEY+'/deals/'+id+'/'+fk+'/status').set(next);
  try{toast('상태 → '+next);}catch(e){}
}
function sEditAmt(id,k){
  var fk=(k==='ins'?'ins':'tax'), cur=(SHARER_DEALS[id]&&SHARER_DEALS[id][fk]&&SHARER_DEALS[id][fk].amt)||'';
  var v=prompt('금액 입력 (예: 300만 / 3000000)', cur); if(v===null) return;
  RAWREF('shares/'+SHARER_KEY+'/deals/'+id+'/'+fk+'/amt').set((''+v).trim());
  try{toast('금액 저장됨');}catch(e){}
}
/* 사장님 화면: 팀장별 미러 동기화 (customers → shares). 팀장이 고친 금액·상태는 보존(덮지 않음) */
/* 사장님 화면: ①팀장 이메일 shareAccess 등록 ②담당팀장(이메일 등록됨) 지정된 고객을 공유풀에 자동 등록
   (없을 때만 생성 → 팀장·사장님이 공유탭에서 고친 협업 내용은 보존. shared===false면 제외) */
function syncMirror(){
  if(offline || IS_SHARER || TENANT || NS || shareId) return;
  try{
    sharerArr().forEach(function(s){ var em=sharerEmail(s); if(em) RAWREF('shareAccess/'+s.id).set({email:em, name:s.name||''}); });
    custArr().forEach(function(c){
      if(c.shared===false) return;
      custSharers(c).forEach(function(sid){
        var s=getSharer(sid); if(!s || !sharerEmail(s)) return;
        var r=RAWREF('shared/'+sid+'/items/'+c.id);
        r.once('value').then(function(snap){ if(!snap.exists()) r.set(shareSnapshot(c.id,c)); }).catch(function(){});
      });
    });
  }catch(e){}
}

/* ===== 🔐 로그인 게이트 (실데이터 보호) ===== */
/* AUTH_REQUIRED=false 면 지금과 100% 동일(게이트 OFF). 콘솔 셋업+이메일 확정 후 true 로. */
const AUTH_REQUIRED=true;           // 🔒 로그인 강제 ON (2026-07-07 보안 잠금)
const AUTH_WHITELIST=['ages6917@gmail.com'];   // 허용 Gmail (팀원 추가 시 이 배열에 이메일 추가)
let ME_EMAIL='';
function authNeeded(){ return AUTH_REQUIRED && !shareId && NS!=='demo'; }   // 데모/공유뷰는 로그인 불필요
if(authNeeded()){
  let _auth=null; try{ _auth=firebase.auth(); }catch(e){ _auth=null; }
  if(!_auth){ startApp(); }
  else{
    showLogin('checking');
    try{ _auth.getRedirectResult().catch(function(e){ if(e&&(e.message||e.code)) alert('로그인 오류: '+((e.message)||e.code)); }); }catch(e){}
    _auth.onAuthStateChanged(u=>{
      if(!u){ showLogin('signin'); return; }
      const em=(u.email||'').toLowerCase();
      if(AUTH_WHITELIST.length && AUTH_WHITELIST.map(e=>e.toLowerCase()).indexOf(em)<0){
        ME_EMAIL=em; hideLogin(); startSharer(em); return;   // 화이트리스트 아님 → 팀장(쉐어) 로그인 모드 시도
      }
      ME_EMAIL=em; hideLogin(); startApp();
    });
  }
} else { startApp(); }
function showLogin(mode, em){
  let ov=document.getElementById('loginScreen');
  if(!ov){ ov=document.createElement('div'); ov.id='loginScreen'; ov.className='loginscreen'; document.body.appendChild(ov); }
  if(mode==='checking'){ ov.innerHTML='<div class="login-card"><div class="spin2" style="margin:0 auto 14px"></div><div style="color:#94a3b8;font-size:13px">로그인 확인 중…</div></div>'; return; }
  const denied = mode==='denied' ? `<div class="login-deny">⚠ <b>${esc(em||'')}</b> 계정은 접근 권한이 없습니다.<br>관리자에게 등록을 요청하세요.</div>` : '';
  ov.innerHTML=`<div class="login-card">
    <div class="login-logo">💼</div>
    <div class="login-t">컨설팅 CRM</div>
    <div class="login-s">정책자금 · 보험 · 세무 · 팀 협업 보드</div>
    ${denied}
    <button class="login-g" onclick="doGoogleLogin()"><span class="gicon">G</span> Google로 로그인</button>
    <div class="login-note">🔒 등록된 팀원만 접근할 수 있습니다</div>
  </div>`;
}
function hideLogin(){ const o=document.getElementById('loginScreen'); if(o)o.remove(); }
function doGoogleLogin(){
  let auth; try{ auth=firebase.auth(); }catch(e){ alert('로그인 모듈 로드 실패'); return; }
  const prov=new firebase.auth.GoogleAuthProvider();
  prov.setCustomParameters({prompt:'select_account'});   // 항상 계정 선택 (엉뚱한 계정 방지)
  // 팝업 우선(모바일 Chrome도 새 탭으로 잘 됨) → 실패 시 리다이렉트 폴백
  auth.signInWithPopup(prov).catch(function(e){
    var code=(e&&e.code)||'';
    if(code.indexOf('popup')>=0 || code==='auth/cancelled-popup-request'){ try{ auth.signInWithRedirect(prov); return; }catch(_){}}
    alert('로그인 실패: '+((e&&e.message)||code||'알 수 없음'));
  });
}
function doSignOut(){ try{ firebase.auth().signOut().then(()=>location.reload()); }catch(e){ location.reload(); } }

/* ===== 헬퍼 ===== */
const $=s=>document.querySelector(s);
const esc=s=>(''+ (s??'')).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const chip=s=>`<span class="chip" style="background:${(STAGE[s]||'#94a3b8')}1a;color:${STAGE[s]||'#94a3b8'}">${esc(s)}</span>`;
function _csk(c){ if(c.created) return c.created; const m=(''+c.id).match(/c(\d+)/); return m?parseInt(m[1],10):0; }
function custArr(){ return Object.entries(DATA.customers||{}).map(([id,c])=>({id,...c})).sort((a,b)=>_csk(b)-_csk(a)); }
function sharerArr(){ return Object.entries(DATA.sharers||{}).map(([id,s])=>({id,...s})); }
function getCust(id){ const c=(DATA.customers||{})[id]; return c?{id,...c}:null; }
function getSharer(id){ const s=(DATA.sharers||{})[id]; return s?{id,...s}:null; }
/* 고객의 담당 팀장(쉐어) — 다중 지원. c.sharers 배열 우선, 없으면 단일 c.sharer 폴백 */
function custSharers(c){ if(!c) return []; if(Array.isArray(c.sharers)) return c.sharers.filter(Boolean); return c.sharer?[c.sharer]:[]; }
function custSharerNames(c){ return custSharers(c).map(id=>{const s=getSharer(id);return s?s.name:'';}).filter(Boolean); }
/* 소개자(referrer) — 다중 지원. 소개자도 쉐어에 참여함 */
function custReferrers(c){ if(!c) return []; if(Array.isArray(c.referrers)) return c.referrers.filter(Boolean); return c.referrer?[c.referrer]:[]; }
function custReferrerNames(c){ return custReferrers(c).map(id=>{const s=getSharer(id);return s?s.name:'';}).filter(Boolean); }
/* 담당 팀장 + 소개자 = 쉐어 참여 전원(중복 제거) */
function custShareParty(c){ const set=[]; custSharers(c).concat(custReferrers(c)).forEach(id=>{ if(id&&set.indexOf(id)<0)set.push(id); }); return set; }
/* 사업자/상호명 — 다중 지원. c.bizNames 배열 우선, 없으면 단일 c.bizName 폴백 */
function custBizNames(c){ if(!c) return []; if(Array.isArray(c.bizNames)) return c.bizNames.filter(Boolean); return c.bizName?[c.bizName]:[]; }
/* 유형(개인/법인 등) — 다중 지원. c.types 배열 우선, 없으면 c.type 문자열(·구분) 폴백 */
function custTypes(c){ if(!c) return []; if(Array.isArray(c.types)) return c.types.filter(Boolean); return c.type?(''+c.type).split('·').filter(Boolean):[]; }
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1400);}

/* ===== 수수료·계약 모델 (보험/컨설팅/세무 각 예정·완료 + 금액 → 자동 합산) ===== */
const FEE_KEYS=[['insurance','🛡️','보험 계약'],['consulting','🏦','컨설팅 수수료'],['tax','🧾','세무 이관']];
function won(s){ if(typeof s==='number')return s; const raw=(''+(s||'')); s=raw.replace(/[,\s원]/g,''); if(!s)return 0;
  let v=0,m,hasUnit=false; m=s.match(/([\d.]+)억/); if(m){v+=parseFloat(m[1])*10000;hasUnit=true;}
  m=s.match(/([\d.]+)천/); if(m){v+=parseFloat(m[1])*1000;hasUnit=true;}
  m=s.match(/([\d.]+)만/); if(m){v+=parseFloat(m[1]);hasUnit=true;}
  if(!hasUnit){ const n=parseFloat(s); if(!isNaN(n)){ if(/[원,]/.test(raw)||n>=10000) v+=n/10000; else v+=n; } }
  return Math.round(v); }                                  // 단위: 만원
function fmtMan(v){ v=Math.round(v||0); if(!v)return '0'; if(v>=10000){ return (Math.round(v/100)/100).toLocaleString()+'억'; } return v.toLocaleString()+'만'; }
function fmtAmt(a){ if(a==null||a==='') return ''; const m=won(a); return m? fmtMan(m)+'원' : esc(''+a)+'원'; }
function fee(c,k){ const f=((c&&c.fees)||{})[k];
  if(f) return {status:f.status||'없음', amt:f.amt||''};
  if(k==='insurance'&&c){ const st=c.insStatus==='완료'?'완료':(c.ins?'예정':'없음'); return {status:st, amt:c.ins||''}; }
  return {status:'없음', amt:''}; }
function setFee(id,k,patch){ const c=getCust(id)||{}; const fees=Object.assign({},c.fees);
  const cur=Object.assign({status:'없음',amt:''}, fees[k]||{}); fees[k]=Object.assign(cur,patch);
  /* ★2026-07-15 — '완료'로 바뀌는 순간 완료일(doneAt)을 찍는다.
     이게 없어서 "이번 달 수익이 얼마인가"를 계산할 수 없었다(수익에 월 귀속 정보가 없음).
     기존 완료건은 doneAt이 없으므로 리포트에서 '월 미상'으로 따로 표시한다(지어내지 않는다). */
  if(patch && patch.status==='완료' && !fees[k].doneAt) fees[k].doneAt=today();
  if(patch && patch.status && patch.status!=='완료') delete fees[k].doneAt;
  setCust(id,{fees}); }
/* ===== 세무 이관: 사업자 여러 건(개인/법인별 금액 직접입력·합산) ===== */
function taxItems(c){ return (((c&&c.fees)||{}).tax||{}).items || []; }
function taxMult(c){ const m=(((c&&c.fees)||{}).tax||{}).mult; return (m&&+m>0)?+m:6; }   // 세무이관 수수료 = 월 기장료 × 배수(기본 6배)
function taxBaseWon(c){ return taxItems(c).reduce((a,it)=>a+won(it&&it.amt),0); }         // 월 기장료 합(만원)
function taxWon(c){ return Math.round(taxBaseWon(c)*taxMult(c)); }                          // 세무이관 수수료(만원) = 기장료 × 배수
function taxSharePct(c){ const p=(((c&&c.fees)||{}).tax||{}).shrPct; return p?+p:0; }
function taxShareWon(c){ return Math.round(taxWon(c)*taxSharePct(c)/100); }                 // 쉐어 몫(만원)
function feeWon(c,k){ if(k==='tax'){ const it=taxItems(c); if(it.length) return taxWon(c); } return won(fee(c,k).amt); }
function feeAmtDisp(c,k){ if(k==='tax'){ const it=taxItems(c); if(it.length){ const shp=taxSharePct(c); return fmtMan(taxWon(c))+'원'+(shp?' · 쉐어 '+shp+'% → '+fmtMan(taxShareWon(c))+'원':''); } } const a=fee(c,k).amt; return a?fmtAmt(a):''; }
function addTaxItem(id){ const c=getCust(id)||{}; const items=taxItems(c).slice(); items.push({type:'개인',amt:''}); const cur=fee(c,'tax'); setFee(id,'tax', cur.status==='없음'?{items,status:'예정'}:{items}); }
function delTaxItem(id,ix){ const items=taxItems(getCust(id)).slice(); items.splice(ix,1); setFee(id,'tax',{items}); }
function _taxPatch(id,ix,patch){ const items=taxItems(getCust(id)).slice(); items[ix]=Object.assign({},items[ix]||{},patch); setFee(id,'tax',{items}); }
function iTaxType(box,id,ix){ if(box.querySelector('select'))return; const cur=(taxItems(getCust(id))[ix]||{}).type||'개인';
  box.innerHTML=`<select class="iedit">${['개인','법인'].map(o=>`<option ${o===cur?'selected':''}>${o}</option>`).join('')}</select>`;
  const sel=box.querySelector('select'); sel.focus();
  const done=()=>{ if(box.dataset.done)return; box.dataset.done='1'; _taxPatch(id,ix,{type:sel.value}); }; sel.onchange=done; sel.onblur=done; }
function iTaxAmt(box,id,ix){ if(box.querySelector('input'))return; const cur=(taxItems(getCust(id))[ix]||{}).amt||'';
  box.innerHTML=`<input class="iedit" value="${esc(cur)}" placeholder="월 기장료 예: 100,000원 ~ 150,000원">`;
  const inp=box.querySelector('input'); inp.focus(); inp.select();
  const done=()=>{ if(box.dataset.done)return; box.dataset.done='1'; _taxPatch(id,ix,{amt:inp.value.trim()}); };
  inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();inp.blur();} else if(e.key==='Escape'){box.dataset.done='1';rerender();} }; inp.onblur=done; }
function iTaxMult(box,id){ if(box.querySelector('input'))return; const cur=taxMult(getCust(id));
  box.innerHTML=`<input class="iedit" style="width:44px" value="${cur}" placeholder="6">`;
  const inp=box.querySelector('input'); inp.focus(); inp.select();
  const done=()=>{ if(box.dataset.done)return; box.dataset.done='1'; let v=parseFloat(inp.value); if(isNaN(v)||v<=0)v=6; setFee(id,'tax',{mult:v}); };
  inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();inp.blur();} else if(e.key==='Escape'){box.dataset.done='1';rerender();} }; inp.onblur=done; }
const PRODUCT_TYPES=['미지정','관리계약(벤처·특허·연구소)','재무 관리','정책자금-시설자금','정책자금-운영자금'];
const PT_CUSTOM='✍️ 직접 입력…';
function iProductType(box,id){
  if(box.querySelector('select,input'))return;
  const cur=(((getCust(id)||{}).fees||{}).product||{}).type||'';
  let opts=PRODUCT_TYPES.map(o=>`<option ${o===(cur||'미지정')?'selected':''}>${esc(o)}</option>`);
  if(cur && !PRODUCT_TYPES.includes(cur)) opts.unshift(`<option selected>${esc(cur)}</option>`);  // 직접 입력값 표시
  opts.push(`<option>${PT_CUSTOM}</option>`);
  box.innerHTML=`<select class="iedit">${opts.join('')}</select>`;
  const sel=box.querySelector('select'); sel.focus();
  let handled=false;
  const done=()=>{ if(handled)return; handled=true;
    if(sel.value===PT_CUSTOM) return promptCustomType(box,id);
    setFee(id,'product',{type:sel.value==='미지정'?'':sel.value}); };
  sel.onchange=done; sel.onblur=done;
}
function promptCustomType(box,id){
  const cur=(((getCust(id)||{}).fees||{}).product||{}).type||'';

function custTotal(c,status){ return ['insurance','consulting','tax'].reduce((a,k)=>{const f=fee(c,k);return f.status===status?a+feeWon(c,k):a;},0); }
/* 스트림별 쉐어 몫(만원) — 세무는 taxShareWon, 나머지는 금액×shrPct% */
function feeShareWon(c,k){ if(k==='tax'){ const it=taxItems(c); if(it.length) return taxShareWon(c); } const pct=(((c&&c.fees)||{})[k]||{}).shrPct; return pct?Math.round(feeWon(c,k)*(+pct)/100):0; }
/* ★2026-07-15 버그수정 — 종전엔 고객 '단계'를 전혀 보지 않고 fees.status만 봤다.
   그래서 고객을 '부결'로 바꿔도 보험·세무 '예정' 금액이 수익 현황에 그대로 남아
   실제로는 날아간 돈이 계속 잡혀 있었다(엄태훈 건으로 실측 확인).
   → 부결 고객의 '예정'은 집계에서 제외한다.
   ※ '완료'는 제외하지 않는다: 이미 성사·입금된 건이라 나중에 자금이 부결돼도 수수료는 남는다.
     (부결 = 정책자금 심사 결과일 뿐, 이미 체결된 보험계약이 취소되는 건 아님) */
const DEAD_STAGES=['부결'];
function isDeadCust(c){ return DEAD_STAGES.indexOf((c&&c.stage)||'')>=0; }
function aggFees(){ const cs=custArr(); const out={};
  ['insurance','consulting','tax'].forEach(k=>{ let dA=0,dN=0,pA=0,pN=0,dSh=0,pSh=0,xA=0,xN=0;
    cs.forEach(c=>{ const f=fee(c,k); const a=feeWon(c,k); const sh=feeShareWon(c,k);
      if(f.status==='완료'){dA+=a;dN++;dSh+=sh;}
      else if(f.status==='예정'){
        if(isDeadCust(c)){ xA+=a; xN++; }        // 부결 → 예정에서 제외(따로 집계해 보여줌)
        else { pA+=a;pN++;pSh+=sh; }
      } });
    out[k]={dA,dN,pA,pN,dSh,pSh,xA,xN}; });   // xA/xN = 부결로 제외된 금액·건수
  return out; }
/* ★2026-07-16 서류 목록 단일 창구 — "서류함이 실시간 반영 안 된다"의 진짜 원인
   클라우드 v2(2026-07-15) 이후 업로드는 전부 customers/<id>/docsData 에 들어간다.
   그런데 서류함 목록 페이지(renderDocs)·docState·aiContext 는 여전히 옛 필드 c.docs
   (파일서버 시절의 이름-only 메타)를 읽고 있었다.
   → 파일을 올려도 docsData만 커지고 c.docs는 그대로 → 목록 숫자가 안 변함.
     RTDB 구독·rerender는 정상 작동 중이었다(=실시간 자체는 멀쩡했고, 읽는 곳이 틀렸다).
   → 앞으로 서류 개수·목록은 반드시 이 함수 하나로만 읽는다. c.docs 직접 참조 금지.
   docsData(실물 보유) 우선, 없으면 legacy docs(이름만)로 폴백해 과거 데이터도 안 잃는다. */
function docList(c){
  if(!c) return [];
  var d=c.docsData;
  if(d && typeof d==='object'){
    var k=Object.keys(d);
    if(k.length) return k.map(function(id){ return Object.assign({_id:id,_cloud:true}, d[id]); });
  }
  return (c.docs||[]).map(function(x){ return {name:(x&&x.name)||x||'서류', _legacy:true}; });
}
function docState(c){ return c.docStatus || (docList(c).length?'접수완료':'접수전'); }
function toggleDocStatus(id){ const c=getCust(id)||{}; const next=docState(c)==='접수완료'?'접수전':'접수완료'; const patch={docStatus:next}; if(next==='접수완료'&&!c.docDate) patch.docDate=today(); setCust(id,patch); }
function today(){ try{ return new Date().toISOString().slice(0,10); }catch(e){ return ''; } }

  inp.onblur=done; }
/* 스트림별 쉐어 팀장 (보험 쉐어 ≠ 세무 쉐어 가능, 다자 쉐어) */
function feeShr(c,k){ const f=((c&&c.fees)||{})[k]; return (f&&f.shr) || (c&&c.sharer) || ''; }   // 명시 없으면 메인 담당으로 폴백
function shrShort(name){ return (name||'').replace(/\s*(팀장님|과장님|팀장|대표님)\s*$/,''); }

/* 쉐어 비율(%) 선택 — 5% 단위 5~100%, + 직접입력 (보통 30~70% 쉐어) */
function iFeeSharePct(box,id,k){
  if(box.querySelector('select'))return;
  const cur=(((getCust(id)||{}).fees||{})[k]||{}).shrPct||'';
  let opts=['<option value="">비율 없음</option>'];
  if(cur && (+cur)%5!==0) opts.push(`<option value="${cur}" selected>${cur}%</option>`);   // 5의 배수 아닌 기존값
  for(let v=5; v<=100; v+=5){ opts.push(`<option value="${v}" ${(''+v===''+cur)?'selected':''}>${v}%</option>`); }
  opts.push('<option value="__c">✍️ 직접 입력…</option>');
  box.innerHTML=`<select class="iedit">${opts.join('')}</select>`;
  const sel=box.querySelector('select'); sel.focus();
  const done=()=>{ if(box.dataset.done)return;
    if(sel.value==='__c'){ box.dataset.done='1'; return promptSharePct(box,id,k); }
    box.dataset.done='1'; setFee(id,k,{shrPct: sel.value?(+sel.value):''}); };
  sel.onchange=done; sel.onblur=done;
}
function promptSharePct(box,id,k){
  const cur=(((getCust(id)||{}).fees||{})[k]||{}).shrPct||'';
  box.innerHTML=`<input class="iedit" style="width:64px" value="${cur}" placeholder="%" inputmode="numeric">`;
  const inp=box.querySelector('input'); inp.focus(); inp.select();
  let h=false; const ok=()=>{ if(h)return; h=true; let v=parseFloat(inp.value); if(isNaN(v))v=''; else v=Math.max(1,Math.min(100,Math.round(v))); setFee(id,k,{shrPct:v}); };
  inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();inp.blur();} else if(e.key==='Escape'){h=true;rerender();} };
  inp.onblur=ok;

/* 쓰기 → RTDB (모두에게 실시간 반영) · 잠김/오프라인이면 로컬 즉시 반영 */
function setCust(id,patch){
  if(!('up' in patch)) patch={...patch, up:Date.now()};        // 마지막 활동 시각 (액션 큐 정체 감지용)
  DATA.customers=DATA.customers||{};
  DATA.customers[id]={...(DATA.customers[id]||{}),...patch};   // 낙관적 로컬 반영
  rerender(); _lsave();
  if(offline){ toast('저장됨 ✓ (이 PC)'); return; }
  dref('customers/'+id).update(patch)
    .then(()=>toast('저장됨 ✓'))
    .catch(()=>{ offline=true; _lsave(); toast('저장됨 ✓ (이 PC)'); });
  _mirrorShared(id);   /* ★2026-07-16 — 쉐어건이면 팀장 화면에도 즉시 반영 */
}
/* ===== 쉐어건 실시간 미러 (2026-07-16 신설) =====
   사고: 사장님이 진단서를 만들거나 단계를 바꿔도 팀장 화면은 그대로였다.
   원인: shared/<sid>/items 는 ①쉐어 켜는 순간(toggleShare) ②syncMirror가 '없을 때만 생성'
         — 이 두 곳에서만 쓰였다. 즉 최초 1회 복사 후 영영 갱신 안 됨.
   처방: 값이 바뀔 때마다(setCust) 담당 팀장 노드에 최신 스냅샷을 덮어쓴다.
   · 쉐어 안 켠 건은 아무것도 안 함(팀장에게 새어나가지 않음)
   · 실패해도 본 저장은 이미 끝났으므로 조용히 무시 */
function _mirrorShared(id){
  try{
    if(typeof offline!=='undefined' && offline) return;
    var c=getCust(id); if(!c||!c.shared) return;
    var targets=shareTargets(c); if(!targets.length) return;
    var snap=shareSnapshot(id,c);
    targets.forEach(function(sid){
      try{ RAWREF('shared/'+sid+'/items/'+id).update(snap); }catch(e){}
    });
  }catch(e){}
}
/* ===== 인라인 편집: 팝업 없이 그 자리에서 클릭→입력 ===== */
function _commit(box,id,key,val,save){
  if(box.dataset.done) return; box.dataset.done='1';
  if(save){ const patch={[key]:(''+val).trim()}; if(key==='stage'){ patch.contacted = patch.stage!=='연락전'; } setCust(id,patch); }
  else { rerender(); }
}

}

const SHARER_COLORS=['#3b82f6','#10b981','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#ef4444','#14b8a6'];

const FILESRV='http://127.0.0.1:8799';
function _b64(f){ return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);}); }
async function docUpload(id,fileList,opts){
  opts=opts||{};
  const c=getCust(id)||{}; const nm=c.nm||id; const files=[...fileList]; if(!files.length)return;
  if(!opts.silent) toast('업로드 중… '+files.length+'개'); let last=null;
  for(const f of files){
    if(f.size>40*1024*1024){ if(!opts.silent) toast(f.name+' 40MB 초과 — 제외'); continue; }
    try{ const data=await _b64(f);
      const r=await fetch(FILESRV+'/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer:nm,name:f.name,data})});
      last=await r.json();
    }catch(e){ if(!opts.silent) toast('⚠ 데탑 파일서버 꺼짐 — 데탑에서 대시보드 열어야 업로드돼요'); return; }
  }
  if(last&&last.files){ const cc=getCust(id)||{}; setCust(id,{docs:last.files.map(x=>({name:x.name})),docStatus:'접수완료',...(cc.docDate?{}:{docDate:today()})}); toast(opts.silent?('서류 '+last.files.length+'개 저장 ✓'):'저장 완료 ✓ (D드라이브)'); }
}

function autoSummaryText(c){
  const L=[]; c=c||{};

  const ty=custTypes(c); if(ty.length)L.push('• 유형: '+ty.join('·'));
  if(c.fund&&c.fund!=='-')L.push('• 신청 금액: '+c.fund);
  const stg=custStages(c); if(stg.length)L.push('• 진행 단계: '+stg.join(', '));
  const shr=custSharerNames(c); if(shr.length)L.push('• 담당 팀장: '+shr.join(', '));
  const ref=custReferrerNames(c); if(ref.length)L.push('• 소개자: '+ref.join(', '));
  if(c.received)L.push('• 최초 접수일: '+c.received);
  if(c.fu)L.push('• ⏰ 재연락 예정: '+c.fu);
  try{ const done=custTotal(c,'완료'), pend=custTotal(c,'예정'); if(done||pend)L.push('• 수수료: 완료 '+fmtMan(done)+'원 · 예정 '+fmtMan(pend)+'원'); }catch(e){}

}

  const TONE={good:'#059669',bad:'#dc2626',warn:'#ea580c','':'#1e293b'};

  /* ① 헤더 — 상호·업종·대표·지역 / 사업자번호·결산일 / 자격배지 / 종합진단 */
  const p=sm.profile||{};
  const hdName=p.bizName||custBizNames(c)[0]||c.nm||'';
  const hdSub=[p.industry,p.owner?('대표 '+p.owner):'',p.region?(p.region+(p.tenure?'('+p.tenure+')':'')):''].filter(Boolean).join(' · ');
  const hdSub2=[p.bizNo?('사업자 '+p.bizNo):'',p.settleDate?('결산 '+p.settleDate):''].filter(Boolean).join(' · ');
  const badges=(sm.badges||[]).map(b=>`<span class="dg-bdg">${esc(b)}</span>`).join('');
  const vd=sm.verdict||{};
  const header=(hdName||vd.label)?`<div class="dg-hd">
      <div class="dg-hd-l">
        ${hdName?`<div class="dg-nm">${esc(hdName)}</div>`:''}
        ${hdSub?`<div class="dg-sub">${esc(hdSub)}</div>`:''}
        ${hdSub2?`<div class="dg-sub">${esc(hdSub2)}</div>`:''}
        ${badges?`<div class="dg-bdgs">${badges}</div>`:''}
      </div>
      ${vd.label?`<div class="dg-hd-r"><div class="dg-vt">종합 진단</div>
        <div class="dg-vl" style="color:${vd.tone==='good'?'#6ee7b7':vd.tone==='bad'?'#fca5a5':'#fcd34d'}">${esc(vd.label)} ${vd.tone==='good'?'':'⚠'}</div>
        ${vd.sub?`<div class="dg-vs">${esc(vd.sub)}</div>`:''}</div>`:''}
    </div>`:'';

  /* ② 한 줄 총평 */
  const headline=sm.headline?`<div class="dg-line">${esc(sm.headline)}</div>`:'';

  /* ③ KPI 4칸 (없으면 구버전 자산/부채/자본/부채비율로 폴백) */
  let kpis=sm.kpis||[];
  if(!kpis.length){
    kpis=[{label:'자산총계',value:A('asset',sm.asset)},{label:'부채총계',value:A('liab',sm.liab)},
          {label:'자본총계',value:A('cap',sm.cap)},{label:'부채비율',value:sm.debtRatio,tone:'bad'}].filter(k=>k.value);
  }
  const kpiHtml=kpis.length?`<div class="dg-kpis">${kpis.slice(0,4).map(k=>
    `<div class="dg-kpi"><div class="dg-kv" style="color:${TONE[k.tone||'']||TONE['']}">${esc(k.value)}</div><div class="dg-kl">${esc(k.label)}</div></div>`).join('')}</div>`:'';

  /* ④ 매출 추이 + ⑤ 재무상태 (2단) */
  const sales=sm.sales||[]; const mx=Math.max(1,...sales.map(s=>+s.v||0));
  const bars=sales.map(s=>{const h=Math.max(8,Math.round((+s.v||0)/mx*100));
    return `<div class="bar"><div class="bb" style="height:${h}%">${esc(s.v)}억</div><div class="yl">${esc(s.y)}</div></div>`;}).join('');
  const salesBox=sales.length?`<div class="dg-box"><div class="dg-bt">매출 추이</div>
      <div class="bars">${bars}</div>
      ${sm.salesTrend?`<div class="dg-trend">${esc(sm.salesTrend)}</div>`:(sm.salesNote?`<div class="dg-trend" style="color:#94a3b8">${esc(sm.salesNote)}</div>`:'')}</div>`:'';
  const fr=(l,v,style)=>v?`<div class="dg-fr"><span class="dg-fl">${l}</span><span class="dg-fv" style="${style||''}">${esc(v)}</span></div>`:'';
  const finRows=[fr('자산총계',A('asset',sm.asset)),
    fr('&nbsp;&nbsp;ㄴ 재고자산',A('inventory')+(fin.inventoryPct?' ('+fin.inventoryPct+')':''),'color:#dc2626'),
    fr('&nbsp;&nbsp;ㄴ 현금성자산',A('cash')),
    fr('부채총계',A('liab',sm.liab)),fr('자본총계',A('cap',sm.cap)),
    fr('이익잉여금',A('retained'),(''+A('retained')).indexOf('-')===0?'color:#dc2626':'color:#059669')].join('');
  const finBox=finRows.replace(/\s/g,'')?`<div class="dg-box"><div class="dg-bt">재무상태${p.settleDate?` <span style="font-weight:500;color:#94a3b8">(${esc(p.settleDate)})</span>`:''}</div>${finRows}</div>`:'';
  const grid2=(salesBox||finBox)?`<div class="dg-2">${salesBox}${finBox}</div>`:'';

  /* ⑥ 기관별 대출·부채 표 */
  const lns=sm.loans||[];
  const loanRows=lns.map(l=>`<tr><td>${esc(l.bank||'')}</td>
      <td style="text-align:center">${l.type?`<span class="dg-tag t-${/보증/.test(l.type)?'b':/정책/.test(l.type)?'p':/상거래/.test(l.type)?'o':'s'}">${esc(l.type)}</span>`:esc(l.desc||'')}</td>
      <td style="text-align:right;font-weight:800">${esc(l.amt||'')}${l.note?` <span style="font-weight:500;color:#94a3b8;font-size:11px">${esc(l.note)}</span>`:''}</td></tr>`).join('');
  const loanBox=lns.length?`<div class="dg-box" style="margin-top:12px"><div class="dg-bt">대출 · 부채 현황 — 기관별</div>
      <div style="overflow-x:auto"><table class="dg-tb"><thead><tr><th>구분 / 기관</th><th style="text-align:center">유형</th><th style="text-align:right">금액</th></tr></thead>
      <tbody>${loanRows}
        ${sm.loanTotal?`<tr class="dg-sum"><td>차입금 합계${sm.loanInterest?` (이자 연 ${esc(sm.loanInterest)})`:''}</td><td></td><td style="text-align:right">${esc(sm.loanTotal)}</td></tr>`:''}
        ${sm.payables?`<tr><td>매입채무 (외상매입금)</td><td style="text-align:center"><span class="dg-tag t-o">상거래</span></td><td style="text-align:right;font-weight:800">${esc(sm.payables)}</td></tr>`:''}
        ${(sm.liabTotal||A('liab',sm.liab))?`<tr class="dg-sum"><td>부채총계</td><td></td><td style="text-align:right">${esc(sm.liabTotal||A('liab',sm.liab))}</td></tr>`:''}
      </tbody></table></div>
      ${sm.loanNote?`<div class="dg-note">※ ${esc(sm.loanNote)}</div>`:''}</div>`:'';

  /* ⑦ 핵심 리스크 + ⑧ 컨설팅 방향 (2단) */
  const risks=(sm.risks||[]).slice(0,3).map(r=>`<li><b style="color:#b91c1c">🔴 ${esc(r.title)}</b>${r.desc?` — ${esc(r.desc)}`:''}</li>`).join('');
  const dirs=(sm.directions||[]).slice(0,4).map((d,i)=>`<li><b style="color:#1d4ed8">${'①②③④'[i]||'·'} ${esc(d.title)}:</b>${d.desc?` ${esc(d.desc)}`:''}</li>`).join('');
  const riskBox=risks?`<div class="dg-box"><div class="dg-bt" style="color:#b91c1c">핵심 리스크 ${(sm.risks||[]).length}</div><ul class="dg-ul">${risks}</ul></div>`:'';
  const dirBox=dirs?`<div class="dg-box"><div class="dg-bt" style="color:#047857">컨설팅 방향</div><ul class="dg-ul">${dirs}</ul></div>`:'';
  const grid3=(riskBox||dirBox)?`<div class="dg-2" style="margin-top:12px">${riskBox}${dirBox}</div>`:'';

  return `<div class="fsum dg">
    ${rv?`<div class="warn" style="background:#fffbeb;color:#b45309;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px">🤖 AI 자동분석 · <b>미검수</b> <button class="btn b" style="padding:4px 11px;font-size:11.5px;flex-shrink:0" onclick="markReviewed('${id}')">✅ 검수완료</button></div>`:''}
    ${header}${headline}${kpiHtml}${grid2}${loanBox}${grid3}
    ${sm.warn?`<div class="warn" style="margin-top:12px">⚠ ${esc(sm.warn)}</div>`:''}
    ${sm.credit?`<div class="credit">✓ ${esc(sm.credit)}</div>`:''}
    <div style="text-align:right;margin-top:12px">
      <span class="add" onclick="autoSummarizeStored('${id}')" style="margin-right:8px">🔄 서류로 다시 분석</span>
      <span class="add" onclick="editSummary('${id}')">✏️ 요약 수정</span></div></div>`;
}

let REQFILES=[]; let REQAUDIO=[];
function reqAddFiles(fl){ for(const f of fl){ REQFILES.push(f); } reqRenderList(); }   // 실제 File 객체 보관(업로드용)
function reqDrop(e){ e.preventDefault(); e.currentTarget.classList.remove('drag'); if(e.dataTransfer&&e.dataTransfer.files) reqAddFiles(e.dataTransfer.files); }
function reqRenderList(){ const el=document.getElementById('reqList'); if(!el)return;
  el.innerHTML=REQFILES.map((f,i)=>`<div class="reqfile">📄 ${esc(f.name)}<span class="x" onclick="REQFILES.splice(${i},1);reqRenderList()">✕</span></div>`).join(''); }
function reqAddAudio(fl){ for(const f of fl){ REQAUDIO.push(f); } reqRenderAudio(); }
function reqRenderAudio(){ const el=document.getElementById('reqAudioList'); if(!el)return;
  el.innerHTML=REQAUDIO.map((f,i)=>`<div class="reqfile">🎙️ ${esc(f.name)}<span class="x" onclick="REQAUDIO.splice(${i},1);reqRenderAudio()">✕</span></div>`).join(''); }
function fileToDataURL(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); }); }
async function craftRequest(){
  const nm=document.getElementById('reqNm').value.trim();
  const note=document.getElementById('reqNote').value.trim();
  const files=REQFILES.slice();
  const audios=REQAUDIO.slice();
  if(!nm && !files.length && !audios.length){ toast('고객명·서류·음성 중 하나는 추가하세요'); return; }
  // 음성 → base64(클라우드) 변환 (cap 9MB)
  const arec=[];
  for(const f of audios){
    if(f.size>9*1024*1024){ toast(f.name+' 9MB 초과 — 긴 녹음은 데탑에서'); continue; }
    try{ arec.push({name:f.name, ts:Date.now(), mode:'c', data:await fileToDataURL(f)}); }catch(e){}
  }
  const id='c'+Date.now();
  setCust(id,{nm:nm||'(이름 미정)', docs:files.map(f=>({name:f.name})), ...(arec.length?{arec}:{}), cnote:note?('[요약 요청] '+note):'',
    received:today(), docStatus:files.length?'접수완료':'접수전', docDate:files.length?today():'',
    stage:'연락전', insStatus:'대기', contacted:false, memo:files.length?'🤖 제미나이 자동요약 진행중':'', biz:'-', fund:'-', type:'개인', sharer:'', created:Date.now()});
  closeNew(); go('customer',id);
  // 브라우저에서 제미나이 멀티모달 직접 호출 → 재무요약(양식)+상호·대표·번호 자동입력, 그 다음 서류함 저장
  /* ★noSum:true — 이 경로는 위 autoSummarize가 이미 요약을 돌렸다.
     안 붙이면 저장 직후 docUploadCloud가 또 분석해 제미나이를 2번 태운다(중복 과금·덮어쓰기). */
  if(files.length){ autoSummarize(id, files, note).then(()=>docUpload(id, files, {silent:true, noSum:true})); }
  else { toast('고객 등록됨'); }
}
/* ===== 팀장(쉐어) 삭제 (2026-07-16 사장님 요청) =====
   삭제 = ①팀장 카드 ②공유 풀(shared/<sid>) ③로그인 권한(shareAccess) 제거.
   ★고객 기록은 절대 안 지운다 — 고객에 걸린 '이 팀장 연결'만 해제한다.
     (팀장을 지웠다고 고객DB가 날아가는 사고 방지. 지우는 건 사람이 아니라 연결.)
   사장님 전용 — 팀장 로그인 화면에는 이 버튼 자체가 안 나온다. */
function deleteSharer(sid, ev){
  try{ if(ev) ev.stopPropagation(); }catch(e){}
  if(typeof IS_SHARER!=='undefined' && IS_SHARER){ toast('팀장 삭제는 사장님만 가능합니다'); return; }
  const s=getSharer(sid); if(!s){ toast('이미 삭제된 팀장입니다'); return; }
  const all=custArr();
  const linked=all.filter(c=>custShareParty(c).includes(sid)||c.sharer===sid||
    ['insurance','consulting','tax'].some(k=>((((c.fees||{})[k])||{}).shr)===sid));
  let pool=[]; try{ pool=sharedArrOf(sid); }catch(e){}
  if(!confirm('팀장 「'+s.name+'」 을(를) 삭제할까요?\n\n'
    +'· 연결 고객 '+linked.length+'건 → 고객 기록은 그대로 남고, 이 팀장 연결만 해제\n'
    +'· 공유 중인 건 '+pool.length+'건 → 팀장 화면에서 사라짐\n'
    +'· 이 팀장 로그인 권한 회수\n\n※ 되돌릴 수 없습니다.')) return;

  /* ① 고객들에서 연결 해제 (고객 데이터 본체는 불변) */
  linked.forEach(function(c){
    const patch={};
    if(Array.isArray(c.sharers)&&c.sharers.indexOf(sid)>=0) patch.sharers=c.sharers.filter(x=>x!==sid);
    if(Array.isArray(c.referrers)&&c.referrers.indexOf(sid)>=0) patch.referrers=c.referrers.filter(x=>x!==sid);
    if(c.sharer===sid) patch.sharer='';
    const fees=Object.assign({},c.fees); let fch=false;
    ['insurance','consulting','tax'].forEach(function(k){
      if(fees[k]&&fees[k].shr===sid){ fees[k]=Object.assign({},fees[k],{shr:''}); fch=true; }
    });
    if(fch) patch.fees=fees;
    if(Object.keys(patch).length){
      DATA.customers[c.id]=Object.assign({},DATA.customers[c.id],patch);
      if(!offline) dref('customers/'+c.id).update(patch).catch(function(){});
    }
  });

  /* ② 팀장 레코드·공유풀·로그인 권한 제거 */
  delete (DATA.sharers||{})[sid];
  if(!offline){
    dref('sharers/'+sid).remove().catch(function(){});
    try{ RAWREF('shared/'+sid).remove(); }catch(e){}
    try{ RAWREF('shareAccess/'+sid).remove(); }catch(e){}
  }
  _lsave(); toast('팀장 「'+s.name+'」 삭제됨 · 고객 '+linked.length+'건 연결 해제');
  rerender();
}

   이유 — '공유'는 모든 팀장 공유건을 한 덩어리로 섞어 보여줘서 "누구와의 쉐어인지" 알 수 없었다.

   1차 수정 때 "팀장에겐 공유가 사장님과의 유일한 통로"라고 내가 임의로 예외를 뒀는데,

/* ===== 공통 헬퍼 (날짜·전역저장) ===== */
function daysSince(d){ if(!d) return 0; try{ return Math.floor((Date.now()-new Date(d).getTime())/86400000); }catch(e){ return 0; } }
function setNode(key,val){ DATA[key]=val; rerender(); _lsave(); if(!offline) dref(key).set(val).catch(()=>{ offline=true; _lsave(); }); }

/* ===== 액션카드 클릭 → 필터 리스트 ===== */
function renderFiltered(key,nav){
 buildNav(nav||'dash');
 const cs=custArr();
 const TITLE={'연락전':'📞 연락 전 고객 (신규 DB · 첫 통화 전)','부재중·재연락':'🔄 부재중·재연락 고객','심사중':'📥 심사중 고객','자금접수완료':'🏦 자금접수완료 고객','old7':'⏰ 접수 7일+ (심사중·서류접수 7일 경과·방치주의)','부결':'🚫 부결 고객'};
 // 수수료 필터: fee_done / fee_plan / fee_done_insurance / fee_plan_tax ...
 let feeStatus=null, feeType=null;
 if(key.indexOf('fee_')===0){ const p=key.split('_'); feeStatus=(p[1]==='done')?'완료':'예정'; feeType=p[2]||null; }
 const FTLB={insurance:'🛡️ 보험 계약',consulting:'🏦 컨설팅 수수료',tax:'🧾 세무 이관'};
 const rowAmtWon=c=> feeType ? (fee(c,feeType).status===feeStatus?feeWon(c,feeType):0) : custTotal(c,feeStatus);
 let list;
 if(key==='old7') list=cs.filter(c=>c.stage==='심사중'&&docState(c)==='접수완료'&&daysSince(c.docDate||c.received)>=7);
 else if(feeStatus){ const ks=feeType?[feeType]:['insurance','consulting','tax']; list=cs.filter(c=>ks.some(k=>fee(c,k).status===feeStatus)); }
 else list=cs.filter(c=>c.stage===key);
 const rows=list.map(c=>{
   const ago = c.received?` · 접수 ${daysSince(c.received)}일 전`:'';
   const amt = feeStatus ? `<div class="amt" style="color:${feeStatus==='완료'?'#10b981':'#d97706'};font-weight:800">${fmtMan(rowAmtWon(c))}원</div>` : `<div class="amt">${esc(c.fund||'')}</div>`;
   return `<div class="row click" onclick="go('customer','${c.id}')"><div class="av">${esc((c.nm||'·')[0])}</div>
     <div class="info"><b>${esc(c.nm)} <span>· ${esc(c.biz||'')}</span></b><div class="memo">${esc(c.memo||'')}${ago}</div></div>
     ${amt}${chip(c.stage)}</div>`;
 }).join('')||'<div class="row" style="color:#94a3b8">해당 고객 없음</div>';
 let title;
 if(feeStatus){ const st=feeStatus==='완료'?'✅ 완료(확정)':'⏳ 예정(예상)'; title = feeType?`${FTLB[feeType]} · ${st}`:`${st} 수익 고객`; }
 else title=TITLE[key]||key;
 const totLine = feeStatus ? ` · 합계 <b style="color:${feeStatus==='완료'?'#10b981':'#d97706'}">${fmtMan(list.reduce((a,c)=>a+rowAmtWon(c),0))}원</b>` : '';
 const tint = feeStatus==='완료'?'#ecfdf5':(feeStatus==='예정'?'#fffbeb':'');
 $('#main').innerHTML=`<span class="back" onclick="goBack()">← 뒤로</span>
   <div class="top" ${tint?`style="background:${tint};border-radius:14px;padding:12px 18px"`:''}><h1>${title} <span style="color:#94a3b8;font-size:15px;font-weight:600">${list.length}명${totLine}</span></h1></div>
   <div class="panel" ${tint?`style="background:${tint}"`:''}>${rows}</div>`;
}

let CALYM=null;
function _cm(){ try{ const d=new Date(); return {y:d.getFullYear(),m:d.getMonth(),d:d.getDate()}; }catch(e){ return {y:2026,m:5,d:30}; } }
function miniCal(meetings){
 if(!CALYM){ const c=_cm(); CALYM={y:c.y,m:c.m}; }
 const y=CALYM.y, m=CALYM.m;
 const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
 const cur=_cm(), isCur=cur.y===y&&cur.m===m;
 const md={}; (meetings||[]).forEach(mt=>{ if(mt.date){ const p=(''+mt.date).split('-'); if(+p[0]===y&&+p[1]===m+1) md[+p[2]]=1; } });
 const wd=['일','월','화','수','목','금','토']; let cells='';
 for(let i=0;i<first;i++) cells+='<div class="mc-d empty"></div>';
 for(let d=1;d<=days;d++){ const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
   cells+=`<div class="mc-d${md[d]?' has':''}${isCur&&d===cur.d?' today':''}" onclick="calDay('${ds}')">${d}${md[d]?'<span class="dot"></span>':''}</div>`; }
 return `<div class="minical"><div class="gcal-label"><span class="gcal-ic">31</span> Google Calendar</div>
   <div class="mc-head"><span onclick="calNav(-1)">‹</span><b>${y}.${m+1}</b><span onclick="calNav(1)">›</span></div>
   <div class="mc-grid">${wd.map((w,i)=>`<div class="mc-w" style="color:${i===0?'#ef4444':i===6?'#3b82f6':'#94a3b8'}">${w}</div>`).join('')}${cells}</div></div>`;
}

function custMatch(c,q){
  q=(''+(q||'')).trim().toLowerCase(); if(!q) return true;
  const qd=q.replace(/\D/g,'');
  const hay=[c.nm,custBizNames(c).join(' '),custTypes(c).join(' '),c.fund,c.memo,c.stage,(c.summary&&c.summary.note)||c.summaryNote,custSharerNames(c).join(' '),custReferrerNames(c).join(' ')].map(x=>(''+(x||'')).toLowerCase()).join(' ');
  const ph=(''+(c.phone||'')).replace(/\D/g,'');
  return hay.includes(q) || (qd.length>=2 && ph.includes(qd));
}
function searchResultsHtml(q){

/* ===== 🎯 오늘의 액션 큐 ===== */
const AQ_CLOSED=['승인완료','부결'];                       // 종결 단계 — 큐에서 제외
const AQ_STALE_STAGES=['통화완료','심사중','서류검토','본부장접수','자금접수완료'];
const AQ_STALE_DAYS=10;
function aqLastTouch(c){ return c.up || (c.created||0) || (c.received?new Date(c.received).getTime():0); }
function actionQueue(){
  const t=today(); const q=[];
  custArr().forEach(c=>{
    if(AQ_CLOSED.includes(c.stage)) return;
    if(c.fu && c.fu<=t){
      const d=daysSince(c.fu);
      q.push({c,pri:0,days:d,why:d>0?`재연락 D+${d} 지남`:'오늘 재연락',col:'#ec4899'});
    } else if(!c.fu && AQ_STALE_STAGES.includes(c.stage)){
      const lt=aqLastTouch(c); if(!lt) return;
      const d=Math.floor((Date.now()-lt)/86400000);
      if(d>=AQ_STALE_DAYS) q.push({c,pri:2,days:d,why:`${d}일째 변화 없음 (${c.stage})`,col:'#f59e0b'});
    }
  });
  return q.sort((a,b)=>(a.pri-b.pri)||(b.days-a.days));
}
function aqShift(id,days){ const d=new Date(); d.setDate(d.getDate()+days); setCust(id,{fu:d.toISOString().slice(0,10)}); toast('재연락 → '+(days===1?'내일':days+'일 뒤')); }
function aqDone(id){ setCust(id,{fu:''}); toast('재연락 처리 완료 ✓'); }
function aqAsk(id){
  const c=getCust(id)||{};
  const v=prompt('재연락 예정일 (YYYY-MM-DD, 비우면 해제):', c.fu||today());
  if(v===null) return;
  const s=v.trim();
  if(s==='') return setCust(id,{fu:''});
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s)){ alert('형식이 올바르지 않아요. 예: 2026-07-12'); return; }
  setCust(id,{fu:s});
}
function actionQueueHtml(){
  const q=actionQueue(); const MAX=8;
  const rows=q.slice(0,MAX).map(({c,why,col})=>`
   <div class="row click aqrow" onclick="go('customer','${c.id}')" style="align-items:center">
     <span style="width:9px;height:9px;border-radius:50%;background:${col};flex:none;margin-right:2px"></span>
     <div class="info"><b>${esc(c.nm)} <span>· ${esc(c.bizName||c.biz||'')}</span></b><div class="memo" style="color:${col};font-weight:700">${esc(why)}</div></div>
     ${c.phone?`<a href="tel:${esc(c.phone)}" onclick="event.stopPropagation()" style="font-size:12px;font-weight:700;color:#3b82f6;text-decoration:none;padding:5px 8px;background:#eff6ff;border-radius:8px;white-space:nowrap">📞 ${esc(c.phone)}</a>`:''}
     ${chip(c.stage)}
     <span title="재연락 완료 처리" onclick="event.stopPropagation();aqDone('${c.id}')" style="cursor:pointer;font-size:12px;font-weight:800;color:#10b981;padding:5px 8px;background:#ecfdf5;border-radius:8px;white-space:nowrap">✓ 완료</span>
     <span title="3일 뒤로 미루기" onclick="event.stopPropagation();aqShift('${c.id}',3)" style="cursor:pointer;font-size:12px;font-weight:700;color:#64748b;padding:5px 8px;background:#f1f5f9;border-radius:8px;white-space:nowrap">+3일</span>
   </div>`).join('');
  const more = q.length>MAX ? `<div style="font-size:12px;color:#94a3b8;padding:8px 4px">외 ${q.length-MAX}건 더 — 재연락일이 도래하면 순서대로 올라옵니다</div>` : '';
  const body = q.length ? rows+more : `<div style="font-size:13px;color:#94a3b8;padding:14px 6px">오늘 처리할 항목이 없습니다 🎉 &nbsp;<span style="font-size:12px">고객 카드 ⋮ 메뉴나 상세 화면에서 재연락일을 지정하면 여기 자동으로 올라와요.</span></div>`;
  return `<div class="sechead">🎯 오늘의 액션 큐 ${q.length?`<span style="color:#ec4899">${q.length}건</span>`:''}</div>
  <div class="panel" style="padding:8px 14px;margin-bottom:16px">${body}</div>`;
}

/* ★2026-07-15 [쉐어]→팀장카드 화면의 핵심 패널 — "나와 이 팀장이 실제로 공유 중인 건"

   내 고객DB를 필터링한 것일 뿐이라 팀장은 못 본다 — 그래서 이 패널이 따로 필요하다. */
function sharedPanelOf(sid,s){

    return '<div class="panel" style="margin-bottom:18px;border:1.5px solid #fde68a;background:#fffbeb">'

  }
  var rows=arr.length?arr.map(sharedRowHtml).join('')
    :'<div class="ins" style="color:#94a3b8;display:block">아직 공유된 건이 없습니다. 아래 “함께 진행 중인 고객”에서 고객을 열어 <b>🤝 쉐어</b>를 켜면 여기와 '+nm+' 화면에 동시에 나타납니다.</div>';
  return '<div class="panel" style="margin-bottom:18px;border:1.5px solid #c7d2fe">'
    +'<div class="ph"><b>🤝 '+nm+'과(와) 공유 중인 건 ('+arr.length+')</b>'
    +'<span class="sub">양쪽에서 실시간으로 보고 같이 수정 · '+esc(em)+'</span></div>'
    +rows+'</div>';
}
