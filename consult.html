<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a36">
<title>컨설팅 CRM</title>
<link rel="manifest" href="cassets/manifest.json">
<link rel="icon" type="image/png" href="cassets/icon192.png">
<link rel="apple-touch-icon" href="cassets/icon180.png">
<link rel="apple-touch-icon" sizes="167x167" href="cassets/icon167.png">
<link rel="apple-touch-icon" sizes="152x152" href="cassets/icon152.png">
<link rel="apple-touch-icon" sizes="120x120" href="cassets/icon120.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="컨설팅 CRM">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--sub:#64748b;--line:#eef1f6;--brand:#3b82f6;--dark:#101a36}
body{background:var(--bg);color:var(--ink);min-height:100vh}
.app{display:flex;min-height:100vh}
.side{width:228px;background:var(--dark);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:20}
.brand{padding:22px 22px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand .logo{width:38px;height:38px;background:linear-gradient(135deg,#63b3ed,#7c5cff);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.brand b{color:#fff;font-size:16px;display:block}.brand span{color:#6b7aa3;font-size:11px}
.nav{padding-top:12px;flex:1;overflow:auto}
.nav a{display:block;padding:12px 22px;color:#8a98bd;font-size:14px;font-weight:600;border-left:3px solid transparent;cursor:pointer;text-decoration:none}
.nav a.on{background:rgba(99,179,237,.15);border-left-color:#63b3ed;color:#dbeafe}
.me{padding:16px 22px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.me .av{width:34px;height:34px;border-radius:50%;background:#2a3a63;color:#cdd9f5;display:flex;align-items:center;justify-content:center;font-weight:700}
.me b{color:#dbeafe;font-size:13px;display:block}.me span{color:#6b7aa3;font-size:11px}
.main{margin-left:228px;flex:1;padding:26px 32px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.top h1{font-size:23px;font-weight:800}.top .date{font-size:13px;color:var(--sub);margin-top:3px}
.tbtns{display:flex;gap:10px;align-items:center}
.btn{padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;border:none}
.btn.g{background:#fff;border:1px solid #e2e8f0;color:#475569}
.btn.b{background:var(--brand);color:#fff}
.back{color:#3b82f6;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:14px;display:inline-block}
.sechead{font-size:13px;font-weight:800;color:#475569;margin:0 0 10px}
.rev{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.rev .c{flex:1;min-width:230px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.rev .c .h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rev .c .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px}
.rev .c .lb{font-size:14px;color:var(--sub);font-weight:700}
.rev .c .v{font-size:29px;font-weight:800}.rev .c .v small{font-size:15px;color:#94a3b8;font-weight:800}
.rev .c .s{font-size:12.5px;font-weight:700;margin-top:4px}
.midrow{display:flex;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.tax{flex:1.3;min-width:300px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.tax .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.tax .h b{font-size:15px;font-weight:800}.tax .h .sum{font-size:13px;color:#8b5cf6;font-weight:800}
.tax .grid{display:flex;gap:14px}
.tax .box{flex:1;border-radius:13px;padding:16px}
.tax .box .t{font-size:12.5px;color:var(--sub)}
.tax .box .n{font-size:26px;font-weight:800;margin:4px 0}.tax .box .n small{font-size:14px;color:var(--sub);font-weight:800}
.tax .box .m{font-size:12px;font-weight:700}
.acts{flex:1.7;min-width:300px;display:flex;gap:14px}
.act{flex:1;border-radius:16px;padding:18px;color:#fff;cursor:pointer}
.act .ic{font-size:22px}.act .n{font-size:32px;font-weight:800;margin:6px 0 0}.act .l{font-size:13px;opacity:.92;font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.panel .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.panel .ph b{font-size:15px;font-weight:800}.panel .ph .more{color:var(--brand);font-size:13px;font-weight:700;cursor:pointer}
.panel .ph .sub{font-size:12px;color:#94a3b8;font-weight:500;margin-left:6px}
.row{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid #f1f5f9;gap:12px}
.row:last-child{border-bottom:none}
.row.click{cursor:pointer;border-radius:10px;padding:12px 8px;margin:0 -8px}
.row.click:hover{background:#f8fafc}
.row .av{width:34px;height:34px;border-radius:10px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-weight:700;color:#475569;flex-shrink:0}
.row .info{flex:1;min-width:0}
.row .info b{font-weight:700;font-size:14px}.row .info b span{color:#cbd5e1;font-weight:400}
.row .info .memo{font-size:12px;color:#94a3b8}
.row .amt{font-size:13px;font-weight:700;white-space:nowrap}
.chip{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.row .call{background:var(--brand);color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
.shx{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.shc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;border-top:3px solid var(--brand);cursor:pointer;transition:.15s}
.shc:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.07)}
.shc .hh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.shc .hh .av{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.shc .hh b{font-size:15px}.shc .hh span{font-size:12px;color:var(--sub)}
.shc .stat{display:flex;gap:16px}
.shc .stat div b{font-size:20px;font-weight:800;display:block}.shc .stat div span{font-size:11.5px;color:var(--sub)}
/* 팀장 상세 */
.tlhead{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 26px;margin-bottom:18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.tlhead .av{width:60px;height:60px;border-radius:16px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.tlhead .nm{font-size:22px;font-weight:800}.tlhead .og{color:var(--sub);font-size:14px;margin-top:2px}
.tlhead .sum{display:flex;gap:24px;text-align:center;margin-left:auto}
.tlhead .sum div b{font-size:24px;font-weight:800;display:block}.tlhead .sum div span{font-size:12px;color:#94a3b8}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.ins{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #f1f5f9;gap:10px}
.ins:last-child{border-bottom:none}
.ins .nm{font-weight:700;font-size:14px}.ins .fd{color:#94a3b8;font-size:12.5px;margin-left:4px}
.ins .val{font-weight:800;font-size:14px;cursor:pointer;border-bottom:1px dashed #cbd5e1}
.st{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;border:none;white-space:nowrap}
.st.대기{background:#fef3c7;color:#d97706}.st.완료{background:#dcfce7;color:#16a34a}.st.취소{background:#fee2e2;color:#dc2626}
.fld{margin-bottom:14px}.fld label{font-size:12px;color:#94a3b8;font-weight:700;display:block;margin-bottom:5px}
.fld .ev{font-size:15px;font-weight:600;cursor:pointer;padding:9px 12px;background:#f8fafc;border:1px solid #eef1f6;border-radius:10px}
.fld .ev:hover,.val:hover{outline:1.5px dashed #c7d2fe}
.iedit{width:100%;font-size:15px;font-weight:600;padding:8px 11px;border:1.6px solid var(--brand);border-radius:10px;outline:none;font-family:inherit;background:#fff;color:var(--ink)}
.ins .iedit,.val .iedit{width:130px;font-size:13px;padding:5px 8px}
select.iedit{cursor:pointer}
.sharebar{background:linear-gradient(135deg,#101a36,#1e293b);color:#fff;padding:16px 22px;border-radius:16px;margin-bottom:18px;display:flex;align-items:center;gap:14px}
.sharebar .badge{background:rgba(255,255,255,.14);padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700}
.hide{display:none!important}
.menubtn{display:none}
@media(max-width:860px){
 .side{transform:translateX(-100%);transition:.25s}.side.open{transform:translateX(0)}
 .main{margin-left:0;padding:18px 14px}.menubtn{display:flex}
 .acts{flex-wrap:wrap}.act{min-width:46%}.rev .c{min-width:46%}.top h1{font-size:20px}
 .tlhead .sum{margin-left:0;width:100%;justify-content:space-around}
}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15}
.scrim.open{display:block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:700;z-index:99;opacity:0;transition:.2s}
.toast.on{opacity:1}
/* 서류함(폴더) */
.docbox{background:linear-gradient(180deg,#fffdf3,#fff);border:1px solid #f0e6c8;border-radius:14px;padding:14px 16px;margin-bottom:16px;position:relative}
.docbox::before{content:'';position:absolute;top:-8px;left:18px;width:52px;height:10px;background:#f6cf5b;border-radius:6px 6px 0 0}
.docbox .dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.docbox .dh b{font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px}
.docbox .add{background:#fff4cc;color:#a16207;border:1px solid #f0e0a0;padding:5px 11px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.docitem{display:flex;align-items:center;gap:9px;padding:8px 10px;background:#fff;border:1px solid #f1ecd9;border-radius:9px;margin-bottom:6px}
.docitem .nm{flex:1;font-size:13px;font-weight:600;cursor:pointer;min-width:0}
.docitem .x{color:#c9bda0;cursor:pointer;font-size:13px;font-weight:700}
.docitem .dl{color:#3b82f6;cursor:pointer;font-weight:700;font-size:14px}
.docempty{font-size:12.5px;color:#b9a96b;padding:6px 2px;line-height:1.5}
.docbox .dropzone{margin:8px 0 4px;padding:16px 12px}
/* 컨설팅 메모 */
.iarea{width:100%;min-height:180px;font-size:14px;line-height:1.65;padding:12px;border:1.6px solid var(--brand);border-radius:12px;outline:none;font-family:inherit;resize:vertical;background:#fff}
.notebox{min-height:180px;font-size:14px;line-height:1.65;color:#334155;white-space:pre-wrap;cursor:text;padding:8px 4px;border-radius:10px}
.notebox:hover{background:#f8fafc}.notebox.empty{color:#94a3b8}
/* 재무 요약 */
.fsum .bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:8px 4px 0;border-bottom:1px solid #eef1f6;margin-bottom:6px}
.fsum .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.fsum .bar .bb{width:100%;border-radius:7px 7px 0 0;display:flex;align-items:flex-start;justify-content:center;color:#fff;font-size:11.5px;font-weight:800;padding-top:5px;min-height:20px}
.fsum .bar .yl{font-size:11px;color:#94a3b8;margin-top:5px;font-weight:600}
.fsum .scards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.fsum .sc{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fsum .sc .t{font-size:12px;color:var(--sub)}.fsum .sc .n{font-size:20px;font-weight:800;margin-top:3px}
.fsum .warn{background:#fef2f2;color:#b91c1c;border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:700;margin-bottom:14px}
.fsum .ltot{font-size:13px;font-weight:800;color:#334155;margin:4px 0 8px}
.fsum .loan{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:8px}
.fsum .loan .lr{display:flex;justify-content:space-between;font-weight:800;font-size:13.5px}
.fsum .loan .ld{font-size:12px;color:var(--sub);margin:3px 0 5px}
.fsum .loan .lt{display:inline-block;background:#eff6ff;color:#3b82f6;font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px}
.fsum .credit{background:#ecfdf5;color:#15803d;border-radius:10px;padding:11px 13px;font-size:13px;font-weight:800;text-align:center;margin-top:10px}
.fsum .empty{text-align:center;color:#94a3b8;padding:24px 8px;font-size:13px;line-height:1.7}
.spin{width:30px;height:30px;border:3px solid #e2e8f0;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.jsonarea{width:100%;min-height:230px;font-family:ui-monospace,Consolas,monospace;font-size:12px;padding:12px;border:1.6px solid var(--brand);border-radius:12px;outline:none;background:#0f172a;color:#cbd5e1;resize:vertical}
/* 모달 */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}
.modal .mc{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:470px;max-height:90vh;overflow:auto}
.modal h3{font-size:18px;font-weight:800;margin-bottom:4px}.modal .msub{font-size:12.5px;color:#94a3b8;margin-bottom:16px}
.modal .opt{display:flex;gap:12px;margin-bottom:14px}
.modal .ob{flex:1;border:1.5px solid #e2e8f0;border-radius:13px;padding:16px;text-align:center;cursor:pointer;font-weight:700;font-size:13px}
.modal .ob.on{border-color:var(--brand);background:#eff6ff}.modal .ob .bi{font-size:24px;display:block;margin-bottom:6px}
.modal label{font-size:12px;color:#64748b;font-weight:700;display:block;margin:10px 0 4px}
.modal input,.modal select,.modal textarea{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;font-family:inherit;outline:none}
.modal textarea{min-height:80px;resize:vertical;line-height:1.6}
.modal .mrow{display:flex;gap:10px}.modal .mrow>div{flex:1}
.modal .mact{display:flex;gap:10px;margin-top:18px}.modal .mact .btn{flex:1;text-align:center}
.guidebox{background:#f8fafc;border:1px solid #eef1f6;border-radius:12px;padding:14px;font-size:13px;line-height:1.7;color:#475569}.guidebox b{color:#1e293b}
.notebox.sm{min-height:96px;background:#f8fafc;border:1px solid #eef1f6;padding:10px 12px}
.dropzone{border:2px dashed #cbd5e1;border-radius:12px;padding:22px 14px;text-align:center;color:#94a3b8;font-size:13px;font-weight:600;background:#f8fafc;transition:.15s;line-height:1.7}
.dropzone.drag{border-color:var(--brand);background:#eff6ff;color:#3b82f6}
.filelabel{color:#3b82f6;cursor:pointer;text-decoration:underline}
.reqfile{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:7px 11px;background:#fff;border:1px solid #eef1f6;border-radius:8px;margin-top:6px;font-weight:600}
.reqfile .x{cursor:pointer;color:#cbb}
.feerow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f1f5f9}
.feerow:last-of-type{border-bottom:none}
.feerow .fl{flex:1;font-size:13.5px;font-weight:700}
.feerow .fa{min-width:92px;text-align:right;font-size:13px;cursor:pointer}
.st.예정{background:#fef3c7;color:#d97706}.st.없음{background:#f1f5f9;color:#94a3b8}
.feetot{margin-top:12px;padding-top:11px;border-top:1px dashed #e2e8f0;font-size:12.5px;color:#64748b}.feetot b{color:#0f172a}
/* 고객 DB 월별 탭 */
.monthbar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.monthbar .myear{font-weight:800;color:#0f172a;font-size:13px;padding:6px 8px 6px 2px}
.mtab{padding:7px 13px;border-radius:9px;font-size:13px;font-weight:700;color:#64748b;cursor:pointer;white-space:nowrap}
.mtab:hover{background:#f1f5f9}
.mtab.on{background:var(--brand);color:#fff}
/* 고객 DB 카드 그리드 */
.cdbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.cdbcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:.15s;position:relative}
.cmenu{position:absolute;top:8px;right:10px;font-size:20px;line-height:1;color:#cbd5e1;cursor:pointer;padding:2px 8px;border-radius:6px;font-weight:700;z-index:2}
.cmenu:hover{background:#f1f5f9;color:#475569}
.cardmenu-pop{position:fixed;z-index:80;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 10px 28px rgba(0,0,0,.16);overflow:hidden;min-width:130px}
.cardmenu-pop div{padding:11px 16px;font-size:13.5px;font-weight:700;cursor:pointer;color:#334155}
.cardmenu-pop div:hover{background:#f1f5f9}.cardmenu-pop div.del{color:#dc2626}.cardmenu-pop div.del:hover{background:#fef2f2}
.cdbcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08);border-color:#dbe3ef}
.cdbcard .ch{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.cdbcard .cav{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;flex-shrink:0}
.cdbcard .cnm{font-size:15.5px;font-weight:800;line-height:1.25}
.cdbcard .cnm .ty{font-size:11px;color:#94a3b8;font-weight:700;margin-left:4px}
.cdbcard .cbiz{font-size:12.5px;color:#94a3b8;margin-top:2px}
.cdbcard .cbadges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.docbadge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:8px;background:#f1f5f9;color:#94a3b8;cursor:pointer}
.docbadge.on{background:#dcfce7;color:#16a34a}
.cdbcard .cmeta{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}
.cdbcard .cmeta .lbl{font-size:11px;color:#94a3b8;display:block;margin-bottom:2px}
.cdbcard .cmeta b{font-size:13px;font-weight:700;color:#334155}
/* 4분할 */
.quadgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
@media(max-width:820px){.quadgrid{grid-template-columns:1fr}}
.quad{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;min-height:300px;display:flex;flex-direction:column}
.quad .qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.quad .qh b{font-size:14.5px;font-weight:800}
.qlist{flex:1;overflow:auto}
.qrow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #f4f6fb;cursor:pointer}
.qrow:last-child{border-bottom:none}.qrow:hover{background:#f8fafc;border-radius:8px}
.qrow .qav{width:30px;height:30px;border-radius:8px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#475569;flex-shrink:0}

 revenue:{consulting:{v:'—',s:'진행 20건 · 수치 입력 예정'},insurance:{v:'—',s:'보험 정보 입력 시 집계'},tax:{personal:0,corp:1,perFee:60,corpFee:90}}

let DATA={sharers:{},customers:{},revenue:{}};
let ready=false, offline=false;
const params=new URLSearchParams(location.search);
const shareId=params.get('share');
/* 데모/테스트 분리: ?ns=demo 면 모든 데이터가 /demo 아래로 (실제 고객과 격리) */
const NS=(params.get('ns')||'').replace(/[^a-z0-9_]/gi,'');
const RAWREF=db.ref.bind(db);
function dref(p){ if(NS) return RAWREF(p?NS+'/'+p:NS); return p?RAWREF(p):RAWREF(); }
const LSKEY=NS?'consultDATA_'+NS:'consultDATA';
let VIEW = shareId ? {t:'ext'} : {t:'dash'};

/* 연결 실패/잠김이어도 절대 멈추지 않게: 로컬 시드로 부팅 */
function _lsave(){ try{ if(offline) localStorage.setItem(LSKEY, JSON.stringify(DATA)); }catch(e){} }
function bootLocal(reason){
  if(ready && !offline) return;          // 이미 실시간으로 떠 있으면 무시
  let base=null; try{ const ls=localStorage.getItem(LSKEY); if(ls) base=JSON.parse(ls); }catch(e){}
  DATA=(base&&base.customers)?base:JSON.parse(JSON.stringify(SEED));
  ready=true; offline=true; rerender();
  console.warn('오프라인 모드(이 PC 저장본 사용):', reason);
}
const bootTimer=setTimeout(()=>bootLocal('연결 시간초과(2.5s)'), 2500);

/* 시드 → 실시간 구독 (실패 시 로컬 폴백) */
try{
  dref().once('value').then(s=>{ if(!s.exists()||!s.child('sharers').exists()){
    let seed=SEED; try{ const ls=localStorage.getItem(LSKEY); if(ls){ const p=JSON.parse(ls); if(p&&p.customers&&Object.keys(p.customers).length) seed=p; } }catch(e){}
    dref().update(seed).catch(()=>{}); } }).catch(e=>bootLocal(e&&e.message));
  dref().on('value', s=>{
    clearTimeout(bootTimer);
    DATA=s.val()||JSON.parse(JSON.stringify(SEED));
    ready=true; offline=false; rerender();
  }, e=>{ bootLocal(e&&e.message); });
}catch(e){ bootLocal(e&&e.message); }

/* ===== 헬퍼 ===== */
const $=s=>document.querySelector(s);
const esc=s=>(''+ (s??'')).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const chip=s=>`<span class="chip" style="background:${(STAGE[s]||'#94a3b8')}1a;color:${STAGE[s]||'#94a3b8'}">${esc(s)}</span>`;
function _csk(c){ if(c.created) return c.created; const m=(''+c.id).match(/c(\d+)/); return m?parseInt(m[1],10):0; }
function custArr(){ return Object.entries(DATA.customers||{}).map(([id,c])=>({id,...c})).sort((a,b)=>_csk(b)-_csk(a)); }
function sharerArr(){ return Object.entries(DATA.sharers||{}).map(([id,s])=>({id,...s})); }
function getCust(id){ const c=(DATA.customers||{})[id]; return c?{id,...c}:null; }
function getSharer(id){ const s=(DATA.sharers||{})[id]; return s?{id,...s}:null; }
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1400);}

/* ===== 수수료·계약 모델 (보험/컨설팅/세무 각 예정·완료 + 금액 → 자동 합산) ===== */
const FEE_KEYS=[['insurance','🛡️','보험 계약'],['consulting','🏦','컨설팅 수수료'],['tax','🧾','세무 이관']];
function won(s){ if(typeof s==='number')return s; s=(''+(s||'')).replace(/[,\s원]/g,''); if(!s)return 0;
  let v=0,m; m=s.match(/([\d.]+)억/); if(m)v+=parseFloat(m[1])*10000;
  m=s.match(/([\d.]+)천/); if(m)v+=parseFloat(m[1])*1000;
  m=s.match(/([\d.]+)만/); if(m)v+=parseFloat(m[1]);
  if(!/[억천만]/.test(s)){ const n=parseFloat(s); if(!isNaN(n))v+=n; }
  return Math.round(v); }                                  // 단위: 만원
function fmtMan(v){ v=Math.round(v||0); if(!v)return '0'; if(v>=10000){ return (Math.round(v/100)/100).toLocaleString()+'억'; } return v.toLocaleString()+'만'; }
function fee(c,k){ const f=((c&&c.fees)||{})[k];
  if(f) return {status:f.status||'없음', amt:f.amt||''};
  if(k==='insurance'&&c){ const st=c.insStatus==='완료'?'완료':(c.ins?'예정':'없음'); return {status:st, amt:c.ins||''}; }
  return {status:'없음', amt:''}; }
function setFee(id,k,patch){ const c=getCust(id)||{}; const fees=Object.assign({},c.fees);
  const cur=Object.assign({status:'없음',amt:''}, fees[k]||{}); fees[k]=Object.assign(cur,patch); setCust(id,{fees}); }
const PRODUCT_TYPES=['미지정','관리계약(벤처·특허·연구소)','재무 관리','정책자금-시설자금','정책자금-운영자금'];
const PT_CUSTOM='✍️ 직접 입력…';
function iProductType(box,id){
  if(box.querySelector('select,input'))return;
  const cur=(((getCust(id)||{}).fees||{}).product||{}).type||'';
  let opts=PRODUCT_TYPES.map(o=>`<option ${o===(cur||'미지정')?'selected':''}>${esc(o)}</option>`);
  if(cur && !PRODUCT_TYPES.includes(cur)) opts.unshift(`<option selected>${esc(cur)}</option>`);  // 직접 입력값 표시
  opts.push(`<option>${PT_CUSTOM}</option>`);
  box.innerHTML=`<select class="iedit">${opts.join('')}</select>`;
  const sel=box.querySelector('select'); sel.focus();
  let handled=false;
  const done=()=>{ if(handled)return; handled=true;
    if(sel.value===PT_CUSTOM) return promptCustomType(box,id);
    setFee(id,'product',{type:sel.value==='미지정'?'':sel.value}); };
  sel.onchange=done; sel.onblur=done;
}
function promptCustomType(box,id){
  const cur=(((getCust(id)||{}).fees||{}).product||{}).type||'';
  box.innerHTML=`<input class="iedit" value="${esc(PRODUCT_TYPES.includes(cur)?'':cur)}" placeholder="예: 시설자금+운영자금 / 기업 인증">`;
  const inp=box.querySelector('input'); inp.focus(); inp.select();
  let h=false; const ok=()=>{ if(h)return; h=true; setFee(id,'product',{type:inp.value.trim()}); };
  inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();inp.blur();} else if(e.key==='Escape'){h=true;rerender();} };
  inp.onblur=ok;
}
function custTotal(c,status){ return ['insurance','consulting','tax'].reduce((a,k)=>{const f=fee(c,k);return f.status===status?a+won(f.amt):a;},0); }
function aggFees(){ const cs=custArr(); const out={};
  ['insurance','consulting','tax'].forEach(k=>{ let dA=0,dN=0,pA=0,pN=0;
    cs.forEach(c=>{ const f=fee(c,k); const a=won(f.amt);
      if(f.status==='완료'){dA+=a;dN++;} else if(f.status==='예정'){pA+=a;pN++;} });
    out[k]={dA,dN,pA,pN}; });
  return out; }
function docState(c){ return c.docStatus || ((c&&c.docs&&c.docs.length)?'접수완료':'접수전'); }
function toggleDocStatus(id){ const c=getCust(id)||{}; const next=docState(c)==='접수완료'?'접수전':'접수완료'; const patch={docStatus:next}; if(next==='접수완료'&&!c.docDate) patch.docDate=today(); setCust(id,patch); }
function today(){ try{ return new Date().toISOString().slice(0,10); }catch(e){ return ''; } }
function iFeeStatus(box,id,k){ if(box.querySelector('select'))return;
  const cur=fee(getCust(id),k).status; const opts=['예정','완료','없음'];
  box.innerHTML=`<select class="iedit">${opts.map(o=>`<option ${o===cur?'selected':''}>${o}</option>`).join('')}</select>`;
  const sel=box.querySelector('select'); sel.focus();
  const done=()=>{ if(box.dataset.done)return; box.dataset.done='1'; setFee(id,k,{status:sel.value}); };
  sel.onchange=done; sel.onblur=done; }
function iFeeAmt(box,id,k){ if(box.querySelector('input'))return;
  const cur=fee(getCust(id),k).amt;
  box.innerHTML=`<input class="iedit" value="${esc(cur)}" placeholder="예: 500만 / 1.1억">`;
  const inp=box.querySelector('input'); inp.focus(); inp.select();
  const done=()=>{ if(box.dataset.done)return; box.dataset.done='1'; setFee(id,k,{amt:inp.value.trim()}); };
  inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();inp.blur();} else if(e.key==='Escape'){box.dataset.done='1';rerender();} };

function _commit(box,id,key,val,save){

/* ===== 서류함 (D:\컨설팅_서류 로컬 파일서버 연동) ===== */
const FILESRV='http://127.0.0.1:8799';
function _b64(f){ return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);}); }
async function docUpload(id,fileList){
  const c=getCust(id)||{}; const nm=c.nm||id; const files=[...fileList]; if(!files.length)return;
  toast('업로드 중… '+files.length+'개'); let last=null;
  for(const f of files){
    if(f.size>40*1024*1024){ toast(f.name+' 40MB 초과 — 제외'); continue; }
    try{ const data=await _b64(f);
      const r=await fetch(FILESRV+'/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer:nm,name:f.name,data})});
      last=await r.json();
    }catch(e){ toast('⚠ 데탑 파일서버 꺼짐 — 데탑에서 대시보드 열어야 업로드돼요'); return; }
  }
  if(last&&last.files){ const cc=getCust(id)||{}; setCust(id,{docs:last.files.map(x=>({name:x.name})),docStatus:'접수완료',...(cc.docDate?{}:{docDate:today()})}); toast('저장 완료 ✓ (D드라이브)'); }
}
function docDrop(e,id){ e.preventDefault(); e.currentTarget.classList.remove('drag'); if(e.dataTransfer&&e.dataTransfer.files) docUpload(id,e.dataTransfer.files); }

function dlFile(nm,name){ window.open(FILESRV+'/file?customer='+encodeURIComponent(nm)+'&name='+encodeURIComponent(name),'_blank'); }
function viewFile(nm,name){ window.open(FILESRV+'/file?customer='+encodeURIComponent(nm)+'&name='+encodeURIComponent(name)+'&inline=1','_blank'); }
function openFolder(nm){ fetch(FILESRV+'/open?customer='+encodeURIComponent(nm)).then(()=>toast('폴더 열림')).catch(()=>toast('데탑 파일서버 꺼짐')); }

let REQFILES=[];
function reqAddFiles(fl){ for(const f of fl){ REQFILES.push(f); } reqRenderList(); }   // 실제 File 객체 보관(업로드용)
function reqDrop(e){ e.preventDefault(); e.currentTarget.classList.remove('drag'); if(e.dataTransfer&&e.dataTransfer.files) reqAddFiles(e.dataTransfer.files); }
function reqRenderList(){ const el=document.getElementById('reqList'); if(!el)return;
  el.innerHTML=REQFILES.map((f,i)=>`<div class="reqfile">📄 ${esc(f.name)}<span class="x" onclick="REQFILES.splice(${i},1);reqRenderList()">✕</span></div>`).join(''); }
function fileToDataURL(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); }); }
async function craftRequest(){
  const nm=document.getElementById('reqNm').value.trim();
  const note=document.getElementById('reqNote').value.trim();
  const files=REQFILES.slice();
  if(!nm && !files.length){ toast('고객명 또는 서류를 추가하세요'); return; }
  const id='c'+Date.now();
  setCust(id,{nm:nm||'(이름 미정)', docs:files.map(f=>({name:f.name})), cnote:note?('[요약 요청] '+note):'',
    received:today(), docStatus:files.length?'접수완료':'접수전', docDate:files.length?today():'',
    stage:'연락전', insStatus:'대기', contacted:false, memo:'📥 직원2 재무요약 요청', biz:'-', fund:'-', type:'개인', sharer:'', created:Date.now()});
  closeNew(); go('customer',id);
  // 완전자동(무료): 온라인이면 파일을 base64로 RTDB 요청큐에 기록 → 워치독이 직원2 호출
  if(!offline && files.length){
    toast('서류 전송 중…');
    try{
      const enc=[];
      for(const f of files){
        if(f.size>8*1024*1024){ toast(f.name+' 8MB 초과 — 제외'); continue; }
        enc.push({name:f.name, data:await fileToDataURL(f)});
      }
      const reqId='req'+Date.now();
      await dref('requests/'+reqId).set({customerId:id, customerName:nm||'(이름 미정)', note, files:enc, status:'pending', ts:Date.now()});
      setCust(id,{memo:'📥 직원2 자동분석 대기중'});
      toast('요청 전송 완료 ✓ — 직원2 자동 처리 대기');
    }catch(e){ toast('전송 실패: '+(e&&e.message||'')); }
  } else if(files.length){
    toast('요청 등록(로컬) — 실시간 켜면 자동 전송됩니다');
  } else { toast('고객 등록됨'); }
}

let CALYM=null;
function _cm(){ try{ const d=new Date(); return {y:d.getFullYear(),m:d.getMonth(),d:d.getDate()}; }catch(e){ return {y:2026,m:5,d:30}; } }
function miniCal(meetings){
 if(!CALYM){ const c=_cm(); CALYM={y:c.y,m:c.m}; }
 const y=CALYM.y, m=CALYM.m;
 const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
 const cur=_cm(), isCur=cur.y===y&&cur.m===m;
 const md={}; (meetings||[]).forEach(mt=>{ if(mt.date){ const p=(''+mt.date).split('-'); if(+p[0]===y&&+p[1]===m+1) md[+p[2]]=1; } });
 const wd=['일','월','화','수','목','금','토']; let cells='';
 for(let i=0;i<first;i++) cells+='<div class="mc-d empty"></div>';
 for(let d=1;d<=days;d++){ const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
   cells+=`<div class="mc-d${md[d]?' has':''}${isCur&&d===cur.d?' today':''}" onclick="calDay('${ds}')">${d}${md[d]?'<span class="dot"></span>':''}</div>`; }
 return `<div class="minical"><div class="mc-head"><span onclick="calNav(-1)">‹</span><b>${y}.${m+1}</b><span onclick="calNav(1)">›</span></div>
   <div class="mc-grid">${wd.map((w,i)=>`<div class="mc-w" style="color:${i===0?'#ef4444':i===6?'#3b82f6':'#94a3b8'}">${w}</div>`).join('')}${cells}</div></div>`;
}
function calNav(d){ if(!CALYM){const c=_cm();CALYM={y:c.y,m:c.m};} let m=CALYM.m+d,y=CALYM.y; if(m<0){m=11;y--;} if(m>11){m=0;y++;} CALYM={y,m}; rerender(); }
function calDay(ds){ const M=DATA.meetings||{}; const on=Object.values(M).filter(mt=>mt.date===ds);
 if(on.length) toast(ds+' 미팅: '+on.map(mt=>mt.title).join(', ')); else addMeeting(ds); }
function gcal(title,date,time,memo){
 const d=(date||'').replace(/-/g,''); if(!d){ toast('날짜 없음'); return; }
 const hh=(time||'09:00').slice(0,2), mm=(time||'09:00').slice(3,5);
 const start=d+'T'+hh+mm+'00';
 const eh=String((parseInt(hh)+1)%24).padStart(2,'0'); const end=d+'T'+eh+mm+'00';
 window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+start+'/'+end+'&details='+encodeURIComponent(memo||''),'_blank');
}

function searchResultsHtml(q){
  q=(''+(q||'')).trim().toLowerCase();
  if(!q) return '<div class="row" style="color:#94a3b8;padding:14px 4px">이름·상호·전화번호 일부·업종을 입력하세요</div>';
  const qd=q.replace(/\D/g,'');
  const res=custArr().filter(c=>{
    const hay=[c.nm,c.bizName,c.biz,c.fund,c.memo,c.stage,c.summaryNote].map(x=>(''+(x||'')).toLowerCase()).join(' ');
    const ph=(''+(c.phone||'')).replace(/\D/g,'');
    return hay.includes(q) || (qd.length>=2 && ph.includes(qd));
  });
  if(!res.length) return '<div class="row" style="color:#94a3b8;padding:14px 4px">검색 결과 없음</div>';

}

     <div class="ch"><div class="cav" style="background:${avc[i%avc.length]}">${esc((c.nm||'·')[0])}</div>
       <div><div class="cnm">${esc(c.nm)}${c.type?`<span class="ty">${esc(c.type)}</span>`:''}</div><div class="cbiz">${bizline}</div></div></div>
     <div class="cbadges"><span class="docbadge ${dd?'on':''}" style="cursor:default">${dd?'✅ 서류 접수 완료':'⏳ 서류 접수 전'}</span>${chip(c.stage)}</div>
     <div class="cmeta"><div><span class="lbl">📅 최초 접수</span><b>${esc(c.received||'-')}</b></div>
       <div style="text-align:right"><span class="lbl">📞 연락처</span><b>${esc(c.phone||'-')}</b></div></div>
   </div>`;
 }).join('');
 const pager= pages>1 ? '<div class="pager" style="margin-top:18px">'+Array.from({length:pages},(_,i)=>`<button class="${i===pg?'on':''}" onclick="setDBPage(${i})">${i+1}</button>`).join('')+'</div>' : '';
 $('#main').innerHTML=`<div class="top"><div style="display:flex;align-items:center;gap:10px"><button class="btn g menubtn" onclick="toggleMenu()">☰</button>
   <div><h1>고객 DB</h1><div class="date">전체 ${custArr().length}명${DBMONTH?` · ${DBMONTH}월 접수 ${cs.length}명`:''} · 카드를 누르면 관리</div></div></div>
   <button class="btn b" onclick="openNew()">+ 신규 고객</button></div>
   ${monthBar}
   <div class="cdbgrid">${cards||'<div class="panel" style="color:#94a3b8">해당 월 접수 고객이 없습니다.</div>'}</div>
   ${pager}`;
}
function renderStub(t){
 const T={call:'📞 오늘 콜',docs:'📁 서류함',meet:'📅 미팅',rev:'💰 수익·정산',report:'📈 리포트'}[t];
 buildNav(t);
 $('#main').innerHTML=`<div class="top"><div style="display:flex;align-items:center;gap:10px"><button class="btn g menubtn" onclick="toggleMenu()">☰</button><h1>${T}</h1></div></div><div class="panel" style="text-align:center;color:#94a3b8;padding:50px">${T} 화면은 다음 단계에서 구성합니다.</div>`;
}

/* ===== 외부 공유 뷰 (?share=ID) — 본인 건만 + 같이 수정 ===== */
function renderExt(){
 const s=getSharer(shareId);
 document.querySelector('.side').classList.add('hide');
 const m=$('#main'); m.style.marginLeft='0'; m.style.maxWidth='760px'; m.style.margin='0 auto';
 if(!s){ m.innerHTML='<div class="panel">유효하지 않은 공유 링크입니다.</div>'; return; }
 const all=custArr();
 const insDeals=all.filter(c=>feeShr(c,'insurance')===shareId);
 const taxDeals=all.filter(c=>feeShr(c,'tax')===shareId);
 const feeRow=(c,k)=>`<div class="ins"><div><span class="nm">${esc(c.nm)}</span><span class="fd">${esc(c.biz)} · ${esc(c.fund)}</span><div style="margin-top:3px">${chip(c.stage)}</div></div>
   <div style="display:flex;align-items:center;gap:10px"><span class="val" onclick="iFeeAmt(this,'${c.id}','${k}')">${fee(c,k).amt?esc(fee(c,k).amt)+'원':'＋ 금액'}</span>
   <span class="st ${fee(c,k).status}" onclick="iFeeStatus(this,'${c.id}','${k}')">${fee(c,k).status} ▾</span></div></div>`;
 m.innerHTML=`
 <div class="sharebar"><div class="badge">실시간 협업</div><div><b style="font-size:16px">${esc(s.name)}님 협업 보드</b><div style="font-size:12px;color:#a5b4fc">황현 컨설팅 · ${esc(s.org)} · 변경하면 실시간 반영됩니다</div></div></div>
 <div class="panel"><div class="ph"><b>🛡️ 보험 계약 (${insDeals.length}건)</b><span class="sub">금액·상태 눌러 수정</span></div>${insDeals.length?insDeals.map(c=>feeRow(c,'insurance')).join(''):'<div class="ins">진행 건이 없습니다.</div>'}</div>
 <div class="panel"><div class="ph"><b>🧾 세무 이관 (${taxDeals.length}건)</b><span class="sub">금액·상태 눌러 수정</span></div>${taxDeals.length?taxDeals.map(c=>feeRow(c,'tax')).join(''):'<div class="ins">진행 건이 없습니다.</div>'}</div>
 <div style="text-align:center;color:#94a3b8;font-size:12px;margin-top:14px">${esc(s.name)}님 관련 건만 표시 · 다른 고객/수익 정보는 보이지 않습니다</div>`;
}
</script>
