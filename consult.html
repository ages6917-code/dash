/*RPT_MODULE*/
/* ===================================================================
   📈 리포트 — 월별 실적 (2026-07-15 신설)
   사장님 요구: 월별 분리 / 이번달 DB·미팅·쉐어·수익 시각화 / 전월 대비

   설계 원칙(dataviz):
   - 단위가 다른 measure를 한 축에 섞지 않는다 → 건수 차트와 수익 차트를 분리(이중축 금지)
   - 색은 눈이 아니라 검증기로 고름: #4f46e5·#0d9488·#d97706
     (기존 인디고+보라 조합은 ΔE 11.4로 정상시력에서도 구분이 어려워 탈락)
   - 시리즈 2개 이상 → 범례 상시 + 직접 라벨(색만으로 구분하게 두지 않음)
   - 데이터가 없으면 0으로 그리지 않고 "없음"이라고 쓴다(지어내기 금지)
   =================================================================== */

var RPT_PAL = { db: '#4f46e5', meet: '#0d9488', share: '#d97706' };
var RPT_MON = null;   // 보고 있는 달(YYYY-MM). null이면 이번 달

/* ---------- 날짜 유틸 ---------- */
function rptNow() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function rptPrev(ym) { var p = ym.split('-'), y = +p[0], m = +p[1] - 1; if (m < 1) { m = 12; y--; } return y + '-' + String(m).padStart(2, '0'); }
function rptLabel(ym) { var p = ym.split('-'); return +p[1] + '월'; }
/* 고객이 어느 달에 들어왔나 — created(ms) 우선, 없으면 received(YYYY-MM-DD 또는 YYYY/MM/DD).
   ★둘 다 없으면 null = '월 미상'. 임의로 이번 달에 넣지 않는다(그게 통계 조작이다). */
function rptCustMonth(c) {
  if (c && c.created) { try { var d = new Date(c.created); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); } catch (e) { } }
  var r = c && c.received;
  if (r) { var s = String(r).replace(/\//g, '-'); var m = s.match(/^(\d{4})-(\d{1,2})/); if (m) return m[1] + '-' + String(+m[2]).padStart(2, '0'); }
  return null;
}
function rptFeeMonth(f) {   // 수수료 완료월 — doneAt 없으면 null(월 미상)
  if (!f || !f.doneAt) return null;
  var m = String(f.doneAt).replace(/\//g, '-').match(/^(\d{4})-(\d{1,2})/);
  return m ? m[1] + '-' + String(+m[2]).padStart(2, '0') : null;
}

/* ---------- 집계 ---------- */
function rptMonths(n) {  // 최근 n개월 [오래된→최신]
  var out = [], ym = rptNow();
  for (var i = 0; i < n; i++) { out.unshift(ym); ym = rptPrev(ym); }
  return out;
}
function rptStats(ym) {
  var cs = custArr();
  var db = cs.filter(function (c) { return rptCustMonth(c) === ym; }).length;

  var M = (typeof DATA !== 'undefined' && DATA.meetings) || {};
  var meet = Object.keys(M).filter(function (k) { return String((M[k] || {}).date || '').slice(0, 7) === ym; }).length;

  /* 쉐어: 공유풀 항목엔 '언제 쉐어했는지'가 없다(up=최종수정시각뿐).
     → 월별로 못 가른다. 현재 총량만 쓰고 화면에 그 사실을 명시한다. */
  var share = (typeof sharedArr === 'function') ? sharedArr().length : 0;

  var revDone = 0, revNoDate = 0;
  cs.forEach(function (c) {
    ['insurance', 'consulting', 'tax'].forEach(function (k) {
      var f = ((c.fees || {})[k]) || {};
      if (f.status !== '완료') return;
      var fm = rptFeeMonth(f);
      var amt = feeWon(c, k);
      if (fm === ym) revDone += amt; else if (!fm) revNoDate += amt;
    });
  });
  return { db: db, meet: meet, share: share, rev: revDone, revNoDate: revNoDate };
}
function rptUnknownCount() { return custArr().filter(function (c) { return !rptCustMonth(c); }).length; }

/* ---------- 델타(전월 대비) ---------- */
function rptDelta(cur, prev) {
  if (prev === 0 && cur === 0) return { t: '–', c: '#94a3b8', s: '전월도 0' };
  if (prev === 0) return { t: '신규 +' + cur, c: '#059669', s: '전월 0건' };
  var d = cur - prev, p = Math.round(d / prev * 100);
  if (d === 0) return { t: '± 0', c: '#94a3b8', s: '전월과 동일' };
  return { t: (d > 0 ? '▲ +' : '▼ ') + d + ' (' + (d > 0 ? '+' : '') + p + '%)', c: d > 0 ? '#059669' : '#dc2626', s: '전월 ' + prev };
}

/* ---------- SVG 차트 (외부 라이브러리 0) ---------- */
/* 그룹 막대 — 같은 단위(건수)끼리만. 단위가 다른 수익은 별도 차트로 분리. */
function rptBarChart(months, series, opt) {
  opt = opt || {};
  var W = 680, H = 240, PL = 42, PR = 14, PT = 16, PB = 34;
  var iw = W - PL - PR, ih = H - PT - PB;
  var max = 0;
  series.forEach(function (s) { s.data.forEach(function (v) { if (v > max) max = v; }); });
  var top = max <= 0 ? 4 : Math.ceil(max * 1.25);
  var y = function (v) { return PT + ih - (v / top) * ih; };
  var gw = iw / months.length, bw = Math.min(18, (gw - 14) / series.length);

  var grid = '', ticks = 4;
  for (var i = 0; i <= ticks; i++) {
    var v = Math.round(top / ticks * i), yy = y(v);
    grid += '<line x1="' + PL + '" y1="' + yy + '" x2="' + (W - PR) + '" y2="' + yy + '" stroke="var(--rptGrid,#eef2f7)" stroke-width="1"/>'
      + '<text x="' + (PL - 8) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="10" fill="var(--rptMuted,#94a3b8)">' + v + '</text>';
  }
  var bars = '', labels = '';
  months.forEach(function (m, mi) {
    var cx = PL + gw * mi + gw / 2;
    var totalW = bw * series.length + 2 * (series.length - 1);   // 2px 간격(마크 사이 여백)
    series.forEach(function (s, si) {
      var v = s.data[mi] || 0;
      var x = cx - totalW / 2 + si * (bw + 2);
      var h = v <= 0 ? 0 : Math.max(2, PT + ih - y(v));
      if (h > 0) bars += '<rect x="' + x + '" y="' + (PT + ih - h) + '" width="' + bw + '" height="' + h + '" rx="3" fill="' + s.color + '">'
        + '<title>' + m + ' · ' + s.name + ' ' + v + (opt.unit || '건') + '</title></rect>';
      // 직접 라벨(값>0) — 색만으로 읽게 두지 않음
      if (v > 0) bars += '<text x="' + (x + bw / 2) + '" y="' + (PT + ih - h - 4) + '" text-anchor="middle" font-size="9.5" font-weight="700" fill="' + s.color + '">' + v + '</text>';
    });
    labels += '<text x="' + cx + '" y="' + (H - 12) + '" text-anchor="middle" font-size="11" font-weight="' + (mi === months.length - 1 ? '800' : '600') + '" fill="' + (mi === months.length - 1 ? 'var(--rptInk,#1e293b)' : 'var(--rptMuted,#94a3b8)') + '">' + rptLabel(m) + '</text>';
  });
  var legend = series.map(function (s) {
    return '<span style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--rptInk,#475569)">'
      + '<i style="width:9px;height:9px;border-radius:2px;background:' + s.color + ';display:inline-block"></i>' + s.name + '</span>';
  }).join('<span style="width:12px;display:inline-block"></span>');

  return '<div style="display:flex;gap:14px;margin-bottom:6px">' + legend + '</div>'
    + '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;overflow:visible" role="img" aria-label="월별 추이">'
    + '<line x1="' + PL + '" y1="' + (PT + ih) + '" x2="' + (W - PR) + '" y2="' + (PT + ih) + '" stroke="var(--rptAxis,#cbd5e1)" stroke-width="1"/>'
    + grid + bars + labels + '</svg>';
}

/* 수익 단독 차트(단위: 만원) — 건수와 축을 절대 공유하지 않는다 */
function rptRevChart(months, data) {
  var W = 680, H = 200, PL = 52, PR = 14, PT = 16, PB = 34;
  var iw = W - PL - PR, ih = H - PT - PB;
  var max = Math.max.apply(null, data.concat([0]));
  if (max <= 0) return '<div style="padding:26px;text-align:center;color:var(--rptMuted,#94a3b8);font-size:13px;background:var(--rptEmpty,#f8fafc);border-radius:10px">'
    + '완료(확정)된 수수료가 아직 없어 그릴 수익이 없습니다.<br><span style="font-size:11.5px">고객 상세에서 수수료를 <b>완료</b>로 바꾸면 그 달 수익으로 잡힙니다.</span></div>';
  var top = Math.ceil(max * 1.25);
  var y = function (v) { return PT + ih - (v / top) * ih; };
  var gw = iw / months.length, bw = Math.min(30, gw - 18);
  var grid = '', bars = '', labels = '';
  for (var i = 0; i <= 4; i++) {
    var v = Math.round(top / 4 * i), yy = y(v);
    grid += '<line x1="' + PL + '" y1="' + yy + '" x2="' + (W - PR) + '" y2="' + yy + '" stroke="var(--rptGrid,#eef2f7)" stroke-width="1"/>'
      + '<text x="' + (PL - 8) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="10" fill="var(--rptMuted,#94a3b8)">' + fmtMan(v) + '</text>';
  }
  months.forEach(function (m, i) {
    var cx = PL + gw * i + gw / 2, v = data[i] || 0;
    var h = v <= 0 ? 0 : Math.max(2, PT + ih - y(v));
    if (h > 0) {
      bars += '<rect x="' + (cx - bw / 2) + '" y="' + (PT + ih - h) + '" width="' + bw + '" height="' + h + '" rx="4" fill="' + RPT_PAL.db + '"><title>' + m + ' · ' + fmtMan(v) + '원</title></rect>'
        + '<text x="' + cx + '" y="' + (PT + ih - h - 5) + '" text-anchor="middle" font-size="10" font-weight="800" fill="' + RPT_PAL.db + '">' + fmtMan(v) + '</text>';
    }
    labels += '<text x="' + cx + '" y="' + (H - 12) + '" text-anchor="middle" font-size="11" font-weight="' + (i === months.length - 1 ? '800' : '600') + '" fill="' + (i === months.length - 1 ? 'var(--rptInk,#1e293b)' : 'var(--rptMuted,#94a3b8)') + '">' + rptLabel(m) + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;overflow:visible" role="img" aria-label="월별 수익">'
    + '<line x1="' + PL + '" y1="' + (PT + ih) + '" x2="' + (W - PR) + '" y2="' + (PT + ih) + '" stroke="var(--rptAxis,#cbd5e1)" stroke-width="1"/>'
    + grid + bars + labels + '</svg>';
}

/* ---------- 화면 ---------- */
function rptGo(ym) { RPT_MON = ym; renderReport(); }

function renderReport() {
  buildNav('report');
  var ym = RPT_MON || rptNow();
  var prev = rptPrev(ym);
  var cur = rptStats(ym), pv = rptStats(prev);
  var months = rptMonths(6);
  var unknown = rptUnknownCount();

  var tile = function (icon, label, val, unit, d, note) {
    return '<div class="rptTile">'
      + '<div class="rptTL">' + icon + ' ' + label + '</div>'
      + '<div class="rptTV">' + val + '<small>' + unit + '</small></div>'
      + '<div class="rptTD" style="color:' + d.c + '">' + d.t + '</div>'
      + '<div class="rptTS">' + (note || d.s) + '</div></div>';
  };

  var monthBtns = rptMonths(6).map(function (m) {
    return '<button class="rptMB' + (m === ym ? ' on' : '') + '" onclick="rptGo(\'' + m + '\')">' + rptLabel(m) + '</button>';
  }).join('');

  var series = [
    { name: '신규 DB', color: RPT_PAL.db, data: months.map(function (m) { return rptStats(m).db; }) },
    { name: '미팅', color: RPT_PAL.meet, data: months.map(function (m) { return rptStats(m).meet; }) }
  ];
  var revData = months.map(function (m) { return rptStats(m).rev; });

  /* 데이터 실태 경고 — 숨기지 않고 그대로 보여준다 */
  var warn = [];
  if (unknown) warn.push('고객 <b>' + unknown + '명</b>은 등록일이 없어 어느 달인지 알 수 없습니다(집계 제외). 신규 등록분부터는 자동 기록됩니다.');
  if (cur.revNoDate) warn.push('완료 수수료 <b>' + fmtMan(cur.revNoDate) + '원</b>은 완료일이 없어 월에 넣지 못했습니다(오늘부터 완료 처리분은 날짜가 남습니다).');
  warn.push('🤝 쉐어는 <b>쉐어를 켠 날짜</b>가 기록되지 않아 월별로 못 가릅니다 — 아래 숫자는 <b>현재 총량</b>입니다.');

/* ★2026-07-16 — 종전엔 #dgrid(서류 있는 고객)만 필터링해서, 검색어를 쳐도

/*DOCS_CLOUD*/
/* ===================================================================
   📁 서류 클라우드 저장 v2 (2026-07-15 사장님 지시)
   "노트북·데탑·폰·공유된 사람 전부 이 기능을 쓰게 해줘"

   [바뀐 것]
   - 기존: 브라우저 → http://127.0.0.1:8799 (내 PC 파일서버) → D:\컨설팅_서류
           · 데탑에서만 동작(노트북·폰엔 서버가 없음)
           · 최신 크롬이 "인터넷 사이트 → 내 PC" 접근을 막아 조용히 실패
   - 이제: 브라우저 → RTDB(customers/<cid>/docsData) → 모든 기기 + 팀장
           · 파일서버 불필요 → 크롬 차단 문제 자체가 소멸
           · 쉐어건이면 shared/<sid>/items/<cid>/docs 로 미러 → 팀장도 열람

   [용량 근거 — 실측]
   전체 35MB / 57개 / 최대 2.2MB. base64는 +33% → 약 47MB.
   RTDB 무료: 저장 1GB, 전송 10GB/월 → 저장 4.7% 사용. 여유 충분.
   ★단 파일당 8MB 상한을 둔다(RTDB 단일 노드 과대 방지 + 모바일 로딩 보호).

   [보안 — 사장님 결정]
   민감서류(신분증·재무제표)를 클라우드에 올린다 = 종전 "내 PC에만" 방침의 변경.
   RTDB 규칙상 root는 ages6917 전용, shared/<sid>는 그 팀장 본인만 → 외부 노출은 없다.
   =================================================================== */

var DOCS_MAX = 8 * 1024 * 1024;          // 파일당 8MB
var _docBusy = false;

function _docRef(cid) { return dref('customers/' + cid + '/docsData'); }
function _fid() { return 'f' + Date.now() + Math.random().toString(36).slice(2, 7); }
function _docsOf(c) { var d = (c && c.docsData) || {}; return Object.keys(d).map(function (k) { return Object.assign({ _id: k }, d[k]); }); }

/* 파일 → base64 */
function _toB64(f) {
  return new Promise(function (res, rej) {
    var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsDataURL(f);
  });
}

/* ---------- 업로드 (알집 자동 해제 포함) ---------- */
async function docUploadCloud(id, fileList, opts) {
  opts = opts || {};
  var files = [].slice.call(fileList || []);
  if (!files.length) return;
  if (_docBusy) { toast('업로드 진행 중입니다'); return; }
  _docBusy = true;

  var added = 0, skipped = [];
  try {
    for (var i = 0; i < files.length; i++) {
      var f = files[i];

      /* 알집 = 풀어서 각각 저장 (기존 파일서버가 하던 일을 브라우저에서) */
      if (/\.zip$/i.test(f.name)) {
        if (!window.JSZip) { skipped.push(f.name + '(zip 라이브러리 없음 — 새로고침)'); continue; }
        toast('📦 ' + f.name + ' 푸는 중…');
        var zip = await JSZip.loadAsync(f);
        var entries = [];
        zip.forEach(function (p, e) { if (!e.dir) entries.push(e); });
        for (var j = 0; j < entries.length; j++) {
          var e = entries[j];
          var blob = await e.async('blob');
          if (blob.size > DOCS_MAX) { skipped.push(e.name + '(8MB 초과)'); continue; }
          var nm = (e.name.split('/').pop() || e.name);
          var b64 = await _toB64(new File([blob], nm));
          await _docPut(id, nm, blob.size, blob.type, b64);
          added++;
        }
        continue;
      }

      if (f.size > DOCS_MAX) { skipped.push(f.name + '(' + Math.round(f.size / 1048576) + 'MB — 8MB 초과)'); continue; }
      var data = await _toB64(f);
      await _docPut(id, f.name, f.size, f.type, data);
      added++;
    }
  } catch (err) {
    toast('⚠️ 업로드 오류: ' + (err && err.message || err));
  }
  _docBusy = false;

  if (added) {
    var c = getCust(id) || {};
    var patch = { docStatus: '접수완료' };
    if (!c.docDate) patch.docDate = today();
    setCust(id, patch);
    _docMirror(id);                        // 쉐어건이면 팀장에게도
    toast('✅ ' + added + '개 저장됨 — 모든 기기에서 열립니다');
  }
  if (skipped.length) toast('⚠️ 제외: ' + skipped.join(', '));
}

function _docPut(cid, name, size, type, data) {
  var meta = {
    name: String(name || 'file').slice(0, 120), size: size || 0,
    type: type || '', data: data, at: new Date().toISOString().slice(0, 16).replace('T', ' '),
    by: (typeof IS_SHARER !== 'undefined' && IS_SHARER) ? ((typeof SHARER_NAME !== 'undefined' && SHARER_NAME) || '팀장') : '사장님'
  };
  return _docRef(cid).child(_fid()).set(meta);
}

/* ---------- 열기 / 다운로드 (기기 무관) ---------- */
function _docBlob(d) {
  var s = d.data || '';
  var i = s.indexOf(',');
  var b = atob(i >= 0 ? s.slice(i + 1) : s);
  var u = new Uint8Array(b.length);
  for (var k = 0; k < b.length; k++) u[k] = b.charCodeAt(k);
  return new Blob([u], { type: d.type || 'application/octet-stream' });
}
function docOpenCloud(cid, fid) {
  var c = getCust(cid) || {}; var d = (c.docsData || {})[fid]; if (!d) return toast('파일을 찾을 수 없습니다');
  var url = URL.createObjectURL(_docBlob(d));
  window.open(url, '_blank');
  setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
}
function docDownCloud(cid, fid) {
  var c = getCust(cid) || {}; var d = (c.docsData || {})[fid]; if (!d) return toast('파일을 찾을 수 없습니다');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(_docBlob(d)); a.download = d.name; a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 60000);
}
function docDelCloud(cid, fid) {
  var c = getCust(cid) || {}; var d = (c.docsData || {})[fid]; if (!d) return;
  if (!confirm('“' + d.name + '” 삭제할까요?\n모든 기기에서 사라집니다.')) return;
  _docRef(cid).child(fid).remove().then(function () {
    var left = _docsOf(getCust(cid) || {}).length;
    if (!left) setCust(cid, { docStatus: '접수전' });
    _docMirror(cid); toast('삭제됨');
  });
}
/* 전체 ZIP 내려받기 — 브라우저에서 묶는다(서버 불필요) */
async function docZipCloud(cid) {
  var c = getCust(cid) || {}; var arr = _docsOf(c);
  if (!arr.length) return toast('서류가 없습니다');
  if (!window.JSZip) return toast('zip 라이브러리 없음 — 새로고침');
  toast('📦 묶는 중… ' + arr.length + '개');
  var z = new JSZip();
  arr.forEach(function (d) { z.file(d.name, _docBlob(d)); });
  var blob = await z.generateAsync({ type: 'blob' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = (c.nm || cid) + '_서류.zip'; a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 60000);
}

/* ---------- 쉐어건 → 팀장에게 서류 미러 ---------- */
/* 팀장은 customers/를 못 읽는다(규칙상 사장님 전용). 그래서 shared/<sid>/items/<cid>/docs 로 복사해
   팀장이 자기 공유풀 안에서 열 수 있게 한다. 쉐어 안 한 고객은 미러하지 않는다(격리 유지). */
function _docMirror(cid) {
  try {
    if (typeof IS_SHARER !== 'undefined' && IS_SHARER) return;   // 팀장은 미러 주체가 아님
    var c = getCust(cid); if (!c) return;
    var targets = (typeof shareTargets === 'function') ? shareTargets(c) : [];
    if (!targets.length) return;
    var arr = _docsOf(c);
    var payload = {};
    arr.forEach(function (d) { payload[d._id] = { name: d.name, size: d.size, type: d.type, data: d.data, at: d.at, by: d.by }; });
    targets.forEach(function (sid) {
      RAWREF('shared/' + sid + '/items/' + cid + '/docs').set(arr.length ? payload : null);
    });
  } catch (e) { console.log('[docs] 미러 실패', e); }
}
window._docMirror = _docMirror;

/* ---------- 서류함 UI (고객 상세) ---------- */
function docsHtmlCloud(id, c) {
  var arr = _docsOf(c).sort(function (a, b) { return (a.at || '') < (b.at || '') ? 1 : -1; });
  var total = arr.reduce(function (t, d) { return t + (d.size || 0); }, 0);
  var rows = arr.map(function (d) {
    var kb = d.size >= 1048576 ? (d.size / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round((d.size || 0) / 1024)) + 'KB';
    return '<div class="dfile">'
      + '<span class="fn" onclick="docOpenCloud(\'' + id + '\',\'' + d._id + '\')" title="열기">' + _icoOf(d.name) + ' ' + esc(d.name) + '</span>'
      + '<span class="fm">' + kb + ' · ' + esc(d.at || '') + (d.by ? ' · ' + esc(d.by) : '') + '</span>'
      + '<button class="fb" onclick="docDownCloud(\'' + id + '\',\'' + d._id + '\')" title="다운로드">⬇</button>'
      + '<button class="fb x" onclick="docDelCloud(\'' + id + '\',\'' + d._id + '\')" title="삭제">✕</button>'
      + '</div>';
  }).join('');

  return '<div class="docbox" id="docbox">'
    + '<div class="dh"><b>📁 서류함 <span style="font-weight:600;color:#a16207;font-size:12px">'
    + (arr.length ? arr.length + '개 · ' + (total >= 1048576 ? (total / 1048576).toFixed(1) + 'MB' : Math.round(total / 1024) + 'KB') : '비어있음') + '</span></b>'
    + (arr.length ? '<span class="add" onclick="docZipCloud(\'' + id + '\')">⬇ 전체 ZIP</span>' : '') + '</div>'
    + (rows || '')
    + '<div class="dropzone" ondragover="event.preventDefault();this.classList.add(\'drag\')" ondragleave="this.classList.remove(\'drag\')" ondrop="docDropCloud(event,\'' + id + '\')">'
    + '📎 파일 끌어다 놓기 <b>(알집 OK · 자동 분리저장)</b><br>'
    + '<label class="filelabel">또는 파일 선택<input type="file" multiple style="display:none" onchange="docUploadCloud(\'' + id + '\',this.files)"></label>'
    + '<div style="font-size:11px;color:#a8a29e;margin-top:6px;font-weight:500">☁️ 데탑·노트북·폰 어디서나 · 쉐어건은 담당 팀장도 열람 · 파일당 8MB</div></div>'
    + '</div>';
}
function _icoOf(n) {
  n = (n || '').toLowerCase();
  if (/\.(pdf)$/.test(n)) return '📕';
  if (/\.(jpg|jpeg|png|gif|webp|bmp)$/.test(n)) return '🖼️';
  if (/\.(xls|xlsx|csv)$/.test(n)) return '📗';
  if (/\.(doc|docx|hwp)$/.test(n)) return '📘';
  if (/\.(ppt|pptx)$/.test(n)) return '📙';
  if (/\.(zip|7z|rar)$/.test(n)) return '🗜️';
  return '📄';
}
function docDropCloud(e, id) {
  e.preventDefault(); e.currentTarget.classList.remove('drag');
  if (e.dataTransfer && e.dataTransfer.files) docUploadCloud(id, e.dataTransfer.files);

function fundList(){
  return custArr().filter(c=>custStages(c).indexOf('자금접수완료')>=0)
    .sort((a,b)=>{                       // 접수일 오래된 순 → 미기록은 맨 위(확인이 필요하니까)
      if(!a.fundDate && !b.fundDate) return 0;
      if(!a.fundDate) return -1;
      if(!b.fundDate) return 1;
      return a.fundDate.localeCompare(b.fundDate);
    });
}
function setFundDate(id){
  const c=getCust(id)||{};

}

function teamKey(){ try{ return (DATA&&DATA._aikey&&DATA._aikey.gemini)||''; }catch(e){ return ''; } }

  if(aiTeamOn()) return 'gemini';                              // 아니면 팀 공용
  return c.provider||'gemini';
}
function aiKey(p){ p=p||aiProv(); const mine=myKeys()[p]; if(mine) return mine; if(p==='gemini' && teamKey()) return teamKey(); return ''; }

function aiContext(c){
  let t='[고객 정보]\n';
  t+='이름: '+(c.nm||'-')+'\n유형: '+(c.type||'-')+'\n업종/사업: '+(c.biz||'-')+'\n상호: '+(c.bizName||'-')+'\n진행단계: '+(c.stage||'-')+'\n신청금액: '+(c.fund||'-')+'\n최초접수: '+(c.received||'-')+'\n';
  if(c.memo) t+='담당메모: '+c.memo+'\n';
  /* ★2026-07-16 — 여기도 c.docs를 읽고 있어서, 클라우드에 서류를 10개 올려도
     AI에겐 "제출서류 없음"으로 전달됐다(=요약이 서류를 못 보던 원인 중 하나). */
  const _dl=docList(c);
  if(_dl.length) t+='제출서류: '+_dl.map(d=>d.name).join(', ')+'\n';
  const sm=c.summary;
  if(sm&&Object.keys(sm).length){
    t+='\n[재무 요약]\n';
    if(sm.sales&&sm.sales.length) t+='매출추이: '+sm.sales.map(s=>s.y+' '+s.v+'억').join(', ')+'\n';
    if(sm.asset) t+='자산총계: '+sm.asset+'\n';
    if(sm.liab) t+='부채총계: '+sm.liab+'\n';
    if(sm.cap) t+='자본총계: '+sm.cap+'\n';
    if(sm.debtRatio) t+='부채비율: '+sm.debtRatio+'\n';
    if(sm.loans&&sm.loans.length) t+='대출현황: '+sm.loans.map(l=>l.bank+' '+l.amt+(l.desc?'('+l.desc+')':'')).join(', ')+'\n';
    if(sm.warn) t+='주의: '+sm.warn+'\n';
    if(sm.credit) t+='신용: '+sm.credit+'\n';
  }
  if(c.summaryNote) t+='재무메모: '+c.summaryNote+'\n';
  return t;
}
function aiFmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }
/* 팀 공용 모드: 여기에 Cloudflare Worker 주소를 넣으면 → 팀원은 키 입력 0, 그냥 작동.
   (비어있으면 지금처럼 각자 키 사용 = 현재 동작 그대로) */
const AI_PROXY_URL='';
function aiUseProxy(){ return !!AI_PROXY_URL; }
async function aiCallProxy(provider,ctx,q){
  let token=''; try{ const u=firebase.auth().currentUser; if(u) token=await u.getIdToken(); }catch(e){}
  const r=await fetch(AI_PROXY_URL,{method:'POST',headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},
    body:JSON.stringify({provider,context:ctx,question:q})});
  const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||'팀 공용 AI 오류');
  return j.answer||'(응답 없음)';
}
async function aiAsk(id,preset){
  const c=getCust(id); if(!c) return;
  const inp=document.getElementById('aiQ');
  const q=(preset||(inp?inp.value:'')||'').trim();
  if(!q){ toast('질문을 입력하세요'); if(inp)inp.focus(); return; }
  const proxy=aiUseProxy();
  const p=aiProv(), key=aiKey(p);
  if(!proxy && !key){ toast(AI_PROVS[p]+' 키를 먼저 입력하세요'); aiSettings(); return; }
  const ans=document.getElementById('aiAns'); if(!ans) return;
  if(preset&&inp) inp.value=q;
  ans.style.display='block';
  ans.innerHTML='<div class="ai-load"><span class="spin2"></span> '+(proxy?'AI':AI_PROVS[p])+'가 답변 생성 중…</div>';
  try{
    const out = proxy ? await aiCallProxy(p,aiContext(c),q) : await aiCall(p,key,aiContext(c),q);
    ans.innerHTML='<div class="ai-q">🙋 '+esc(q)+'</div><div class="ai-a">'+aiFmt(out)+'</div>';
  }catch(e){
    ans.innerHTML='<div class="ai-err">⚠ '+esc(e.message||'호출 실패')+'<br><span style="opacity:.75">'+(proxy?'팀 공용 AI 연결 확인 필요':'키가 올바른지/잔액 확인')+'. <a onclick="aiSettings()" style="color:#a5b4fc;cursor:pointer;text-decoration:underline">설정</a></span></div>';
  }
}
async function aiCall(p,key,ctx,q){
  const userMsg=ctx+'\n\n[질문]\n'+q;
  if(p==='gemini'){
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent',
      {method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({system_instruction:{parts:[{text:AI_SYS}]},contents:[{parts:[{text:userMsg}]}]})});
    const j=await r.json(); if(!r.ok) throw new Error((j.error&&j.error.message)||'Gemini 오류');
    return (((j.candidates||[])[0]||{}).content||{}).parts?.[0]?.text||'(응답 없음)';
  }
  if(p==='openai'){
    const r=await fetch('https://api.openai.com/v1/chat/completions',
      {method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
       body:JSON.stringify({model:'gpt-4o-mini',messages:[{role:'system',content:AI_SYS},{role:'user',content:userMsg}]})});
    const j=await r.json(); if(!r.ok) throw new Error((j.error&&j.error.message)||'OpenAI 오류');
    return (((j.choices||[])[0]||{}).message||{}).content||'(응답 없음)';
  }
  if(p==='claude'){
    const r=await fetch('https://api.anthropic.com/v1/messages',
      {method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
       body:JSON.stringify({model:'claude-3-5-haiku-20241022',max_tokens:1024,system:AI_SYS,messages:[{role:'user',content:userMsg}]})});
    const j=await r.json(); if(!r.ok) throw new Error((j.error&&j.error.message)||'Claude 오류');
    return ((j.content||[])[0]||{}).text||'(응답 없음)';
  }
  throw new Error('알 수 없는 AI');
}

const SUM_MIMES={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif',heic:'image/heic'};
function extOf(n){ return (''+n).split('.').pop().toLowerCase(); }
async function fileToB64(f){ return (''+await fileToDataURL(f)).split(',')[1]||''; }
function blobToB64(b){ return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res((''+r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(b);}); }
async function collectDocParts(files){
  const parts=[],used=[],skipped=[]; let total=0; const CAP=15*1024*1024;
  const push=async(name,mime,getB64,size)=>{ if(total+size>CAP){skipped.push(name+'(용량초과)');return;} const b=await getB64(); if(!b){skipped.push(name);return;} parts.push({inline_data:{mime_type:mime,data:b}}); used.push(name); total+=size; };
  for(const f of files){
    const e=extOf(f.name);
    if(e==='zip'){
      if(!window.JSZip){ skipped.push(f.name+'(zip 미지원 — 새로고침)'); continue; }
      try{ const zip=await JSZip.loadAsync(f);
        for(const path in zip.files){ const ent=zip.files[path]; if(ent.dir) continue; const en=extOf(path); const mime=SUM_MIMES[en]; if(!mime){ skipped.push(path.split('/').pop()); continue; }
          const blob=await ent.async('blob'); await push(path.split('/').pop(),mime,()=>blobToB64(blob),blob.size); }
      }catch(err){ skipped.push(f.name+'(zip 해제 실패 — .alz/.egg는 zip으로 저장)'); }
    } else if(SUM_MIMES[e]){ await push(f.name,SUM_MIMES[e],()=>fileToB64(f),f.size); }
    else { skipped.push(f.name+'(미지원)'); }
  }
  return {parts,used,skipped};
}
async function geminiSummarizeDocs(fileParts, hintNote, custText){
  const key=aiKey('gemini')||teamKey();
  if(!key) throw new Error('공용 제미나이 키 없음 — 관리자 메뉴 › 팀 공용 AI 켜기에서 등록하세요');
  const tp=[{text:'다음 서류들을 분석해 재무요약 JSON을 만들어라.'}];
  if(custText) tp.push({text:custText});
  if(hintNote) tp.push({text:'[담당자 요청] '+hintNote});
  const body={system_instruction:{parts:[{text:SUM_SYS}]},contents:[{parts:[...tp,...fileParts]}],generationConfig:{responseMimeType:'application/json',responseSchema:SUM_SCHEMA,temperature:0.1}};
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
  const j=await r.json(); if(!r.ok) throw new Error((j.error&&j.error.message)||'제미나이 오류');
  let txt=((((j.candidates||[])[0]||{}).content||{}).parts||[{}])[0].text||''; txt=txt.trim().replace(/^```json\s*/i,'').replace(/```$/,'').trim();
  let sm; try{ sm=JSON.parse(txt); }catch(e){ throw new Error('요약 파싱 실패 (서류가 흐리거나 재무자료가 아닐 수 있음)'); }
  sm._meta={reviewed:false,by:'gemini',ts:Date.now()};
  return sm;
}
async function autoSummarize(id, files, hintNote){

  GENNING.add(id); rerender();
  try{
    const {parts,used,skipped}=await collectDocParts(files);
    if(!parts.length){ throw new Error('읽을 수 있는 서류가 없습니다 (PDF·이미지만)'+(skipped.length?' · 제외: '+skipped.slice(0,3).join(', '):'')); }

    const sm=await geminiSummarizeDocs(parts, hintNote, 'PDF/이미지 '+used.length+'건 첨부');
    GENNING.delete(id);
    applySummary(id,sm,skipped);   /* ★2026-07-16: 반영 로직을 applySummary로 일원화
                                      (종전엔 이 자리에만 있어서 서류함 경로가 못 썼다.
                                       profile은 진단서 헤더가 쓰므로 delete 하지 않는다) */
  }catch(e){ GENNING.delete(id); rerender(); toast('요약 실패: '+(e&&e.message||'')); }
}
/* ===== 서류함에 이미 저장된 서류로 요약 생성 (2026-07-16 신설) =====
   사고: 사장님이 서류함에 10개를 끌어다 넣었는데 재무요약은 "입력된 정보 기반"인 채였다.
        원인 = 끌어놓기(docUploadCloud)는 '저장'만 하고 요약을 안 돌렸다. 요약은
        서류요청 모달(1340행) 경로에서만 돌았다 → 사장님 눈엔 "요약이 안 만들어짐".
   처방: ①업로드 끝나면 자동으로 요약 ②이미 쌓인 서류로도 언제든 재분석(버튼).
   RTDB에 base64로 이미 있으므로 원본 File 객체 없이도 분석 가능하다. */
function _b64Bytes(b64){ return Math.floor((''+b64).length*0.75); }
function docPartsFromStored(c){
  const parts=[],used=[],skipped=[]; let total=0; const CAP=15*1024*1024;
  const docs=(typeof _docsOf==='function')?_docsOf(c):[];
  for(const d of docs){
    if(!d||!d.data){ skipped.push((d&&d.name)||'?'); continue; }
    const mime=SUM_MIMES[extOf(d.name)];
    if(!mime){ skipped.push(d.name+'(미지원)'); continue; }       // 한글/엑셀 등은 제미나이가 못 읽음
    const sz=d.size||_b64Bytes(d.data);
    if(total+sz>CAP){ skipped.push(d.name+'(용량초과)'); continue; }
    parts.push({inline_data:{mime_type:mime,data:d.data}}); used.push(d.name); total+=sz;
  }
  return {parts,used,skipped};
}
async function autoSummarizeStored(id,silent){
  const c=getCust(id); if(!c) return;
  const {parts,used,skipped}=docPartsFromStored(c);
  if(!parts.length){ if(!silent) toast('분석할 서류가 없습니다 (PDF·이미지만 가능)'); return; }
  GENNING.add(id); rerender();
  try{
    toast('제미나이가 서류 '+used.length+'건 분석 중…');
    const sm=await geminiSummarizeDocs(parts,'', '서류함 보관분 '+used.length+'건');
    GENNING.delete(id);
    applySummary(id,sm,skipped);
  }catch(e){ GENNING.delete(id); rerender(); toast('요약 실패: '+(e&&e.message||'')); }
}

function applySummary(id,sm,skipped){
  const prof=sm.profile||{};
  const cur=getCust(id)||{};
  const patch={summary:sm, memo:(cur.memo&&cur.memo.indexOf('제미나이')<0?cur.memo+'\n':'')+'🤖 제미나이 자동요약 완료 — 검수 필요'};
  if(prof.owner && (!cur.nm||cur.nm==='(이름 미정)')) patch.nm=prof.owner;
  if(prof.bizName && !cur.bizName) patch.bizName=prof.bizName;
  if(prof.phone && !cur.phone) patch.phone=prof.phone;
  const bz=[prof.industry,prof.region].filter(Boolean).join('·'); if(bz && (!cur.biz||cur.biz==='-')) patch.biz=bz;
  if(prof.bizNo && !cur.bizNo) patch.bizNo=prof.bizNo;
  setCust(id,patch);
  const filled=[patch.nm&&'성함',patch.bizName&&'상호',patch.phone&&'번호'].filter(Boolean);
  toast('재무 진단서 생성 ✓'+(filled.length?' · '+filled.join('·')+' 자동입력':'')+((skipped&&skipped.length)?' (건너뜀 '+skipped.length+')':''));
}

function teamKeySave(){
  const key=aiVal('kTeam'); if(!key){ toast('키를 붙여넣어 주세요'); return; }
  if(typeof offline!=='undefined' && offline){ toast('오프라인 — 실시간 켠 뒤 등록하세요'); return; }
  const btn=event&&event.target; if(btn){ btn.disabled=true; btn.textContent='확인 중…'; }
  // 키 유효성 1회 검증 후 저장
  aiCall('gemini',key,'[테스트]','연결 테스트. "OK"라고만 답해.').then(()=>{
    try{ DATA._aikey={gemini:key,by:(typeof ME_EMAIL!=='undefined'&&ME_EMAIL)||'admin',ts:Date.now()}; }catch(e){}
    dref('_aikey').set({gemini:key,by:(typeof ME_EMAIL!=='undefined'&&ME_EMAIL)||'admin',ts:Date.now()})
      .then(()=>{ const ov=document.getElementById('aiSet'); if(ov)ov.remove(); toast('팀 공용 AI 켜짐 — 전원 적용 ✓'); rerender(); })
      .catch(()=>{ toast('저장 실패(권한 확인)'); if(btn){btn.disabled=false;btn.textContent='팀 전원에게 적용';} });
  }).catch(e=>{ toast('키 오류: '+(e.message||'유효하지 않음')); if(btn){btn.disabled=false;btn.textContent='팀 전원에게 적용';} });
}
function teamKeyOff(){
  if(typeof offline!=='undefined' && offline){ toast('오프라인'); return; }
  try{ delete DATA._aikey; }catch(e){}
  dref('_aikey').remove().then(()=>{ const ov=document.getElementById('aiSet'); if(ov)ov.remove(); toast('팀 공용 모드 꺼짐'); rerender(); }).catch(()=>toast('실패'));
}

function aiSaveMine(){
  const cla=aiVal('kCla'), oai=aiVal('kOai');
  if(!cla && !oai){ toast('Claude 또는 GPT 키를 넣어주세요'); return; }
  const c=aiCfg(); c.keys=Object.assign({}, c.keys||{}, {claude:cla, openai:oai});
  c.provider = cla ? 'claude' : 'openai';     // 등록한 내 키로 자동 전환
  aiSaveCfg(c);
  const ov=document.getElementById('aiSet'); if(ov)ov.remove();

}
function aiClearMine(){
  const c=aiCfg(); c.keys={}; c.provider='gemini'; aiSaveCfg(c);

  toast('팀 공용 AI로 전환됨'); rerender();

function copyShare(){

<!-- ★2026-07-16 겹침 수정 — 이 버튼(bottom:16)이 🔄최신화(bottom:12)·버전배지(bottom:54)와
     같은 자리에 깔려 서로 가렸다(사장님 스크린샷). 셋을 세로로 쌓는다:
       최신화 bottom:12  →  배지 bottom:54  →  설치 bottom:88.
     PC에서는 '홈 화면에 추가'가 무의미하고 화면만 가리므로 아예 숨긴다(폰에서만 노출). -->
<button id="pwaInstall" style="position:fixed;right:12px;bottom:88px;z-index:9997;border:none;background:rgba(79,70,229,.92);color:#fff;border-radius:20px;padding:8px 13px;font-size:12.5px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.28);cursor:pointer;font-family:'Malgun Gothic',sans-serif;display:none">📲 앱 설치</button>
<script>
/* ★2026-07-15 — 서비스워커 등록 중단 + 기존 등록 청소.
   여기서 register('sw.js')를 한 게 스코프 /dash/ 전체에 걸려, 옛 SW 캐시가 위탁·현황판까지
   가로챘다(사장님 노트북에서 CacheStorage 45.9MB 잔존 확인 → "껐다 켜도 옛 화면"의 원인).
   PWA 설치보다 "화면이 최신인가"가 훨씬 중요하므로 SW는 쓰지 않는다.
   아래 코드가 이 페이지를 여는 모든 기기에서 옛 SW와 캐시를 즉시 제거한다. */
if('serviceWorker' in navigator){
  try{
    navigator.serviceWorker.getRegistrations().then(function(rs){
      rs.forEach(function(r){ r.unregister(); });
    }).catch(function(){});
    if(window.caches && caches.keys){
      caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }).catch(function(){});
    }
  }catch(e){}
}
/* 자동 최신화 v2 (2026-07-15 전면 수정)
   ★종전 버그: 이 체크가 '페이지 로드 시 1회'뿐이라, 앱 창을 켜둔 채로 있으면
     새 배포를 영원히 모른다. 사장님이 Chrome 앱창을 상시 띄워두시는데 그래서
     "고쳤다는데 내 화면엔 안 보인다"가 계속 반복됐다(오늘 실제로 이 케이스).
   ★수정: 60초마다 확인 + 창을 다시 볼 때(visibilitychange) 확인.
     · 입력 중(input/textarea 포커스)이면 리로드하지 않고 배너만 → 타이핑 날림 방지
     · 그 외엔 배너 띄우고 5초 뒤 자동 새로고침(데이터는 RTDB 실시간 저장이라 유실 없음) */
window.BUILD_VER='20260720-100946';
(function(){
  var busy=false, banner=null, timer=null;
  function typing(){
    var a=document.activeElement;
    return !!(a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.isContentEditable));
  }
  /* ★기존 쿼리를 보존하며 v만 갈아끼운다.
     종전엔 location.pathname+'?v=' 로 통째 교체해서 ?share=…(팀장 전용링크)·?ns=demo 같은
     파라미터가 자동 새로고침 때 통째로 날아갔다(실험 중 발견). */
  function reload(v){
    try{
      var u=new URL(location.href);
      u.searchParams.set('v', v);
      location.replace(u.pathname+u.search);
    }catch(e){ location.replace(location.pathname+'?v='+encodeURIComponent(v)); }
  }
  function showBanner(v){
    if(banner) return;
    banner=document.createElement('div');
    banner.style.cssText='position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:99999;'
      +'background:#4f46e5;color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:700;'
      +"font-family:'Malgun Gothic',sans-serif;box-shadow:0 8px 26px rgba(79,70,229,.45);cursor:pointer;display:flex;gap:10px;align-items:center";
    banner.innerHTML='<span>🆕 새 버전이 있습니다</span><span style="background:rgba(255,255,255,.22);padding:4px 10px;border-radius:7px">지금 새로고침</span>';
    banner.onclick=function(){ reload(v); };
    (document.body||document.documentElement).appendChild(banner);
    if(!typing()) timer=setTimeout(function(){ if(!typing()) reload(v); }, 5000);
  }
  function check(){
    if(busy) return; busy=true;
    fetch('version.txt',{cache:'no-store'}).then(function(r){return r.ok?r.text():null;}).then(function(v){
      busy=false; if(!v) return; v=v.trim(); if(!v) return;
      if(v===window.BUILD_VER) return;
      /* 이미 v=<최신>으로 리로드했는데도 옛 빌드가 떴다면 = 캐시가 안 풀린 것.
         또 리로드하면 무한루프 → 배너로만 알리고 사용자가 누르게 한다. */
      var already=false;
      try{ already=(new URL(location.href)).searchParams.get('v')===v; }catch(e){ already=location.search.indexOf('v='+v)>=0; }
      if(already){ showBanner(v); return; }
      if(typing()){ showBanner(v); return; }
      reload(v);
    }).catch(function(){ busy=false; });
  }
  try{
    check();                                   /* 로드 시 1회 */
    setInterval(check, 60000);                 /* ★60초마다 — 창을 켜둬도 새 배포를 잡는다 */
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) check(); });  /* 창 다시 볼 때 */
  }catch(e){}
})();
/* 버전 배지 + 🔄 최신화 버튼 — 다른 대시보드 8종과 통일. BUILD_VER(배포시각) 표시. 좌측 메뉴 피해 우측하단 배치 */
(function(){ try{
  var raw=window.BUILD_VER||'', m=raw.match(/^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/);
  var disp = m ? (m[1]+'-'+m[2]+'-'+m[3]+' '+m[4]+':'+m[5]) : (raw && raw.indexOf('__BUILD')<0 ? raw : 'dev');
  function add(){
    if(!document.body || document.getElementById('dashVerBadge')) return;
    var b=document.createElement('div'); b.id='dashVerBadge'; b.title='배포 버전 - 이 시각 이후가 최신';
    b.style.cssText='position:fixed;right:12px;bottom:54px;z-index:99998;background:rgba(17,24,39,.82);color:#c7d2fe;border-radius:13px;padding:4px 10px;font-size:11px;font-weight:700;box-shadow:0 3px 9px rgba(0,0,0,.22);pointer-events:none;font-family:sans-serif';
    b.textContent='v'+disp; document.body.appendChild(b);
    var r=document.createElement('button'); r.id='dashRefreshBtn'; r.textContent='🔄 최신화'; r.title='최신화';
    r.onclick=function(){ try{ if(window.caches&&caches.keys){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});} }catch(e){} setTimeout(function(){ location.replace(location.pathname+'?_r='+Date.now()); },200); };
    r.style.cssText='position:fixed;right:12px;bottom:12px;z-index:99999;border:none;background:rgba(79,70,229,.92);color:#fff;border-radius:20px;padding:8px 13px;font-size:13px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.28);cursor:pointer;font-family:sans-serif';
    document.body.appendChild(r);
  }
  if(document.body) add(); else document.addEventListener('DOMContentLoaded',add);
}catch(e){} })();
(function(){
  var dp=null, btn=document.getElementById('pwaInstall');
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  /* ★2026-07-16 — 기본 display:none 으로 두고 '진짜 폰에서, 아직 설치 안 했을 때'만 켠다.
     PC에서는 홈화면 추가가 의미 없는데도 항상 떠서 최신화 버튼을 가리고 있었다. */
  var isPhone = /android|iphone|ipad|ipod/i.test(navigator.userAgent);
  if(btn && isPhone && !standalone) btn.style.display='';
  if(standalone && btn){ btn.style.display='none'; }  // 이미 앱으로 열림
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); dp=e; });
  window.addEventListener('appinstalled',function(){ if(btn) btn.style.display='none'; });
  if(btn) btn.onclick=function(){
    if(dp){ dp.prompt(); dp.userChoice.then(function(){ dp=null; }); return; }
    var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
    alert(ios ? '설치 방법 (아이폰)\n① 하단 공유 버튼 ⬆️ 탭\n② "홈 화면에 추가" 선택'
              : '설치 방법 (안드로이드)\n① 우측 상단 ⋮ 메뉴 탭\n② "앱 설치"(또는 홈 화면에 추가) 선택\n\n※ ⋮ 메뉴가 안 보이면 화면을 위로 살짝 쓸어올리면 나타나요.');
  };
})();
</script>
