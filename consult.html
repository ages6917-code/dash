<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a36">
<title>컨설팅 CRM 대시보드</title>
<link rel="apple-touch-icon" href="_assets/icon180.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--sub:#64748b;--line:#eef1f6;--brand:#3b82f6;--dark:#101a36}
body{background:var(--bg);color:var(--ink);min-height:100vh}
.app{display:flex;min-height:100vh}
/* 사이드바 */
.side{width:228px;background:var(--dark);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:20}
.brand{padding:22px 22px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand .logo{width:38px;height:38px;background:linear-gradient(135deg,#63b3ed,#7c5cff);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.brand b{color:#fff;font-size:16px;display:block}.brand span{color:#6b7aa3;font-size:11px}
.nav{padding-top:12px;flex:1;overflow:auto}
.nav a{display:block;padding:12px 22px;color:#8a98bd;font-size:14px;font-weight:600;border-left:3px solid transparent;cursor:pointer;text-decoration:none}
.nav a.on{background:rgba(99,179,237,.15);border-left-color:#63b3ed;color:#dbeafe}
.me{padding:16px 22px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.me .av{width:34px;height:34px;border-radius:50%;background:#2a3a63;color:#cdd9f5;display:flex;align-items:center;justify-content:center;font-weight:700}
.me b{color:#dbeafe;font-size:13px;display:block}.me span{color:#6b7aa3;font-size:11px}
/* 본문 */
.main{margin-left:228px;flex:1;padding:26px 32px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.top h1{font-size:23px;font-weight:800}.top .date{font-size:13px;color:var(--sub);margin-top:3px}
.tbtns{display:flex;gap:10px;align-items:center}
.btn{padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;border:none}
.btn.g{background:#fff;border:1px solid #e2e8f0;color:#475569}
.btn.b{background:var(--brand);color:#fff}
.sechead{font-size:13px;font-weight:800;color:#475569;margin:0 0 10px}
/* 수익 카드 */
.rev{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.rev .c{flex:1;min-width:230px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.rev .c .h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rev .c .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px}
.rev .c .lb{font-size:14px;color:var(--sub);font-weight:700}
.rev .c .v{font-size:29px;font-weight:800}.rev .c .v small{font-size:15px;color:#94a3b8;font-weight:800}
.rev .c .s{font-size:12.5px;font-weight:700;margin-top:4px}
/* 중단: 세무 + 액션 */
.midrow{display:flex;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.tax{flex:1.3;min-width:300px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.tax .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.tax .h b{font-size:15px;font-weight:800}.tax .h .sum{font-size:13px;color:#8b5cf6;font-weight:800}
.tax .grid{display:flex;gap:14px}
.tax .box{flex:1;border-radius:13px;padding:16px}
.tax .box .t{font-size:12.5px;color:var(--sub)}
.tax .box .n{font-size:26px;font-weight:800;margin:4px 0}.tax .box .n small{font-size:14px;color:var(--sub);font-weight:800}
.tax .box .m{font-size:12px;font-weight:700}
.acts{flex:1.7;min-width:300px;display:flex;gap:14px}
.act{flex:1;border-radius:16px;padding:18px;color:#fff;cursor:pointer}
.act .ic{font-size:22px}.act .n{font-size:32px;font-weight:800;margin:6px 0 0}.act .l{font-size:13px;opacity:.92;font-weight:600}
/* 고객 리스트 카드 */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.panel .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.panel .ph b{font-size:15px;font-weight:800}.panel .ph .more{color:var(--brand);font-size:13px;font-weight:700;cursor:pointer}
.panel .ph .sub{font-size:12px;color:#94a3b8;font-weight:500;margin-left:6px}
.row{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid #f1f5f9;gap:12px}
.row:last-child{border-bottom:none}
.row .av{width:34px;height:34px;border-radius:10px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-weight:700;color:#475569;flex-shrink:0}
.row .info{flex:1;min-width:0}
.row .info b{font-weight:700;font-size:14px}.row .info b span{color:#cbd5e1;font-weight:400}
.row .info .memo{font-size:12px;color:#94a3b8}
.row .amt{font-size:13px;font-weight:700;white-space:nowrap}
.chip{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.row .call{background:var(--brand);color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
/* 쉐어처 */
.shx{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.shc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;border-top:3px solid var(--brand)}
.shc .hh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.shc .hh .av{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.shc .hh b{font-size:15px}.shc .hh span{font-size:12px;color:var(--sub)}
.shc .stat{display:flex;gap:16px;margin-bottom:14px}
.shc .stat div b{font-size:20px;font-weight:800;display:block}.shc .stat div span{font-size:11.5px;color:var(--sub)}
.shc .link{display:flex;gap:8px}
.shc .link input{flex:1;border:1px solid #e2e8f0;border-radius:9px;padding:8px 10px;font-size:11.5px;color:#475569;background:#f8fafc}
.shc .link .cp{background:#0f172a;color:#fff;border:none;border-radius:9px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer}
/* 공유 뷰 배너 */
.sharebar{background:linear-gradient(135deg,#101a36,#1e293b);color:#fff;padding:16px 22px;border-radius:16px;margin-bottom:18px;display:flex;align-items:center;gap:14px}
.sharebar .badge{background:rgba(255,255,255,.14);padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700}
.hide{display:none!important}
/* 반응형 (폰) */
.menubtn{display:none}
@media(max-width:860px){
 .side{transform:translateX(-100%);transition:.25s}
 .side.open{transform:translateX(0)}
 .main{margin-left:0;padding:18px 14px}
 .menubtn{display:flex}
 .acts{flex-wrap:wrap}.act{min-width:46%}
 .rev .c{min-width:46%}
 .top h1{font-size:20px}
}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15}
.scrim.open{display:block}
</style>
</head>
<body>
<div id="pwgate" style="position:fixed;inset:0;background:#0f1629;display:flex;align-items:center;justify-content:center;z-index:99999;flex-direction:column;font-family:'Malgun Gothic',sans-serif">
  <div style="color:#fff;font-size:20px;margin-bottom:6px">🔒 컨설팅 대시보드</div>
  <div style="color:#9fb3d1;font-size:13px;margin-bottom:18px">팀 전용 · 비밀번호를 입력하세요</div>
  <input id="pwin" type="password" autocomplete="off" style="padding:13px 14px;font-size:16px;border-radius:10px;border:1px solid #2a3b5e;width:240px;background:#1a2540;color:#fff;outline:none" placeholder="비밀번호">
  <div id="pwerr" style="color:#f87171;margin-top:12px;height:18px;font-size:13px"></div>
</div>
<script>(function(){var PW="5생활관!";var g=document.getElementById('pwgate');if(sessionStorage.getItem('cdash_ok')==='1'){g.style.display='none';return;}document.body.style.overflow='hidden';function ok(){sessionStorage.setItem('cdash_ok','1');g.style.display='none';document.body.style.overflow='';}function check(){var v=document.getElementById('pwin').value;if(v===PW){ok();}else{document.getElementById('pwerr').textContent='비밀번호가 틀렸습니다';}}var i=document.getElementById('pwin');i.addEventListener('keydown',function(e){if(e.key==='Enter')check();});setTimeout(function(){i.focus();},100);})();</script>

<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="logo">💼</div><div><b>컨설팅 CRM</b><span>정책자금·보험·세무</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="me"><div class="av">황</div><div><b>황현 대표</b><span>관리자</span></div></div>
  </aside>
  <div class="scrim" id="scrim" onclick="toggleMenu()"></div>
  <main class="main" id="main"></main>
</div>

<script>
/* ===== 데이터 (실운영 시 직원15 DB / 입력값으로 자동 갱신) ===== */
const STAGE={연락전:'#94a3b8',통화완료:'#3b82f6',서류검토:'#f59e0b',본부장접수:'#8b5cf6',승인완료:'#10b981',재연락:'#ec4899'};
const SHARERS=[
 {id:'A', name:'김영수 팀장님', org:'정책자금 담당', color:'#3b82f6'},
 {id:'shinbo', name:'이상훈 팀장님', org:'보증·기술보증 담당', color:'#10b981'},
 {id:'capital', name:'박지원 팀장님', org:'대출 실행 담당', color:'#f59e0b'},
 {id:'tax', name:'정민재 팀장님', org:'세무 이관 담당', color:'#8b5cf6'},
];
const CUST=[
 {nm:'김상훈',biz:'제조업·성남',stage:'서류검토',amt:'정책자금 2억',memo:'오늘 14:00 통화',type:'개인',sharer:'A',contacted:true},
 {nm:'이지영',biz:'요식업·서울',stage:'본부장접수',amt:'운전자금 8천',memo:'본부장 검토중',type:'개인',sharer:'A',contacted:true},
 {nm:'최민서',biz:'IT서비스·판교',stage:'통화완료',amt:'기술보증 3억',memo:'내일 미팅',type:'법인',sharer:'shinbo',contacted:true},
 {nm:'윤서연',biz:'의료·강남',stage:'통화완료',amt:'시설자금 4억',memo:'오후 콜백',type:'개인',sharer:'A',contacted:true},
 {nm:'한지원',biz:'건설·인천',stage:'서류검토',amt:'시설자금 1.5억',memo:'등기부등본 요청',type:'법인',sharer:'shinbo',contacted:true},
 {nm:'정해성',biz:'건설·수원',stage:'승인완료',amt:'정책자금 5억',memo:'✅ 실행 완료',type:'법인',sharer:'capital',contacted:true},
 {nm:'박준호',biz:'도소매·인천',stage:'연락전',amt:'시설자금 1.5억',memo:'오늘 배정 · 첫 통화 전',type:'법인',sharer:'',contacted:false},
 {nm:'강민서',biz:'교육·대전',stage:'연락전',amt:'창업자금 7천',memo:'오늘 배정 · 첫 통화 전',type:'개인',sharer:'',contacted:false},
 {nm:'오세훈',biz:'프랜차이즈·서울',stage:'연락전',amt:'창업자금 7천',memo:'09:30 신규 유입',type:'개인',sharer:'',contacted:false},
 {nm:'서지안',biz:'식품·안산',stage:'연락전',amt:'운전자금 6천',memo:'09:10 신규 유입',type:'법인',sharer:'',contacted:false},
];
const REVENUE={
 consulting:{v:'1.44억', s:'예정 31건 · 실계약 18건'},
 insurance:{v:'1,240만', s:'예정 9건 · 실계약 5건'},
 tax:{personal:8, corp:5, perFee:60, corpFee:90},
};
/* 공유 링크 베이스 — 배포 후 실제 URL로 교체됨 */
const SHARE_BASE = location.origin + location.pathname;

const $=s=>document.querySelector(s);
const chip=s=>`<span class="chip" style="background:${(STAGE[s]||'#94a3b8')}1a;color:${STAGE[s]||'#94a3b8'}">${s}</span>`;
const params=new URLSearchParams(location.search);
const shareId=params.get('share');

/* ===== 네비 ===== */
const NAVS=[['dash','📊 대시보드'],['db','👥 고객 DB'],['call','📞 오늘 콜'],['docs','📁 서류함'],['meet','📅 미팅'],['share','🤝 쉐어'],['rev','💰 수익·정산'],['report','📈 리포트']];
function buildNav(active){
 $('#nav').innerHTML=NAVS.map(([k,l])=>`<a class="${k===active?'on':''}" onclick="go('${k}')">${l}</a>`).join('');
}
function go(k){ if(k==='share'){renderSharers();}else{renderDash(k);} if(window.innerWidth<=860)toggleMenu(true);}
function toggleMenu(force){const s=$('#side'),c=$('#scrim');const open=force===true?false:!s.classList.contains('open');s.classList.toggle('open',open);c.classList.toggle('open',open);}

/* ===== 메인 대시보드 ===== */
function renderDash(active='dash'){
 buildNav('dash');
 const t=REVENUE.tax, taxPer=t.personal*t.perFee, taxCorp=t.corp*t.corpFee, taxSum=taxPer+taxCorp;
 const today=CUST.filter(c=>c.contacted);
 const waiting=CUST.filter(c=>!c.contacted);
 const acts=[['📞','오늘 통화',8,'#f97316'],['🔄','재연락 대상',5,'#ec4899'],['📅','오늘 미팅',3,'#06b6d4'],['📁','서류 검토',6,'#8b5cf6']];
 const listRow=c=>`<div class="row"><div class="av">${c.nm[0]}</div>
   <div class="info"><b>${c.nm} <span>· ${c.biz}</span></b><div class="memo">${c.memo}</div></div>
   <div class="amt">${c.amt}</div>${chip(c.stage)}</div>`;
 const waitRow=c=>`<div class="row"><div class="av">${c.nm[0]}</div>
   <div class="info"><b>${c.nm} <span>· ${c.biz}</span></b><div class="memo">${c.memo}</div></div>
   <div class="amt">${c.amt}</div><div class="call">📞 연락</div></div>`;
 $('#main').innerHTML=`
 <div class="top">
   <div style="display:flex;align-items:center;gap:10px">
     <button class="btn g menubtn" onclick="toggleMenu()">☰</button>
     <div><h1>대시보드</h1><div class="date">2026년 6월 29일 · 안녕하세요, 황현 대표님 👋</div></div>
   </div>
   <div class="tbtns"><button class="btn g">🔍 검색</button><button class="btn b">+ 신규 고객</button></div>
 </div>

 <div class="sechead">💰 이번달 수익 현황</div>
 <div class="rev">
   <div class="c"><div class="h"><div class="ic" style="background:#ecfdf5">🛡️</div><div class="lb">보험 계약</div></div>
     <div class="v">${REVENUE.insurance.v}<small>원</small></div><div class="s" style="color:#10b981">${REVENUE.insurance.s}</div></div>
   <div class="c"><div class="h"><div class="ic" style="background:#eff6ff">🏦</div><div class="lb">컨설팅 수수료</div></div>
     <div class="v">${REVENUE.consulting.v}<small>원</small></div><div class="s" style="color:#3b82f6">${REVENUE.consulting.s}</div></div>
   <div class="c"><div class="h"><div class="ic" style="background:#f5f3ff">🧾</div><div class="lb">세무 이관</div></div>
     <div class="v">${(taxSum).toLocaleString()}만<small>원</small></div><div class="s" style="color:#8b5cf6">${t.personal+t.corp}건 · 개인${t.personal}·법인${t.corp}</div></div>
 </div>

 <div class="midrow">
   <div class="tax">
     <div class="h"><b>🧾 세무사 이관 (이번달)</b><div class="sum">총 ${taxSum.toLocaleString()}만원 · ${t.personal+t.corp}건</div></div>
     <div class="grid">
       <div class="box" style="background:#f5f3ff"><div class="t">개인사업자</div><div class="n">${t.personal}<small> 건</small></div><div class="m" style="color:#8b5cf6">× ${t.perFee}만 = ${taxPer.toLocaleString()}만원</div></div>
       <div class="box" style="background:#ecfdf5"><div class="t">법인사업자</div><div class="n">${t.corp}<small> 건</small></div><div class="m" style="color:#10b981">× ${t.corpFee}만 = ${taxCorp.toLocaleString()}만원</div></div>
     </div>
   </div>
   <div class="acts">${acts.map(([ic,l,n,c])=>`<div class="act" style="background:linear-gradient(135deg,${c},${c}cc);box-shadow:0 6px 16px ${c}40"><div class="ic">${ic}</div><div class="n">${n}</div><div class="l">${l}</div></div>`).join('')}</div>
 </div>

 <div class="panel">
   <div class="ph"><b>📞 오늘 처리할 고객</b><span class="more">전체 →</span></div>
   ${today.map(listRow).join('')}
 </div>

 <div class="panel">
   <div class="ph"><div><b>🆕 신규 연락 대기</b><span class="sub">오늘 받은 DB · 첫 통화 전 ${waiting.length}명</span></div><span class="more">전체 →</span></div>
   ${waiting.map(waitRow).join('')}
 </div>`;
}

/* ===== 쉐어처 ===== */
function renderSharers(){
 buildNav('share');
 const cards=SHARERS.map(s=>{
   const deals=CUST.filter(c=>c.sharer===s.id);
   const amtSum=deals.length;
   const link=`${SHARE_BASE}?share=${s.id}`;
   return `<div class="shc" style="border-top-color:${s.color}">
     <div class="hh"><div class="av" style="background:${s.color}">${s.name[0]}</div><div><b>${s.name}</b><br><span>${s.org}</span></div></div>
     <div class="stat"><div><b style="color:${s.color}">${deals.length}</b><span>관련 진행 건</span></div>
       <div><b>${deals.filter(d=>d.stage==='승인완료').length}</b><span>실행 완료</span></div></div>
     <div class="link"><input value="${link}" readonly onclick="this.select()"><button class="cp" onclick="copyLink('${link}',this)">링크 복사</button></div>
     <div style="font-size:11.5px;color:#94a3b8;margin-top:8px">🔒 이 링크는 <b>${s.name}</b> 관련 건만 보여요 (읽기 전용)</div>
   </div>`;
 }).join('');
 $('#main').innerHTML=`
 <div class="top">
   <div style="display:flex;align-items:center;gap:10px"><button class="btn g menubtn" onclick="toggleMenu()">☰</button>
   <div><h1>쉐어 공유 관리</h1><div class="date">쉐어마다 본인 관련 건만 보이는 전용 링크 · 읽기 전용</div></div></div>
   <button class="btn b">+ 쉐어 추가</button>
 </div>
 <div class="shx">${cards}</div>`;
}
function copyLink(url,btn){navigator.clipboard.writeText(url).then(()=>{const o=btn.textContent;btn.textContent='✅ 복사됨';setTimeout(()=>btn.textContent=o,1500);});}

/* ===== 쉐어처 공유 뷰 (?share=ID) ===== */
function renderShareView(){
 const s=SHARERS.find(x=>x.id===shareId);
 document.querySelector('.side').classList.add('hide');
 const m=$('#main'); m.style.marginLeft='0'; m.style.maxWidth='820px'; m.style.margin='0 auto';
 if(!s){m.innerHTML='<div class="panel">유효하지 않은 공유 링크입니다.</div>';return;}
 const deals=CUST.filter(c=>c.sharer===s.id);
 const row=c=>`<div class="row"><div class="av">${c.nm[0]}</div>
   <div class="info"><b>${c.nm} <span>· ${c.biz}</span></b><div class="memo">${c.memo}</div></div>
   <div class="amt">${c.amt}</div>${chip(c.stage)}</div>`;
 m.innerHTML=`
 <div class="sharebar"><div class="badge">공유 뷰</div>
   <div><b style="font-size:16px">${s.name}님께 공유된 진행 건</b><div style="font-size:12px;color:#a5b4fc">황현 컨설팅 · ${s.org} · 읽기 전용</div></div></div>
 <div class="panel"><div class="ph"><b>🤝 ${s.name} 관련 진행 건</b><span class="sub">총 ${deals.length}건</span></div>
   ${deals.length?deals.map(row).join(''):'<div class="row">표시할 진행 건이 없습니다.</div>'}
 </div>
 <div style="text-align:center;color:#94a3b8;font-size:12px;margin-top:14px">본 페이지는 ${s.name}님 관련 건만 표시됩니다. 다른 고객 정보·수익 정보는 보이지 않습니다.</div>`;
}

/* ===== 시작 ===== */
if(shareId){renderShareView();}else{renderDash();}
</script>
