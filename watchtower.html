<meta name="theme-color" content="#0b1220">
<title>🛰️ 감시탑</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1a2233;--sub:#66738c;--line:#e6ebf3;

 --gb:#0f2c22;--yb:#2e2410;--rb:#331717;--qb:#1a2340;--ub:#1b2334;}}
:root[data-theme=dark]{--bg:#0b1220;--card:#151d2e;--tx:#e8edf6;--sub:#93a0b8;--line:#243049;--gb:#0f2c22;--yb:#2e2410;--rb:#331717;--qb:#1a2340;--ub:#1b2334;}
:root[data-theme=light]{--bg:#f4f6fb;--card:#fff;--tx:#1a2233;--sub:#66738c;--line:#e6ebf3;--gb:#e3f7ee;--yb:#fdf1d9;--rb:#fde5e5;--qb:#e8edfb;--ub:#eef1f6;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;padding:16px;max-width:760px;margin:0 auto}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.hd h1{font-size:20px;margin:0}.sub{color:var(--sub);font-size:12px;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border-radius:20px;padding:6px 13px;font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center}
.c-g{background:var(--gb);color:var(--g)}.c-y{background:var(--yb);color:var(--y)}
.c-r{background:var(--rb);color:var(--r)}.c-q{background:var(--qb);color:var(--q)}.c-u{background:var(--ub);color:var(--u)}
h2{font-size:14px;color:var(--sub);margin:22px 0 10px;font-weight:700;letter-spacing:.02em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;gap:11px;align-items:flex-start}
.dot{width:11px;height:11px;border-radius:50%;margin-top:4px;flex:0 0 auto}
.d-g{background:var(--g)}.d-y{background:var(--y)}.d-r{background:var(--r)}.d-q{background:var(--q)}.d-u{background:var(--u)}
.nm{font-weight:700;font-size:14px;line-height:1.3}
.mt{color:var(--sub);font-size:11.5px;margin-top:3px}
.st{font-size:11px;font-weight:800;margin-top:4px}
.s-g{color:var(--g)}.s-y{color:var(--y)}.s-r{color:var(--r)}.s-q{color:var(--q)}.s-u{color:var(--u)}
.vrow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;font-size:13px}
.vpass{color:var(--g);font-weight:700}.vflag{color:var(--r);font-weight:700}
.ulist{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--sub);font-size:12.5px;line-height:1.9}
.tk{background:var(--rb);border:1px solid var(--r);border-radius:12px;padding:11px 13px;margin-bottom:8px;font-size:13px;color:var(--r);font-weight:700}
.gate{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:99}
.gate input{padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;text-align:center}
.gate button{padding:11px 26px;border-radius:10px;border:0;background:var(--q);color:#fff;font-size:15px;font-weight:700}
.foot{color:var(--sub);font-size:11px;margin-top:24px;text-align:center;line-height:1.7}
</style></head><body>
<div class="gate" id="gate"><div style="font-size:34px">🛰️</div><div style="font-weight:700">감시탑</div>
<input id="pw" type="password" placeholder="비밀번호" autocomplete="off">
<button onclick="chk()">열기</button></div>
<div id="app" style="display:none">

<div class="chips" id="chips"></div>
<div id="alerts"></div>
<h2>계측된 작업</h2><div class="grid" id="live"></div>
<h2>산출물 검수(표본)</h2><div id="verify"></div>

</div>

function show(){document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';render()}

var LB={GREEN:['정상','g'],YELLOW:['주의','y'],RED:['문제','r'],QUEUED_WAIT:['대기','q'],UNINSTRUMENTED:['미계측','u'],SKIP:['휴무','u']};
function render(){
 var s=DATA.summary||{};
 document.getElementById('sub').textContent='마지막 갱신 '+ (DATA.ts||'').replace('T',' ').slice(0,16);
 var ch=[['정상',s.G,'g'],['대기',s.QUEUED,'q'],['주의',s.Y,'y'],['문제',s.R,'r'],['미계측',s.UNINSTR,'u']];
 document.getElementById('chips').innerHTML=ch.map(function(x){return '<div class="chip c-'+x[2]+'">'+x[0]+' '+(x[1]||0)+'</div>'}).join('');

 var tk=DATA.tickets||[];
