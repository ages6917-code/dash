<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>대시보드 허브</title></head><body style="margin:0;font-family:'Malgun Gothic',sans-serif;background:#0f1629;min-height:100vh">
<div id="pwgate" style="position:fixed;inset:0;background:#0f1629;display:flex;align-items:center;justify-content:center;z-index:99999;flex-direction:column;font-family:'Malgun Gothic',sans-serif">
  <div style="color:#fff;font-size:20px;margin-bottom:6px">🔒 대시보드 허브</div>
  <div style="color:#9fb3d1;font-size:13px;margin-bottom:18px">팀 전용 · 비밀번호를 입력하세요</div>
  <input id="pwin" type="password" autocomplete="off" style="padding:13px 14px;font-size:16px;border-radius:10px;border:1px solid #2a3b5e;width:240px;background:#1a2540;color:#fff;outline:none" placeholder="비밀번호">
  <div id="pwerr" style="color:#f87171;margin-top:12px;height:18px;font-size:13px"></div>
</div>
<script>
(function(){
  var PW="5생활관!";
  var g=document.getElementById('pwgate');
  if(sessionStorage.getItem('cdash_ok')==='1'){g.style.display='none';return;}
  document.body.style.overflow='hidden';
  function ok(){sessionStorage.setItem('cdash_ok','1');g.style.display='none';document.body.style.overflow='';}
  function check(){var v=document.getElementById('pwin').value;if(v===PW){ok();}else{document.getElementById('pwerr').textContent='비밀번호가 틀렸습니다';}}
  var i=document.getElementById('pwin');
  i.addEventListener('keydown',function(e){if(e.key==='Enter')check();});
  setTimeout(function(){i.focus();},100);
})();
</script>

<div style="max-width:560px;margin:0 auto;padding:48px 20px;color:#fff">
  <div style="font-size:24px;font-weight:700;margin-bottom:6px">🗂️ 대시보드</div>
  <div style="color:#9fb3d1;font-size:14px;margin-bottom:28px">팀 전용 · 아래에서 선택하세요</div>
  <a href="consult.html" style="display:block;background:#1a2540;border:1px solid #2a3b5e;border-radius:14px;padding:20px;margin-bottom:14px;text-decoration:none;color:#fff"><div style="font-size:18px;font-weight:600">💼 컨설팅 대시보드</div><div style="color:#9fb3d1;font-size:13px;margin-top:4px">정책자금·보험·세무 CRM</div></a>
  <a href="status.html" style="display:block;background:#1a2540;border:1px solid #2a3b5e;border-radius:14px;padding:20px;margin-bottom:14px;text-decoration:none;color:#fff"><div style="font-size:18px;font-weight:600">📊 T봇 현황판</div><div style="color:#9fb3d1;font-size:13px;margin-top:4px">직원 가동·실측 현황</div></a>
  <a href="wholesale.html" style="display:block;background:#1a2540;border:1px solid #2a3b5e;border-radius:14px;padding:20px;text-decoration:none;color:#fff"><div style="font-size:18px;font-weight:600">📦 위탁 거래처 대시보드</div><div style="color:#9fb3d1;font-size:13px;margin-top:4px">거래처 수집 현황</div></a>
</div></body></html>
