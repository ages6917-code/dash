<script>
(function(){
  var PW="5생활관!";
  var g=document.getElementById('pwgate');
  if(sessionStorage.getItem('cdash_ok')==='1'){g.style.display='none';return;}
  document.body.style.overflow='hidden';
  function ok(){sessionStorage.setItem('cdash_ok','1');g.style.display='none';document.body.style.overflow='';}
  function check(){var v=document.getElementById('pwin').value;if(v===PW){ok();}else{document.getElementById('pwerr').textContent='비밀번호가 틀렸습니다';}}
  var i=document.getElementById('pwin');
  i.addEventListener('keydown',function(e){if(e.key==='Enter')check();});
  setTimeout(function(){i.focus();},100);
})();
</script>

<script>
function dashForceRefresh(){
  try{
    if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}); }
    if(window.caches && caches.keys){ caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});}); }
  }catch(e){}
  setTimeout(function(){ location.replace(location.pathname+'?_r='+Date.now()); }, 250);
}
(function(){
  try{
    fetch(location.pathname,{method:'HEAD',cache:'no-store'}).then(function(r){
      var tag=r.headers.get('ETag')||r.headers.get('Last-Modified'); if(!tag) return;
      var key='dashver:'+location.pathname, prev=localStorage.getItem(key);
      localStorage.setItem(key,tag);
      if(prev && prev!==tag && location.search.indexOf('_r=')===-1){
        location.replace(location.pathname+'?_r='+Date.now());
      }
    }).catch(function(){});
  }catch(e){}
})();
</script>
