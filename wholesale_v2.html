</script>
<script>
  var D = window.DASH;
  if(!D||!D.suppliers){ document.body.innerHTML='<div style="padding:50px;max-width:560px;margin:0 auto"><h2>⚠ data.js 로드 실패</h2><p style="margin-top:10px;line-height:1.7">data.js 문법 오류 가능성. backups/ 최근 사본으로 복구하거나 T봇에게 문법 검사를 지시하세요.</p></div>'; throw new Error('DASH load fail'); }

  /* ── 상수 ── */
  var FEE = (D.feeRate!=null? D.feeRate : 0.07);      /* 수수료: 공식 미공개, 실셀러 증언 ~7%. 첫 정산 실측 후 data.js에 feeRate 확정 */
  var FEEPCT = Math.round(FEE*100);
  var SHIP_CREDIT = 3000;                              /* 19,800 미만: 고객 배송비 수취(정산 유입 — 사장 확정 2026-07-22) */
  var FREE_LIMIT = 19800;
  var STALE_DAYS = 7;

  /* ── pid 인덱스 ── */
  var PMAP={};
  D.suppliers.forEach(function(s,si){ (s.products||[]).forEach(function(p,pi){
    p._pid=p.pid||((s.id||('v'+si))+'-'+pi); p._si=si; PMAP[p._pid]={s:s,p:p};
  });});

  function won(n){return n==null?"–":Math.round(n).toLocaleString()+"원";}
  function esc(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

  /* ── 배송비: 거래처 정책 단일 원천 (제품별 예외는 shipOverride만 허용) ── */
  function vendorShip(p){
    if(p.shipOverride!=null) return p.shipOverride;
    var s=D.suppliers[p._si], pol=s&&s.shipPolicy;
    if(!pol||pol.fee==null) return null;               /* 미확인 → 마진 계산 보류 */
    if(pol.freeOver&&p.buy!=null&&p.buy>=pol.freeOver) return 0;
    return pol.fee;
  }
  function cost(p){ var sh=vendorShip(p); if(p.buy==null||sh==null) return null; return p.buy+sh; }

  /* ── 마진 엔진 (사장 확정 공식) ── */
  function profit(price,p){ var c=cost(p); if(c==null||price==null) return null;
    return price*(1-FEE) + (price<FREE_LIMIT?SHIP_CREDIT:0) - c; }
  function consumer(price){ return price + (price<FREE_LIMIT?SHIP_CREDIT:0); }
  function mgPct(price,p){ var pr=profit(price,p); if(pr==null||!price) return null; return Math.round(pr/price*100); }

  /* ── 단위가격(원/100g): 실부담가 기준 ── */
  function unit(price,g){ if(!price||!g) return null; return Math.round(consumer(price)/g*100); }
  function top3(p){ return (p.temu_top3&&p.temu_top3.length)? p.temu_top3.slice(0,3):null; }
  function bestComp(p){ var t=top3(p); if(!t) return null;
    var best=null; t.forEach(function(c){ var u=unit(c.price,c.qty_g);
      if(u!=null){ if(!best||u<best.u) best={u:u,c:c}; }
      else if(!best) best={u:null,c:c}; });
    return best; }
  function staleDays(p){ var t=top3(p); var d=(p.judge&&p.judge.researched_at)||(t&&t[0].researched_at);
    if(!d) return null; var ms=Date.now()-new Date(d+'T00:00:00').getTime();
    return Math.floor(ms/86400000); }

  /* ── 판정: 직원15 저장값(judge) 우선, 없으면 '조사 전' ── */
  var VD={GO:['b-go','vl-go','🟢 GO'],HOLD:['b-hold','vl-hold','🟡 보류'],NOGO:['b-no','vl-no','🔴 NO-GO']};
  function verdict(p){ return (p.judge&&VD[p.judge.verdict])? p.judge.verdict : null; }
  function vcounts(s){ var c={GO:0,HOLD:0,NOGO:0,NONE:0,going:0};
    (s.products||[]).forEach(function(p){ var v=verdict(p); if(v)c[v]++; else c.NONE++;
      if(p.status==='GO확정'||p.status==='등록중'||p.status==='판매중')c.going++; });
    return c; }

  /* ── 등록가 시나리오 ── */
  function scenarios(p){
    var out=[], c=cost(p); if(c==null) return out;
    if(p.judge&&p.judge.price_reco) out.push({lbl:'권장 등록가',price:p.judge.price_reco});
    out.push({lbl:'무료배송 경계',price:19900});
    var b=bestComp(p);
    if(b&&b.u!=null&&p.unit_g){ var m=Math.round(b.u*p.unit_g/100/100)*100-SHIP_CREDIT;
      if(m>0) out.push({lbl:'최저단가 매칭',price:m}); }
    var seen={}; return out.filter(function(x){ if(!x.price||seen[x.price])return false; seen[x.price]=1; return true; });
  }

  function copyTxt(txt){
    try{ var ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }catch(e){}
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){},function(){});
  }

  /* ── GO/보류/NO-GO 클릭 → 직원14(상태 반영 담당) 지시문 복사 ── */
  function decide(pid,action){
    var e=PMAP[pid]; if(!e)return;
    var today=new Date().toISOString().slice(0,10);
    var line=JSON.stringify({ts:today,actor:'사장',pid:pid,name:e.p.name,vendor:e.s.name,action:action});
    copyTxt('[상태반영 요청 → 직원14] 아래 1줄을 handoff/status_queue.jsonl 에 append 하고 tools/apply_status.py 실행 → 빌드·푸시:\n'+line);
    alert('✅ '+e.p.name+' → '+action+'\n지시문이 복사됐습니다.\nTTAPP 직원14(테무운영) 채팅에 붙여넣으면 1~2분 내 모든 화면에 반영됩니다.');
  }
  /* ── 조사 요청 → 직원15 지시문 복사 ── */
  function reqResearch(pid){
    var e=PMAP[pid]; if(!e)return; var s=e.s,p=e.p;
    copyTxt('[테무 조사 요청 → 직원15] '+new Date().toISOString().slice(0,10)+'\n'+
      '제품: '+p.name+(p.spec?' ('+p.spec+')':'')+' | 거래처: '+s.name+' | pid: '+p._pid+'\n'+
      '절차: 견적인입·조사 SOP v2 (위탁수집_14 크롬 프로필 · 판매량순 고정 · 상위20 파싱 · top3 구조화 · 스크린샷 증빙 · 검수게이트 통과 후 반영)');
    alert('✅ 조사 지시문 복사됨 — TTAPP 직원15 채팅에 붙여넣으세요.');
  }

  function setHeader(){
    document.getElementById('date').textContent=(D.builtAt? '🤖 '+D.builtAt+' 생성' : (D.updated||''));
    var tot={GO:0,HOLD:0,NOGO:0,NONE:0,going:0}, np=0;
    D.suppliers.forEach(function(s){ var c=vcounts(s); Object.keys(tot).forEach(function(k){tot[k]+=c[k];}); np+=(s.products||[]).length; });
    document.getElementById('chips').innerHTML=
      '<div class="chip">거래처<b>'+D.suppliers.length+'</b></div>'+
      '<div class="chip">품목<b>'+np+'</b></div>'+
      '<div class="chip">GO<b>'+tot.GO+'</b></div>'+
      '<div class="chip">보류<b>'+tot.HOLD+'</b></div>'+
      '<div class="chip">진행중<b>'+tot.going+'</b></div>'+
      '<div class="chip">조사 전<b>'+tot.NONE+'</b></div>';
  }

  var MODE='sup';
  function setMode(m){ MODE=m;
    document.getElementById('tab-sup').classList.toggle('on',m==='sup');
    document.getElementById('tab-item').classList.toggle('on',m==='item');
    render(); }
  function render(){ if(MODE==='item') renderItems(); else renderSup(); }

  /* ── 첫 화면: 거래처 카드 (마감시간 크게) ── */
  function renderSup(){
    var q=(document.getElementById('search').value||'').toLowerCase();
    var list=D.suppliers.filter(function(s){return (s.name+(s.cat||'')+(s.products||[]).map(function(p){return p.name;}).join()).toLowerCase().indexOf(q)>=0;});
    document.getElementById('view').innerHTML='<div class="grid">'+list.map(function(s){
      var c=vcounts(s), pol=s.shipPolicy;
      var cut=s.cutoff? '<span class="t">'+esc(s.cutoff)+'</span><span class="l">마감'+(s.courier?' · '+esc(s.courier):'')+'</span>'
                      : '<span class="t na">미확인</span><span class="l" style="color:var(--red)">거래처 확인 필요</span>';
      return '<div class="vcard" onclick="openSup('+D.suppliers.indexOf(s)+')">'+
        '<div class="vname">'+esc(s.name)+'</div><div class="vcat">'+esc(s.cat||'')+' · '+(s.products||[]).length+'품목</div>'+
        '<div class="cutoff">⏰ '+cut+'</div>'+
        (c.GO?'<span class="badge b-go">GO '+c.GO+'</span>':'')+
        (c.HOLD?'<span class="badge b-hold">보류 '+c.HOLD+'</span>':'')+
        (c.NOGO?'<span class="badge b-no">NO-GO '+c.NOGO+'</span>':'')+
        (c.NONE?'<span class="badge b-none">조사 전 '+c.NONE+'</span>':'')+
        (c.going?'<span class="badge b-godone">▶ 진행 '+c.going+'</span>':'')+
        '<div style="margin-top:8px"><span class="badge b-blue">'+(pol&&pol.fee!=null?'택배 '+pol.fee.toLocaleString():'택배비 미확인')+(pol&&pol.freeOver?' · '+pol.freeOver.toLocaleString()+'↑무료':'')+'</span></div>'+
        '</div>';
    }).join('')+'</div>';
    document.getElementById('foot').textContent='💡 카드를 누르면 제품별 원가·테무 top3·판정이 펼쳐집니다. ⏰는 거래처 택배 마감시간.';
  }

  /* ── 제품 행 (가로형) ── */
  function prowHtml(p){
    var s=D.suppliers[p._si], v=verdict(p), c=cost(p), sh=vendorShip(p);
    var t=top3(p), b=bestComp(p), sd=staleDays(p);
    var img=p.img?'<img src="images/'+esc(p.img)+'" onerror="this.style.display=\'none\'">':'';
    var going=(p.status==='GO확정'||p.status==='등록중'||p.status==='판매중');
    var h='<div class="prow-card'+(v==='GO'?' go':'')+'">';
    h+='<div class="prow-head"><div class="thumb">'+(img||(p.emoji||'📦'))+'</div>'+
       '<div><span class="pn">'+esc(p.name)+'</span> <span class="ps">'+esc(p.spec||'')+'</span><br>'+
       (v?'<span class="badge '+VD[v][0]+'">'+VD[v][2].slice(2)+'</span>':'<span class="badge b-none">조사 전</span>')+
       (going?'<span class="badge b-godone">▶ '+esc(p.status)+'</span>':'')+
       (sd!=null&&sd>STALE_DAYS?'<span class="badge b-stale">조사 '+sd+'일 경과</span>':'')+
       '</div><span class="meta">'+((p.judge&&p.judge.researched_at)||(t&&t[0].researched_at)||'')+'</span></div>';

    /* 숫자 3칸 */
    h+='<div class="cells">';
    h+='<div class="cell"><div class="k">원가</div><div class="v">'+won(c)+'</div><div class="d">매입 '+won(p.buy)+' + 택배 '+(sh==null?'<b style="color:var(--red)">미확인</b>':won(sh))+'</div></div>';
    if(t){
      var rows=t.map(function(x,i){ var u=unit(x.price,x.qty_g);
        return (i+1)+'위 '+won(x.price)+(x.qty_g?' /'+x.qty_g+'g':'')+(x.sales!=null?' · '+x.sales.toLocaleString()+'판매':'')+(u?' · <b>'+u.toLocaleString()+'원/100g</b>':''); }).join('<br>');
      h+='<div class="cell"><div class="k">테무 판매량 top3 (실부담 단가)</div><div class="d" style="margin-top:4px;font-size:11.5px">'+rows+'</div></div>';
      var myU=(p.unit_g&&c!=null)? Math.round(c/p.unit_g*100):null;
      if(myU!=null&&b&&b.u!=null){
        var cheaper=Math.round((1-myU/b.u)*100);
        var w1=Math.min(100,Math.round(myU/Math.max(myU,b.u)*100)), w2=Math.min(100,Math.round(b.u/Math.max(myU,b.u)*100));
        h+='<div class="cell"><div class="k">단위가 비교 (원/100g)</div>'+
           '<div class="v '+(cheaper>0?'gd':'bd')+'">'+(cheaper>0?'원가가 '+cheaper+'% 저렴':'원가가 '+(-cheaper)+'% 비쌈')+'</div>'+
           '<div class="unitbar"><i class="me" style="width:'+w1+'%"></i></div><div class="d">내 원가 '+myU.toLocaleString()+'/100g</div>'+
           '<div class="unitbar"><i style="width:'+w2+'%"></i></div><div class="d">테무 최저 '+b.u.toLocaleString()+'/100g</div></div>';
      }
    } else {
      h+='<div class="cell"><div class="k">테무 조사</div><div class="v" style="color:var(--sub);font-size:14px">아직 없음 (새 형식 재조사 대상)</div>'+
         '<div class="d"><button class="gob gray" style="padding:7px 12px;font-size:12px" onclick="reqResearch(\''+p._pid+'\')">🔍 조사 요청 지시문 복사</button></div></div>';
    }
    h+='</div>';

    /* 판정 사유 */
    if(v) h+='<div class="verdictline '+VD[v][1]+'">'+VD[v][2]+(p.judge.reason?' — '+esc(p.judge.reason):'')+
      ((p.judge&&p.judge.researcher)?'<span style="margin-left:auto;font-weight:500;font-size:11px">'+esc(p.judge.researcher)+'</span>':'')+'</div>';

    /* 등록가 시나리오 */
    var sc=scenarios(p);
    if(sc.length&&c!=null){
      h+='<table class="sctbl"><tr><th>시나리오</th><th class="r">등록가</th><th class="r">고객 실부담</th><th class="r">개당 이익</th><th class="r">마진</th></tr>';
      sc.forEach(function(x){ var pr=profit(x.price,p), m=mgPct(x.price,p);
        h+='<tr><td>'+x.lbl+(x.price<FREE_LIMIT?' <span style="color:var(--sub);font-size:11px">(배송 3천 수취)</span>':' <span style="color:var(--sub);font-size:11px">(무료배송·내부담)</span>')+'</td>'+
           '<td class="r">'+won(x.price)+'</td><td class="r">'+won(consumer(x.price))+'</td>'+
           '<td class="r" style="font-weight:800;color:'+(pr>0?'var(--green)':'var(--red)')+'">'+(pr>0?'+':'')+won(pr)+'</td>'+
           '<td class="r">'+(m!=null?m+'%':'–')+'</td></tr>'; });
      h+='</table>';
    }

    /* 결정 버튼 */
    h+='<div style="margin-top:11px">';
    if(!going) h+='<button class="gob go" onclick="decide(\''+p._pid+'\',\'GO확정\')">▶ GO — 등록 진행</button>';
    h+='<button class="gob gray" onclick="decide(\''+p._pid+'\',\'보류\')">보류</button>'+
       '<button class="gob gray" onclick="decide(\''+p._pid+'\',\'NO-GO\')">NO-GO</button></div>';
    h+='</div>';
    return h;
  }

  function openSup(i){
    var s=D.suppliers[i], c=vcounts(s), pol=s.shipPolicy;
    var h='<div class="mhead"><div><h2>'+esc(s.name)+'</h2><span class="vcat">'+esc(s.cat||'')+'</span></div>'+
      '<div class="cutoff" style="margin:0 0 0 auto">⏰ '+(s.cutoff?'<span class="t">'+esc(s.cutoff)+'</span><span class="l">마감</span>':'<span class="t na">마감 미확인</span>')+'</div>'+
      '<button class="close" onclick="closeModal()">✕</button></div>';
    h+='<div class="contact">'+
      (s.phone?'<div class="ci"><span>📞</span>'+esc(s.phone)+'</div>':'')+
      (s.email?'<div class="ci"><span>✉️</span>'+esc(s.email)+'</div>':'')+
      (s.region?'<div class="ci"><span>📍</span>'+esc(s.region)+'</div>':'')+
      '<div class="ci"><span>🚚</span>'+(pol&&pol.fee!=null?('택배 '+pol.fee.toLocaleString()+'원'+(pol.freeOver?' · '+pol.freeOver.toLocaleString()+'↑무료':'')+(pol.note?' · '+esc(pol.note):'')):'<b style="color:var(--red)">배송정책 미확인 — 거래처 확인 필요</b>')+'</div>'+
      '<div class="ci"><span>📊</span>GO '+c.GO+' · 보류 '+c.HOLD+' · NO-GO '+c.NOGO+' · 조사 전 '+c.NONE+'</div></div>';
    if(s.card) h+='<img class="bizcard" src="images/'+esc(s.card)+'" alt="명함" onclick="window.open(this.src)" onerror="this.style.display=\'none\'">';
    if(s.note) h+='<div class="mnote">📝 '+esc(s.note)+'</div>';
    var prods=s.products||[];
    var cats=[]; prods.forEach(function(p){ var g=p.g||'전체'; if(cats.indexOf(g)<0)cats.push(g); });
    if(cats.length>1){
      h+='<div class="catbar" id="catbar">'+cats.map(function(g,idx){
        var n=prods.filter(function(p){return (p.g||'전체')===g;}).length;
        return '<button class="catchip'+(idx===0?' on':'')+'" data-g="'+esc(g)+'" onclick="showCat('+i+',this.dataset.g)">'+esc(g)+' '+n+'</button>';}).join('')+'</div>';
      h+='<div id="pgrid">'+prods.filter(function(p){return (p.g||'전체')===cats[0];}).map(prowHtml).join('')+'</div>';
    } else h+='<div id="pgrid">'+prods.map(prowHtml).join('')+'</div>';
    document.getElementById('modal').innerHTML=h;
    document.getElementById('overlay').classList.add('on');
  }
  function showCat(i,g){
    var s=D.suppliers[i];
    document.getElementById('pgrid').innerHTML=(s.products||[]).filter(function(p){return (p.g||'전체')===g;}).map(prowHtml).join('');
    var bar=document.getElementById('catbar');
    for(var k=0;k<bar.children.length;k++) bar.children[k].classList.toggle('on',bar.children[k].dataset.g===g);
  }

  /* ── 전 품목 심사표 (테무 기준만) ── */
  function renderItems(){
    var q=(document.getElementById('search').value||'').toLowerCase();
    var rows=[];
    D.suppliers.forEach(function(s){(s.products||[]).forEach(function(p){
      if(((s.name||'')+(p.name||'')+(p.spec||'')+(p.g||'')).toLowerCase().indexOf(q)>=0) rows.push(p);});});
    var ord={GO:0,HOLD:1,NOGO:3};
    rows.sort(function(a,b){ var va=verdict(a),vb=verdict(b);
      return (va?ord[va]:2)-(vb?ord[vb]:2); });
    var h='<table class="plantbl"><tr><th>제품</th><th>거래처</th><th class="r">원가</th><th>테무 최저단가</th><th class="r">권장가 이익</th><th>판정</th><th>조사일</th></tr>';
    rows.slice(0,300).forEach(function(p){
      var s=D.suppliers[p._si], v=verdict(p), b=bestComp(p), c=cost(p), sd=staleDays(p);
      var reco=p.judge&&p.judge.price_reco, pr=reco?profit(reco,p):null;
      h+='<tr style="cursor:pointer" onclick="openSup('+p._si+')">'+
        '<td><b>'+esc(p.name)+'</b> <span style="color:var(--sub);font-size:11.5px">'+esc(p.spec||'')+'</span></td>'+
        '<td>'+esc(s.name)+'</td><td class="r">'+won(c)+'</td>'+
        '<td>'+(b&&b.u!=null?b.u.toLocaleString()+'원/100g':(top3(p)?won(b&&b.c.price):'<span style="color:var(--sub)">조사 전</span>'))+'</td>'+
        '<td class="r" style="font-weight:800;color:'+(pr>0?'var(--green)':(pr==null?'var(--sub)':'var(--red)'))+'">'+(pr!=null?(pr>0?'+':'')+won(pr):'–')+'</td>'+
        '<td>'+(v?'<span class="badge '+VD[v][0]+'">'+VD[v][2].slice(2)+'</span>':'<span class="badge b-none">조사 전</span>')+'</td>'+
        '<td>'+((p.judge&&p.judge.researched_at)||'–')+(sd!=null&&sd>STALE_DAYS?' <span class="badge b-stale">'+sd+'일</span>':'')+'</td></tr>';});
    h+='</table>';
    document.getElementById('view').innerHTML='<div class="dcard">'+h+'</div>';
    document.getElementById('foot').textContent='💡 GO → 보류 → 조사 전 → NO-GO 순 정렬. 행을 누르면 거래처 상세.'+(rows.length>300?' (상위 300개 표시)':'');
  }

  function closeModal(){document.getElementById('overlay').classList.remove('on');}
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
  setHeader(); render();
</script>
</body>
</html>
