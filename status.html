body{background:#eef0f7;color:var(--ink)}

/* ★2026-07-27 ■4 — 폰(세로)에서 글자가 옆으로 밀리던 것 수정.
   한 줄에 욱여넣지 말고 전폭으로 떨어뜨린다. 긴 한글 사유도 화면 밖으로 못 나가게 강제 줄바꿈. */
@media(max-width:780px){
 .autop{padding:13px 14px}
 .autop .row{flex-wrap:wrap;gap:4px 8px}
 .autop .row .cy{min-width:0;font-size:11px;order:1}
 .autop .row .st{order:2}
 .autop .row .tk{flex:1 1 100%;order:3;word-break:keep-all;overflow-wrap:break-word}
 .autop .wrow{flex-wrap:wrap;gap:3px 7px}
 .autop .wrow .wno{order:1;flex:none}
 .autop .wrow .wt{order:2;flex:1 1 auto;min-width:0;overflow-wrap:break-word}
 .autop .wrow .wd{order:3;flex:1 1 100%;font-size:10.5px;line-height:1.5;overflow-wrap:break-word;word-break:keep-all}
 .autop details summary{flex-wrap:wrap;gap:4px 6px}
 .autop details summary .sname{min-width:0;overflow-wrap:break-word}
 .autop details summary .smeta{flex:1 1 100%;order:9;font-size:10.5px}

/* ── 접이식(무자바스크립트 details/summary) ── */
.autop details.eg>summary{list-style:none;cursor:pointer;padding:7px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.autop details.eg>summary::-webkit-details-marker{display:none}
.autop details.eg>summary .chev{color:#b7b2d0;font-size:10px;flex:none;transition:transform .15s}
.autop details.eg[open]>summary .chev{transform:rotate(90deg)}
.autop .sname{font-size:12.5px;font-weight:800;color:#3f3a5c}

/* ── 오늘의 검증 현황 (2026-07-26) — 접이식. 요약만 보이고 탭하면 상세 ── */
.vfy{background:#fff;border-radius:14px;padding:15px 17px;margin-bottom:14px;border-left:5px solid #0d9488}
.vfy h3{font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.vfy h3 .cc{font-size:11px;font-weight:800;color:#fff;background:#0d9488;border-radius:20px;padding:1px 9px}
.vfy h3 .stamp{font-size:10.5px;color:#9a96b5;font-weight:600;margin-left:auto}
.vfy .sumline{margin:9px 0 4px;background:#f0fdfa;border:1.5px solid #99f6e4;border-radius:11px;
  padding:10px 12px;font-size:13px;font-weight:800;color:#0f766e;line-height:1.5;word-break:keep-all}

.vfy details.vs>summary::-webkit-details-marker{display:none}
.vfy details.vs>summary .chev{color:#94a3b8;font-size:10px;flex:none;transition:transform .15s}

.vfy .vbody{padding:3px 0 6px 14px;border-left:2px solid #eef2f2;margin-left:5px}
/* ★2026-07-27 수리 — 파일명이 한 글자씩 세로로 떨어지던 진짜 원인.
   이 줄에는 시각·판정·이름·사유 4칸이 들어가는데, 사유(.rs)는 '다음 줄 전체'를 쓰라고
   flex-basis:100% 로 만들어 놓고 정작 **줄바꿈 허용(flex-wrap)을 안 걸어놨다.**
   그래서 사유가 한 줄을 통째로 차지하고 이름칸(.lb)이 **폭 0px 으로 짜부라져**
   글자가 세로로 한 자씩 흘러내렸다(실측: .lb clientWidth=0). 글꼴·줄바꿈 규칙 문제가 아니었다. */
.vfy .vr{display:flex;flex-wrap:wrap;gap:2px 7px;align-items:baseline;font-size:11.6px;line-height:1.55;padding:3px 0;color:#475569}
.vfy .vr .tm{flex:none;color:#94a3b8;font-weight:700;font-variant-numeric:tabular-nums}
.vfy .vr .bd{flex:none;font-size:9.5px;font-weight:800;border-radius:6px;padding:1px 6px}
.vfy .vr .bd.p{background:#ccfbf1;color:#0f766e}
.vfy .vr .bd.f{background:#fee2e2;color:#dc2626}
.vfy .vr .bd.n{background:#f1f5f9;color:#64748b}
.vfy .vr .lb{flex:1 1 auto;min-width:0;word-break:keep-all;overflow-wrap:break-word}
/* 파일명은 한글 문장과 다르게 다룬다 — 줄바꿈시키지 않고 한 줄 말줄임(…).
   전체 이름은 마우스 올리면(툴팁)·탭하면 보인다. 지시서 ■2 요구. */
.vfy .vr .lb i{font-style:normal;color:#94a3b8;font-size:10.5px;
 display:inline-block;max-width:100%;vertical-align:bottom;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vfy .vr .rs{flex:1 1 100%;color:#b45309;font-size:11px;padding-left:2px;
 word-break:keep-all;overflow-wrap:break-word}
.vfy .vnone{font-size:11.5px;color:#94a3b8;padding:3px 0}
/* 긴 사유 문장이 오른쪽으로 삐져나가지 않게 (폰 세로 390px 실측 후 교정) */
.vfy,.vfy .vbody{overflow:hidden}
/* ★2026-07-27 수리 — 여기 있던 "overflow-wrap: anywhere" 가 세로 낙하를 '보이게' 만든 증폭기였다.
   그 값은 글자 사이 어디서든 끊으므로, 칸이 좁아지는 순간 한글이 한 자씩 떨어진다.
   근본 원인(.vr 줄바꿈 누락)은 위에서 고쳤고, 여기서는 규칙을 '단어 단위'로 되돌린다.
   break-word 는 정말 안 들어갈 때만 최후수단으로 끊으므로 넘침도 막고 낙하도 안 만든다. */
.vfy .vr .lb,.vfy .vr .rs,.vfy .vh,.vfy .sumline{overflow-wrap:break-word;word-break:keep-all;min-width:0}
@media(max-width:780px){
 .vfy{padding:13px 13px}
 .vfy .sumline{font-size:12.3px}

.autop .warnbx h4{font-size:12px;font-weight:800;color:#b91c1c;margin-bottom:6px}

 /* 폰: 업무명 먼저, 그 아래 주기·ON/OFF (왼쪽 정렬) */

<script>
function dashForceRefresh(){
  try{
    if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}); }
    if(window.caches && caches.keys){ caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});}); }
  }catch(e){}
  setTimeout(function(){ location.replace(location.pathname+'?_r='+Date.now()); }, 250);
}
/* ★2026-07-15 자동최신화 v3 — 종전 버그 2개 수정
   ① 폴링이 없어 앱창을 켜두면 새 배포를 영영 못 받음
   ② ETag를 localStorage와 비교하며 '처음이면 현재 상태를 기준으로 저장'했다 →
      이미 캐시된 옛 화면을 보고 있어도 그걸 정상으로 간주해 영원히 안 바뀜.
      즉 "지금 내가 보는 게 최신인가"를 묻지 않았다.
   → 이제 페이지가 자기 빌드(window.__SYNC__)를 알고 서버 dashver.txt와 직접 비교한다. */
(function(){
  var busy=false;
  /* ★비번/로그인 게이트의 입력칸은 자동 포커스된다 → '타이핑 중'으로 오판해 리로드를 막던 버그.
     아직 들어오지도 않은 상태라 보호할 작업이 없다 → 제외. */
  function typing(){
    var a=document.activeElement;
    if(!a) return false;
    try{ if(a.closest && a.closest('#pwgate,#gate,#loginGate')) return false; }catch(e){}
    return a.tagName==='INPUT'||a.tagName==='TEXTAREA'||!!a.isContentEditable;
  }
  function chk(){
    if(busy||document.hidden) return; busy=true;
    /* ★status.ver.txt (현황판 전용) — 공용 dashver.txt를 쓰면 안 된다.
       현황판은 관제탑 publish_github.py가, 나머지 7종은 _inject_verbadge.py가 각각 발행해서
       두 시각이 늘 달라 매번 불필요한 새로고침이 일어난다. 그래서 자기 버전 파일을 따로 본다. */
    fetch('status.ver.txt',{cache:'no-store'}).then(function(r){ return r.ok?r.text():null; }).then(function(v){
      busy=false; if(!v) return; v=v.trim();
      var mine=window.__SYNC__||'';
      if(!mine || !v || v===mine) return;
      if(typing()) return;                                   /* 입력 중이면 건너뜀 */
      try{ if((new URL(location.href)).searchParams.get('_v')===v) return; }catch(e){}
      try{ var u=new URL(location.href); u.searchParams.set('_v',v); location.replace(u.pathname+u.search); }
      catch(e){ location.replace(location.pathname+'?_v='+encodeURIComponent(v)); }
    }).catch(function(){ busy=false; });
  }
  setTimeout(chk,2000);
  setInterval(chk,60000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) chk(); });
})();
</script></body></html>
