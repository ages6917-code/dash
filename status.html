function op(e){document.getElementById('mt').textContent='직원'+e.no+' · '+e.n;document.getElementById('mr').textContent=e.bg+' · '+((e.auto&&e.auto.ago)?e.auto.ago:e.ago);document.getElementById('mbg').textContent='목표 · '+(e.goal||'');document.getElementById('mb').innerHTML=detail(e);document.getElementById('ov').classList.add('show')}
function info(c,i){var x=(c=='iv'?INTERV:c=='rv'?REVIEW:PENDING)[i];document.getElementById('mt').textContent=x.t;document.getElementById('mr').textContent=(c=='iv'?'사람 개입 필요':c=='rv'?'검수 예정 · '+x.w:'보류중 · '+x.w);document.getElementById('mbg').textContent=(c=='iv'?'🚨 개입':c=='rv'?'📋 검수':'📌 보류');document.getElementById('mb').innerHTML='<div class="fb"><div class="h">왜 이게 필요한가</div><div class="id">'+x.why+'</div></div>';document.getElementById('ov').classList.add('show')}
function cl(){document.getElementById('ov').classList.remove('show')}

function saveEmp(no){var b={no:no,identity:document.getElementById('ef_id').value,ch:document.getElementById('ef_ch').value,goal:document.getElementById('ef_goal').value,strat:document.getElementById('ef_strat').value};api('/api/save','POST',b).then(function(){var e=emp(no);e.identity=b.identity;e.goal=b.goal;e.ch=b.ch.split(',').map(function(s){return s.trim()}).filter(Boolean);e.strat=b.strat.split('\n').map(function(s){return s.trim()}).filter(Boolean);op(e);render();alert('저장됐어요 ✅')})}
function addMemo(no,name){var t=document.getElementById('memo_text').value.trim();if(!t){alert('메모를 적어주세요');return}var when=document.getElementById('memo_when').value;if(when=='예약'){when='예약 '+(document.getElementById('memo_time').value||'시간미정')}api('/api/memo','POST',{no:no,name:name,text:t,when:when}).then(function(r){qcount=r.count;alert('메모 담음 — 전송 대기 '+qcount+'건. 다 적고 위 [전체 전송] 누르세요');cl();render()})}
