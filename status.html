.cd.c24h{border-left-color:#10b981}.cd.cdemand{border-left-color:#f59e0b}.cd.cstop{border-left-color:#ef4444}
.cd.c24h .dot{background:#10b981}.cd.cdemand .dot{background:#f59e0b}.cd.cstop .dot{background:#ef4444}
.pn h3 .cc{font-size:11px;font-weight:800;color:#fff;border-radius:20px;padding:1px 9px;margin-left:auto}
.pa h3 .cc{background:#ef4444}.pb h3 .cc{background:#3b82f6}.bf h3 .cc{background:#8b5cf6}.pc h3 .cc{background:#f59e0b}
.pn h3{display:flex;align-items:center}
.it .n2{width:20px;height:20px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}

/* 브리핑 히어로 */

var TKEY={overseas:['해외','사이언숯'],ai:['AI','음악','쇼츠','시장조사'],collect:['수집'],temu:['테무'],ecom:['이커머스','위탁','광고'],etc:['쇼핑몰등록','컨설팅','결제','동기화','스케줄']};
function teamFlow(k){var fl=FLOWS[k];if(!fl)return '';
var h='<div class="flow"><b style="font-size:12px;color:#8a83b0">업무 흐름</b>';
fl.forEach(function(no,i){if(i)h+='<span class="ar">→</span>';
if(no==0){h+='<span class="fn" style="background:#f0eefc;color:#5b4fd0;cursor:default">🐱 T봇 검수</span>';return}
var e=emp(no);if(!e)return;var lv=probLv(e);var c=lv==2?'#ef4444':lv==1?'#f59e0b':'#10b981';
h+='<span class="fn'+(lv==2?' bad':'')+'" data-no="'+no+'"><span class="dot2" style="background:'+c+'"></span>직원'+no+' '+e.n+'</span>'});
return h+'</div>'}
function teamBrief(k){var ks=TKEY[k]||[];var bs=BRIEF.filter(function(b){var t=(typeof b=='string')?b:b.t;return ks.some(function(w){return t.indexOf(w)>=0})});
if(!bs.length)return '';
return '<div class="bf hero" style="margin-bottom:16px"><h3>🐱 이 팀 오늘 브리핑 <span class="cc">'+bs.length+'</span></h3>'+briefRows(bs)+'</div>'}
function teamView(k){var t=TEAMS.filter(function(x){return x.k==k})[0];var es=E.filter(function(e){return e.tm===k}).sort(function(a,b){return a.no-b.no});
var tg=(D.teams&&D.teams[k])||{goal:'-',strat:'-'};
var ok=es.filter(function(e){return probLv(e)==0}).length,bad=es.filter(function(e){return probLv(e)==2}).length;
var todayN=0;es.forEach(function(e){todayN+=(e.today||[]).filter(function(x){return x.t!='-'}).length;if(e.auto&&e.auto.today)todayN+=e.auto.today.length});
var iv2=INTERV.filter(function(x){return (TKEY[k]||[]).some(function(w){return x.t.indexOf(w)>=0})}).length;
var rate=es.length?Math.round(ok/es.length*100):0;
var tk='<div class="tkpis"><div class="tk"><div class="kdonut" style="background:conic-gradient('+(rate>=60?'#16a34a':rate>=30?'#f59e0b':'#ef4444')+' '+rate+'%,#eceaf6 0)"><b>'+rate+'%</b></div><div class="l">가동률</div></div>'
+'<div class="tk"><div class="v">'+ok+'/'+es.length+'</div><div class="l">정상 가동</div></div>'
+'<div class="tk'+(bad?' warn':'')+'"><div class="v">'+bad+'</div><div class="l">문제 직원</div></div>'
+'<div class="tk"><div class="v">'+todayN+'건</div><div class="l">오늘 일정</div></div>'
+'<div class="tk'+(iv2?' warn':'')+'"><div class="v">'+iv2+'</div><div class="l">개입 대기</div></div></div>';
return '<div class="thead"><span class="te">'+t.e+'</span><div><h2>'+t.l+' <span style="font-size:12px;opacity:.85">'+es.length+'명</span></h2></div></div>'
+tk+teamFlow(k)+teamBrief(k)
+'<div class="tgoal"><div class="box g"><h4>🎯 팀 목표</h4><p>'+tg.goal+'</p></div><div class="box s"><h4>🧭 팀 전략</h4><p>'+tg.strat+'</p></div></div>'
+'<div class="gr tvgr">'+es.map(card).join('')+'</div>'}
function op(e){document.getElementById('mt').textContent='직원'+e.no+' · '+e.n;document.getElementById('mr').textContent=e.bg+' · '+((e.auto&&e.auto.ago)?e.auto.ago:e.ago);document.getElementById('mbg').textContent='목표 · '+(e.goal||'');document.getElementById('mb').innerHTML=detail(e);document.getElementById('ov').classList.add('show')}
function info(c,i){var x=(c=='iv'?INTERV:c=='rv'?REVIEW:PENDING)[i];document.getElementById('mt').textContent=x.t;document.getElementById('mr').textContent=(c=='iv'?'사람 개입 필요':c=='rv'?'검수 예정 · '+x.w:'보류중 · '+x.w);document.getElementById('mbg').textContent=(c=='iv'?'🚨 개입':c=='rv'?'📋 검수':'📌 보류');document.getElementById('mb').innerHTML='<div class="fb"><div class="h">왜 이게 필요한가</div><div class="id">'+x.why+'</div></div>';document.getElementById('ov').classList.add('show')}
function cl(){document.getElementById('ov').classList.remove('show')}
function toggleEdit(){document.getElementById('ef').classList.toggle('show')}
function saveEmp(no){var b={no:no,identity:document.getElementById('ef_id').value,ch:document.getElementById('ef_ch').value,goal:document.getElementById('ef_goal').value,strat:document.getElementById('ef_strat').value};api('/api/save','POST',b).then(function(){var e=emp(no);e.identity=b.identity;e.goal=b.goal;e.ch=b.ch.split(',').map(function(s){return s.trim()}).filter(Boolean);e.strat=b.strat.split('\n').map(function(s){return s.trim()}).filter(Boolean);op(e);render();alert('저장됐어요 ✅')})}
function addMemo(no,name){var t=document.getElementById('memo_text').value.trim();if(!t){alert('메모를 적어주세요');return}var when=document.getElementById('memo_when').value;if(when=='예약'){when='예약 '+(document.getElementById('memo_time').value||'시간미정')}api('/api/memo','POST',{no:no,name:name,text:t,when:when}).then(function(r){qcount=r.count;alert('메모 담음 — 전송 대기 '+qcount+'건. 다 적고 위 [전체 전송] 누르세요');cl();render()})}
function sendAll(){if(qcount==0){alert('담긴 메모가 없어요');return}if(!confirm(qcount+'건을 직원들에게 전송할까요?'))return;api('/api/sendall','POST',{}).then(function(r){alert(r.ready+'건 전송 준비 완료! T봇 전달기가 순차 전달합니다.');qcount=0;render()})}
function render(){var v=document.getElementById('view');if(cur=='all'){v.innerHTML=overview();[].forEach.call(v.querySelectorAll('.cd'),function(c){c.onclick=function(){op(emp(+c.dataset.no))}});[].forEach.call(v.querySelectorAll('.it[data-c]'),function(it){it.onclick=function(){info(it.dataset.c,+it.dataset.i)}});[].forEach.call(v.querySelectorAll('.act .ac'),function(b){b.onclick=function(){if(b.dataset.no)op(emp(+b.dataset.no));else if(b.dataset.go){var p=document.getElementById(b.dataset.go);if(p)p.scrollIntoView({behavior:'smooth'})}}})}else if(cur=='mon6'){v.innerHTML=monView()}else if(cur=='items6'){v.innerHTML=itemsView();[].forEach.call(v.querySelectorAll('.iv6 .item'),function(it){it.querySelector('.row').onclick=function(){it.classList.toggle('op');var c=it.querySelector('.dchev');if(c)c.textContent=it.classList.contains('op')?'▾':'▸'}})}else{v.innerHTML=teamView(cur);[].forEach.call(v.querySelectorAll('.cd'),function(c){c.onclick=function(){op(emp(+c.dataset.no))}});[].forEach.call(v.querySelectorAll('.flow .fn[data-no]'),function(f){f.onclick=function(){op(emp(+f.dataset.no))}});[].forEach.call(v.querySelectorAll('.it[data-c]'),function(it){it.onclick=function(){info(it.dataset.c,+it.dataset.i)}})}}
fillTopbar();
if(BK){api('/api/queue').then(function(r){qcount=r.count;nb();render()}).catch(function(){nb();render()})}else{nb();render()}
</script><!-- DASH_AUTOFRESH v3 -->
<button id="dashRefreshBtn" title="최신화" onclick="dashForceRefresh()" style="position:fixed;left:12px;bottom:12px;z-index:99999;border:none;background:rgba(79,70,229,.92);color:#fff;border-radius:20px;padding:8px 13px;font-size:13px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.28);cursor:pointer;font-family:'Malgun Gothic',sans-serif">🔄 최신화</button>
<div id="dashVerBadge" title="배포 버전 - 이 시각 이후가 최신" style="position:fixed;left:12px;bottom:54px;z-index:99998;background:rgba(17,24,39,.80);color:#c7d2fe;border-radius:13px;padding:4px 10px;font-size:11px;font-weight:700;letter-spacing:.2px;box-shadow:0 3px 9px rgba(0,0,0,.22);font-family:'Malgun Gothic',sans-serif;pointer-events:none"></div>
<script>try{document.getElementById('dashVerBadge').textContent='v'+(window.__SYNC__||new Date().toISOString().slice(0,16).replace('T',' '));}catch(e){}</script>
<script>
function dashForceRefresh(){
  try{
    if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}); }
    if(window.caches && caches.keys){ caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});}); }
  }catch(e){}
  setTimeout(function(){ location.replace(location.pathname+'?_r='+Date.now()); }, 250);
}
/* ★2026-07-15 자동최신화 v3 — 종전 버그 2개 수정
   ① 폴링이 없어 앱창을 켜두면 새 배포를 영영 못 받음
   ② ETag를 localStorage와 비교하며 '처음이면 현재 상태를 기준으로 저장'했다 →
      이미 캐시된 옛 화면을 보고 있어도 그걸 정상으로 간주해 영원히 안 바뀜.
      즉 "지금 내가 보는 게 최신인가"를 묻지 않았다.
   → 이제 페이지가 자기 빌드(window.__SYNC__)를 알고 서버 dashver.txt와 직접 비교한다. */
(function(){
  var busy=false;
  /* ★비번/로그인 게이트의 입력칸은 자동 포커스된다 → '타이핑 중'으로 오판해 리로드를 막던 버그.
     아직 들어오지도 않은 상태라 보호할 작업이 없다 → 제외. */
  function typing(){
    var a=document.activeElement;
    if(!a) return false;
    try{ if(a.closest && a.closest('#pwgate,#gate,#loginGate')) return false; }catch(e){}
    return a.tagName==='INPUT'||a.tagName==='TEXTAREA'||!!a.isContentEditable;
  }
  function chk(){
    if(busy||document.hidden) return; busy=true;
    /* ★status.ver.txt (현황판 전용) — 공용 dashver.txt를 쓰면 안 된다.
       현황판은 관제탑 publish_github.py가, 나머지 7종은 _inject_verbadge.py가 각각 발행해서
       두 시각이 늘 달라 매번 불필요한 새로고침이 일어난다. 그래서 자기 버전 파일을 따로 본다. */
    fetch('status.ver.txt',{cache:'no-store'}).then(function(r){ return r.ok?r.text():null; }).then(function(v){
      busy=false; if(!v) return; v=v.trim();
      var mine=window.__SYNC__||'';
      if(!mine || !v || v===mine) return;
      if(typing()) return;                                   /* 입력 중이면 건너뜀 */
      try{ if((new URL(location.href)).searchParams.get('_v')===v) return; }catch(e){}
      try{ var u=new URL(location.href); u.searchParams.set('_v',v); location.replace(u.pathname+u.search); }
      catch(e){ location.replace(location.pathname+'?_v='+encodeURIComponent(v)); }
    }).catch(function(){ busy=false; });
  }
  setTimeout(chk,2000);
  setInterval(chk,60000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) chk(); });
})();
</script></body></html>
