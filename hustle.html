</style>

  }

  function buildFoldbar(){
    var live=ITEMS.filter(function(i){return !i.scam;});
    var today=META.updated.replace(/-/g,"");
    var cnt={"전체":live.length,"신규":live.filter(function(i){return i.firstSeen===today;}).length,"진행":0,"보류":0,"폐기":0};
    live.forEach(function(i){var f=folderOf(i); if(cnt[f]!==undefined)cnt[f]++;});
    var defs=[["전체","📂 전체 발굴함",""],["신규","🆕 신규",""],["진행","▶️ 진행 예정","f-go"],["보류","⏸️ 보류","f-hold"],["폐기","🗄️ 폐기(보관)","f-drop"]];
    document.getElementById('foldbar').innerHTML=defs.map(function(x){
      return '<button class="fold '+x[2]+(curFold===x[0]?' on':'')+'" onclick="pickFold(\''+x[0]+'\')">'+x[1]+'<span class="cnt">'+cnt[x[0]]+'</span></button>';
    }).join('')+'<span class="foldnote">폐기도 삭제가 아닙니다 — 언제든 여기서 복구</span>';
  }
  function pickFold(f){ curFold=f; PG=1; buildFoldbar(); render(); }
  function pickCat(c){ curCat=c; PG=1; buildCatbar(); render(); }
  function resetPg(){ PG=1; render(); }

  function buildCatbar(){
    var live=ITEMS.filter(function(i){return !i.scam;});
    var cnt={}; live.forEach(function(i){cnt[i.cat]=(cnt[i.cat]||0)+1;});
    var cats=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];});
    var html='<button class="catchip'+(curCat==="전체"?" on":"")+'" onclick="pickCat(\'전체\')">전체 <span class="cnt">'+live.length+'</span></button>';
    html+=cats.map(function(c){
      return '<button class="catchip'+(curCat===c?" on":"")+'" onclick="pickCat(\''+c+'\')">'+meta(c)[0]+' '+c+' <span class="cnt">'+cnt[c]+'</span></button>';
    }).join('');
    document.getElementById('catbar').innerHTML=html;
  }

  function filtered(){
    var q=(document.getElementById('search').value||"").toLowerCase();
    var per=document.getElementById('period').value, mon=document.getElementById('mon').value;
    var frF=document.getElementById('fresh').value;
    var today=META.updated.replace(/-/g,"");
    return ITEMS.filter(function(i){
      if(i.scam) return false;
      if(curSrc!=="전체" && srcOf(i)!==curSrc) return false;
      if(curCC!=="전체" && ccOf(i)[0]!==curCC) return false;
      if(frF!=="all" && freshOf(i).k!==frF) return false;
      var f=folderOf(i);
      if(curFold==="신규"){ if(i.firstSeen!==today) return false; }
      else if(curFold!=="전체"){ if(f!==curFold) return false; }
      if(curCat!=="전체" && i.cat!==curCat) return false;
      if(mon!=="all" && i.firstSeen.slice(0,6)!==mon) return false;
      if(per==="today" && i.firstSeen!==today) return false;
      if(per==="week" && daysAgo(i.lastSeen)>7) return false;
      if(per==="month" && i.lastSeen.slice(0,6)!==today.slice(0,6)) return false;
      if(q && (i.name+i.platform+i.cat+i.model).toLowerCase().indexOf(q)<0) return false;
      return true;
    });
  }

  function cardHtml(i){
    var isNew=i.firstSeen===META.updated.replace(/-/g,"");
    var m=meta(i.cat), f=folderOf(i), fr=freshOf(i);
    var fb=f&&FOLDS[f]? '<span class="badge '+FOLDS[f][1]+'">'+FOLDS[f][0]+'</span>':'';
    return '<div class="vcard'+(isNew?' new':'')+(f==="폐기"?' dim':'')+(fr.k==="legacy"?' dim':'')+'" onclick="openItem(\''+i.id+'\')">'+
      '<div class="vtop"><div class="avatar" style="background:var('+m[1]+'-bg,#f0e9fe)">'+m[0]+'</div>'+
      '<div><div class="vname">'+i.name+'</div><div class="vcat">'+i.cat+'</div></div></div>'+
      ccChip(i)+'<span class="badge b-diff">📡 '+srcOf(i)+'</span>'+
      '<span class="badge" style="background:'+fr.bg+';color:'+fr.c+'">'+fr.lab+'</span>'+
      (isNew?'<span class="badge b-new">🆕 오늘 신규</span>':'')+
      (isUpd(i)?'<span class="badge b-upd">🔄 최신 '+ymd(i.lastSeen).slice(5)+' 갱신</span>':'')+
      (i.mentions>1?'<span class="badge b-merge">병합 '+i.mentions+'회</span>':'')+
      fb+
      '<span class="badge b-diff">'+diffTxt(i.diff)+'</span>'+
      '<div class="vmeta"><div><div class="k">플랫폼</div><div class="v plat">'+i.platform+'</div></div>'+
      '<div style="text-align:right"><div class="k">TTAPP 자동화</div><div class="v">'+i.ttapp+'/5</div></div></div></div>';
  }

  function render(){
    var list=filtered();
    var ns=document.getElementById('newsect');
    var today=META.updated.replace(/-/g,"");
    var news=list.filter(function(i){return i.firstSeen===today;});
    var showNewSect = news.length && curFold==="전체" && document.getElementById('period').value==='all' && PG===1;
    var rest = showNewSect? list.filter(function(i){return i.firstSeen!==today;}) : list;

    /* 페이지네이션 */
    var totalPg=Math.max(1,Math.ceil(rest.length/PAGE));
    if(PG>totalPg)PG=totalPg;
    var pageItems=rest.slice((PG-1)*PAGE, PG*PAGE);

    if(showNewSect){
      var bt = META.builtAt? '<span class="tag" style="background:var(--green-bg);color:var(--green)">🤖 AI직원 수집 완료 · '+META.builtAt+'</span>'
                           : '<span class="tag" style="background:#eef0f3;color:#6b7280">생성시각 미기록 — 다음 수집부터 표시</span>';
      ns.innerHTML='<div class="sect">🆕 오늘의 신규 아이템 <span class="tag">'+news.length+'건</span>'+bt+'</div>'+
        '<div class="grid">'+news.map(cardHtml).join('')+'</div>';
      document.getElementById('view').innerHTML= pageItems.length? '<div class="sect">📋 전체 아이템</div><div class="grid">'+pageItems.map(cardHtml).join('')+'</div>':'';
    } else {
      ns.innerHTML='';
      document.getElementById('view').innerHTML= pageItems.length? '<div class="grid">'+pageItems.map(cardHtml).join('')+'</div>':'<div class="foot">조건에 맞는 아이템이 없습니다.</div>';
    }
    renderFbar(list.length);
    renderPager(totalPg, rest.length);
    renderTrend();
    renderScam();
    document.getElementById('foot').textContent='💡 발굴된 아이템은 자동으로 지워지지 않습니다. 폴더 분류는 사장님만 할 수 있어요. ('+META.updated+' 기준 '+ITEMS.length+'건)';
  }

  function renderPager(total, n){
    var pg=document.getElementById('pager'), info=document.getElementById('pginfo');
    if(total<=1){ pg.innerHTML=''; info.textContent=''; return; }
    info.textContent='총 '+n+'건 · '+PG+' / '+total+' 페이지 (페이지당 '+PAGE+'건)';
    var h='<button class="pg" '+(PG===1?'disabled':'')+' onclick="goPg('+(PG-1)+')">‹</button>';
    var st=Math.max(1,PG-3), en=Math.min(total,st+6); st=Math.max(1,en-6);
    if(st>1)h+='<button class="pg" onclick="goPg(1)">1</button>'+(st>2?'<button class="pg" disabled>…</button>':'');
    for(var p=st;p<=en;p++)h+='<button class="pg'+(p===PG?' on':'')+'" onclick="goPg('+p+')">'+p+'</button>';
    if(en<total)h+=(en<total-1?'<button class="pg" disabled>…</button>':'')+'<button class="pg" onclick="goPg('+total+')">'+total+'</button>';
    h+='<button class="pg" '+(PG===total?'disabled':'')+' onclick="goPg('+(PG+1)+')">›</button>';
    pg.innerHTML=h;
  }
  function goPg(p){ PG=p; render(); document.getElementById('catbar').scrollIntoView({behavior:'smooth'}); }

  function renderTrend(){
    var t=ITEMS.filter(function(i){return !i.scam && i.mentions>1;}).sort(function(a,b){return b.mentions-a.mentions;}).slice(0,10);
    if(!t.length){ document.getElementById('trendhd').style.display='none'; document.getElementById('trend').style.display='none'; return; }
    document.getElementById('trendhd').style.display='flex'; document.getElementById('trend').style.display='block';
    var mx=t[0].mentions;
    document.getElementById('trend').innerHTML=t.map(function(i){
      return '<div class="trow"><div class="tn">'+meta(i.cat)[0]+' '+i.name+'</div>'+
        '<div class="tbar" style="width:'+Math.round(i.mentions/mx*160+30)+'px"></div>'+
        '<div class="tc">'+i.mentions+'회</div></div>';
    }).join('');
  }
  function renderScam(){
    var s=ITEMS.filter(function(i){return i.scam;});
    if(!s.length){ document.getElementById('scamwrap').innerHTML=''; return; }
    document.getElementById('scamwrap').innerHTML='<details class="scam"><summary>⚠️ 사기의심 격리함 ('+s.length+'건) — 강의퍼널·선입금·수익인증 없는 아이템</summary>'+
      s.map(function(i){return '<div class="si"><b>'+i.name+'</b> · '+i.cat+' · '+i.platform+'<br>'+i.model+'</div>';}).join('')+'</details>';
  }

  function srcPill(u){
    if(u.indexOf('youtube')>=0||u.indexOf('youtu.be')>=0)return '유튜브';
    if(u.indexOf('reddit')>=0)return 'Reddit';
    if(u.indexOf('news.ycombinator')>=0)return 'HN';
    if(u.indexOf('kmong')>=0)return '크몽';
    if(u.indexOf('fiverr')>=0)return 'Fiverr';
    if(u.indexOf('coconala')>=0)return 'ココナラ';
    if(u.indexOf('naver')>=0)return '네이버';
    return '웹';
  }
  function bar(label,ratio,color,val){
    return '<div class="mbar"><div class="bl">'+label+'</div><div class="btrack"><div class="bfill" style="width:'+Math.round(ratio*100)+'%;background:'+color+'"></div></div><div class="bv" style="color:'+color+'">'+val+'</div></div>';
  }

  function openItem(id){
    var i=ITEMS.filter(function(x){return x.id===id;})[0]; if(!i)return;
    var m=meta(i.cat), f=folderOf(i);
    var c='<div class="mhead"><div class="avatar" style="background:var('+m[1]+'-bg,#f0e9fe)">'+m[0]+'</div>'+
      '<div><h2>'+i.name+'</h2><span class="badge b-diff">'+i.cat+' · '+i.country+'</span>'+
      '<span class="badge" style="background:'+freshOf(i).bg+';color:'+freshOf(i).c+'">'+freshOf(i).lab+'</span>'+
      (isUpd(i)?'<span class="badge b-upd">🔄 최신 '+ymd(i.lastSeen)+' 갱신</span>':'')+
      (i.mentions>1?'<span class="badge b-merge">병합 '+i.mentions+'회</span>':'')+
      (i.scam?'<span class="badge b-no">⚠️ 사기의심</span>':'')+'</div>'+
      '<button class="close" onclick="closeModal()">✕</button></div>';
    /* 한눈 요약 — 최소 3줄 설명 */
    var ez0=6-i.diff;
    var ezTxt=ez0>=4?'진입장벽이 낮아 초보도 바로 시작할 수 있습니다':ez0>=3?'난이도는 보통 — 초반 세팅만 넘기면 운영은 어렵지 않습니다':'난이도가 있는 편이라 초반에 배울 것이 좀 있습니다';
    var atTxt=i.ttapp>=4?'TTAPP 자동화 적합도가 '+i.ttapp+'/5로 높아, T봇 직원이 대부분의 작업을 자동 처리하고 사람은 검수만 하면 됩니다.':i.ttapp>=3?'TTAPP 자동화 적합도는 '+i.ttapp+'/5 — 반복 작업 일부를 T봇에게 맡길 수 있습니다.':'자동화 적합도가 '+i.ttapp+'/5로 낮아 사람 손이 많이 가는 아이템입니다.';
    var trTxt=i.mentions>=5?'국내외 소스에서 '+i.mentions+'회 반복 발견된, 관심이 붙고 있는 아이템입니다.':i.mentions>1?'지금까지 '+i.mentions+'회 발견됐습니다.':'이번에 처음 포착된 신규 아이템입니다.';
    var desc = i.desc ? i.desc :
       '이 부업은 <b>'+i.platform+'</b>에서 <b>'+i.model+'</b> 방식으로 수익을 만듭니다.<br>'+
       '초기비용 <b>'+i.cost+'</b>으로 시작하며, '+ezTxt+'.<br>'+
       atTxt+' '+trTxt;
    c+='<div class="msub">💡 이게 뭔가요?</div>'+
       '<div style="font-size:14px;font-weight:600;line-height:1.75">'+desc+'</div>';
    /* 지표 시각화 */
    var ez=6-i.diff;
    c+='<div class="msub">📊 지표</div><div class="mbars">'+
      bar('쉬움 (난이도 역순)', ez/5, ez>=4?'var(--green)':ez>=3?'var(--orange)':'var(--red)', ez>=4?'쉬움':ez>=3?'보통':'어려움')+
      bar('TTAPP 자동화', i.ttapp/5, i.ttapp>=4?'var(--accent)':'var(--orange)', i.ttapp+'/5'+(i.ttapp>=4?' 자동화 강함':''))+
      bar('트렌드 (병합횟수)', Math.min(1,i.mentions/10), i.mentions>=5?'var(--purple)':'#94a3b8', i.mentions+'회 발견')+
      '</div>';
    /* 핵심 정보 */
    c+='<div class="msub">🗂 핵심 정보</div><div class="drow">'+
      '<div class="di"><span>초기비용</span>'+i.cost+'</div>'+
      '<div class="di"><span>난이도</span>'+i.diff+'/5</div>'+
      '<div class="di"><span>콘텐츠 게시일</span>'+(i.pubDate?ymd(i.pubDate)+' ('+freshOf(i).lab+')':'미확인')+'</div>'+
      '<div class="di"><span>최초 발견</span>'+ymd(i.firstSeen)+(i.foundAt?' '+i.foundAt:'')+'</div>'+
      '<div class="di"><span>최근 확인</span>'+ymd(i.lastSeen)+'</div>'+
      (i.score?'<div class="di"><span>점수</span>'+i.score+'</div>':'')+'</div>';
    /* 이력 */
    c+='<div class="hist">📜 이력: '+ymd(i.firstSeen)+' 최초 발견'+(isUpd(i)? ' → '+ymd(i.lastSeen)+' 재발견·정보 갱신 (총 '+i.mentions+'회) — 중복은 버리지 않고 최신·최상 정보로 갱신됩니다':' · 이후 재발견시 자동으로 최신 정보로 갱신')+'</div>';
    /* 출처 */
    c+='<div class="msub">📎 출처 (클릭하면 원본)</div><div class="srcs">'+
      i.urls.map(function(u){return '<a href="'+u+'" target="_blank"><span class="pill">'+srcPill(u)+'</span><span class="u">'+u+'</span></a>';}).join('')+'</div>';
    /* 폴더 지정 */
    c+='<div class="msub">📂 이 아이템을 어디로? <span style="font-weight:500;color:var(--sub)">(지정 전까지 발굴함에 계속 보관 — 자동 삭제 없음)</span></div>'+
      '<div class="fbtns">'+
      Object.keys(FOLDS).map(function(k){var d=FOLDS[k];
        return '<button class="fbtn '+d[2]+(f===k?' sel':'')+'" onclick="setFolder(\''+i.id+'\',\''+(f===k?'':k)+'\')">'+d[0]+(f===k?' ✓':'')+'</button>';
      }).join('')+
      (f?'<button class="fbtn fb-clear" onclick="setFolder(\''+i.id+'\',\'\')">분류 해제</button>':'')+
      '</div>'+
      '<div class="fnote">같은 버튼을 다시 누르면 해제됩니다. 분류는 이 컴퓨터에 저장돼요.</div>';
    document.getElementById('modal').innerHTML=c;
    document.getElementById('overlay').classList.add('on');
  }
  /* ── 현재 필터 요약줄: 무엇이든 클릭하면 여기가 즉시 바뀜 ── */
  function renderFbar(n){
    var chips=[];
    if(curFold!=="전체") chips.push("📂 "+curFold);
    if(curCat!=="전체") chips.push("🗂 "+curCat);
    if(curSrc!=="전체") chips.push("📡 "+curSrc);
    if(curCC!=="전체") chips.push("🌍 "+curCC);
    var frS=document.getElementById('fresh'); if(frS&&frS.value!=="all") chips.push("🕐 "+frS.options[frS.selectedIndex].text);
    var q=(document.getElementById('search').value||"").trim(); if(q) chips.push("🔍 "+q);
    var h= chips.length? '현재 필터: '+chips.map(function(c){return '<span class="fchip">'+c+'</span>';}).join('')
                       : '전체 표시 중';
    h+=' <span class="fcnt">→ '+n+'건</span>';
    if(chips.length) h+='<button class="rst" onclick="resetAll()">✕ 필터 초기화</button>';
    document.getElementById('fbar').innerHTML=h;
  }
  function resetAll(){
    curCat="전체"; curFold="전체"; curSrc="전체"; curCC="전체"; PG=1;
    document.getElementById('search').value=""; document.getElementById('period').value="all";
    document.getElementById('fresh').value="all"; document.getElementById('mon').value="all";
    buildFoldbar(); buildCatbar(); renderSources(); render();
  }
  /* ── 우측: 발굴처 현황 패널 ── */
  function pickSrc(s){ curSrc=s; PG=1; renderSources(); render(); }
  function pickCC(k){ curCC=(curCC===k?"전체":k); PG=1; renderSources(); render(); }
  function renderSources(){
    var live=ITEMS.filter(function(i){return !i.scam;});
    var cnt={}; live.forEach(function(i){ var s=srcOf(i); cnt[s]=(cnt[s]||0)+1; });
    var names=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];});
    var SM=META.sources||{}; /* 직원이 넣으면 {유튜브:{status:"정상",last:"07-04 09:50",today:5}, ...} */
    var h='<div class="ssec"><h4>📡 발굴처 <span style="font-weight:600;font-size:11px;color:var(--sub)">클릭하면 그 소스만</span></h4>';
    h+='<div class="srow'+(curSrc==="전체"?' on':'')+'" onclick="pickSrc(\'전체\')"><span class="sdot" style="background:#4f46e5"></span><span class="sn">전체</span><span class="sc">'+live.length+'건</span></div>';
    names.forEach(function(s){
      var m=SM[s]||{};
      var dc = m.status==="정상"?"#16a34a": m.status==="차단"?"#dc2626": m.status?"#e08600":"#cbd5e1";
      h+='<div class="srow'+(curSrc===s?' on':'')+'" onclick="pickSrc(\''+s+'\')">'+
         '<span class="sdot" style="background:'+dc+'"></span><span class="sn">'+s+'</span><span class="sc">'+cnt[s]+'건</span>'+
         (m.last||m.status?'<span class="st">'+(m.status||'')+(m.today!=null?' · 오늘 '+m.today+'건':'')+(m.last?' · '+m.last:'')+'</span>':'')+
         '</div>';
    });
    if(!Object.keys(SM).length) h+='<div class="snote">소스별 가동상태·수집시각은 직원이 data.js의 META.sources를 채우면 표시됩니다 (교육파일 참고)</div>';
    h+='</div>';
    /* 국가 분포 */
    var cc={}; live.forEach(function(i){ var c=ccOf(i)[0]; cc[c]=(cc[c]||0)+1; });
    var ks=Object.keys(cc).sort(function(a,b){return cc[b]-cc[a];});
    var mx=Math.max.apply(null,ks.map(function(k){return cc[k];}).concat([1]));
    h+='<div class="ssec"><h4>🌍 국가 분포</h4>';
    ks.forEach(function(k){
      var col={한국:"#2563eb",미국:"#7c3aed",일본:"#db2777",중국:"#d23f3f",유럽:"#2e7d32"}[k]||"#475569";
      h+='<div class="cbarrow'+(curCC===k?' on':'')+'" onclick="pickCC(\''+k+'\')"><span class="cl" style="color:'+col+'">'+k+'</span>'+
         '<span class="ctrack"><span class="cfill" style="display:block;width:'+Math.round(cc[k]/mx*100)+'%;background:'+col+'"></span></span>'+
         '<span class="cv">'+cc[k]+'</span></div>';
    });
    h+='<div class="snote">막대 클릭 = 그 국가만 보기 (다시 클릭하면 해제). 해외 수집(수집B·D)이 가동되면 미국·일본·중국 막대가 늘어납니다</div></div>';
    document.getElementById('spanel').innerHTML=h;
  }
  function closeModal(){document.getElementById('overlay').classList.remove('on');}
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
  setHeader(); buildFoldbar(); buildCatbar(); renderSources(); render();
</script>
<!-- DASH_AUTOFRESH v1 -->
<button id="dashRefreshBtn" title="최신화" onclick="dashForceRefresh()" style="position:fixed;left:12px;bottom:12px;z-index:99999;border:none;background:rgba(79,70,229,.92);color:#fff;border-radius:20px;padding:8px 13px;font-size:13px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.28);cursor:pointer;font-family:'Malgun Gothic',sans-serif">🔄 최신화</button>
<script>
function dashForceRefresh(){
  try{
    if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}); }
    if(window.caches && caches.keys){ caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});}); }
  }catch(e){}
  setTimeout(function(){ location.replace(location.pathname+'?_r='+Date.now()); }, 250);
}
(function(){
  try{
    fetch(location.pathname,{method:'HEAD',cache:'no-store'}).then(function(r){
      var tag=r.headers.get('ETag')||r.headers.get('Last-Modified'); if(!tag) return;
      var key='dashver:'+location.pathname, prev=localStorage.getItem(key);
      localStorage.setItem(key,tag);
      if(prev && prev!==tag && location.search.indexOf('_r=')===-1){
        location.replace(location.pathname+'?_r='+Date.now());
      }
    }).catch(function(){});
  }catch(e){}
})();
</script>
</body>
</html>
