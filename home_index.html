:root{
  --bg:#F5EEDC; --card:#FFFDF6; --line:#EDE6CE; --line2:#D8CFA8;
  --txt:#3E3A28; --sub:#8A8264; --sub2:#6B6448;
  --side:#2A2620; --sideink:#EDE6CE; --sidehi:#3B362C;
  --red:#C0392B; --blue:#185FA5; --green:#3B6D11; --accent:#7F77DD;
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{background:var(--bg);color:var(--txt);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
a{color:inherit;text-decoration:none}
/* 로그인 */
#loginView{min-height:90vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#loginView h1{font-size:22px}#loginView p{font-size:13px;color:var(--sub)}
#loginBtn{border:none;background:#3E3A28;color:#F5EEDC;border-radius:10px;padding:12px 26px;font-size:14px;cursor:pointer;font-family:inherit}
/* 레이아웃 */
#app{display:none;min-height:100vh}
.wrap{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
/* 사이드바 */
.side{background:var(--side);color:var(--sideink);padding:16px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-size:16px;font-weight:800;padding:6px 10px 14px;display:flex;align-items:center;gap:8px}
.navlabel{font-size:10.5px;color:#9A9075;font-weight:800;letter-spacing:.5px;margin:14px 10px 5px}
.nav{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;font-size:13.5px;cursor:pointer;color:#D9D1B8;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav:hover{background:var(--sidehi);color:#fff}
.nav.on{background:var(--accent);color:#fff}
.nav .dot{width:9px;height:9px;border-radius:50%;flex:none}
.nav .sd{font-size:10.5px;color:#9A9075;font-weight:500;margin-left:auto}
.aimini{margin-top:auto;padding:11px;border-radius:9px;background:#221F19;font-size:11px;color:#9A9075;cursor:pointer;line-height:1.5}
.aimini b{color:#D9D1B8}
/* 메인 */
.main{padding:22px 26px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:10px;flex-wrap:wrap}
.top h1{font-size:22px;font-weight:800}
.top .sub{color:var(--sub);font-size:12.5px;margin-top:5px}
.sync{color:var(--green);font-size:11px}
.date{text-align:right;color:var(--sub2);font-size:13px}.date b{font-size:15px}
.date .out{font-size:11px;color:var(--sub);cursor:pointer;text-decoration:underline;margin-top:4px;display:inline-block}
/* 카드 */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1.05fr 1.3fr 1fr}
.col{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:14px;padding:15px 17px;border:1px solid rgba(0,0,0,.03)}
.card h2{font-size:13.5px;margin-bottom:11px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 .cnt{font-size:11px;color:var(--sub);font-weight:400}
/* 업무 */
.task,.dd{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.task:last-child,.dd:last-child{border-bottom:none}
.task input[type=checkbox]{accent-color:var(--accent)}
.task .txt,.dd .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task.done .txt{text-decoration:line-through;color:var(--sub)}
.tag{font-size:11px;border-radius:5px;padding:2px 7px;white-space:nowrap}
.due{font-size:11px;color:var(--sub);white-space:nowrap}.due.over{color:var(--red);font-weight:700}
.del{cursor:pointer;color:var(--line2);font-size:14px;padding:0 2px}.del:hover{color:var(--red)}
.dd .dot{width:8px;height:8px;border-radius:50%;flex:none}
.dd .cd{font-size:12px;font-weight:800;white-space:nowrap;padding:2px 9px;border-radius:20px}
.dd .cd.soon{background:#FBEAEA;color:var(--red)}.dd .cd.near{background:#FAEEDA;color:#8A5A0B}.dd .cd.far{background:#EEF0F3;color:var(--sub2)}
.addrow{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.addrow input,.addrow select{border:1px solid var(--line2);border-radius:7px;padding:7px 8px;font-size:12px;background:#fff;color:var(--txt);font-family:inherit}
.addrow input[type=text]{flex:1;min-width:80px}
.addrow button{border:none;background:#3E3A28;color:#F5EEDC;border-radius:7px;padding:7px 12px;font-size:12px;cursor:pointer}
.empty{font-size:12px;color:var(--sub);padding:8px 0}
/* 캘린더 */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead b{font-size:13.5px}
.calnav{cursor:pointer;border:1px solid var(--line2);border-radius:6px;width:26px;height:26px;line-height:24px;text-align:center;font-size:13px;color:var(--sub2);background:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .dw{font-size:10.5px;color:var(--sub);padding:4px 0}.cal .dw:first-child{color:#D4537E}
.day{font-size:12px;padding:7px 0 9px;border-radius:8px;cursor:pointer;position:relative}
.day:hover{background:var(--line)}.day.dim{cursor:default}.day.dim:hover{background:none}
.day.today{background:#3E3A28;color:#F5EEDC;font-weight:700}.day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.day .d{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#D85A30}
.ev{display:flex;gap:10px;padding:6px 0;font-size:13px;align-items:baseline;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:none}.ev .t{color:var(--blue);font-weight:700;min-width:44px;font-size:12.5px}.ev .del{margin-left:auto}
/* 사업 미니카드 (홈) */
.bizgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bizc{border:1px solid var(--line);border-radius:12px;padding:12px 13px;cursor:pointer;transition:transform .12s;background:#fff}
.bizc:hover{transform:translateY(-2px);border-color:var(--line2)}
.bizc .bh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px}
.bizc .bh .dot{width:10px;height:10px;border-radius:50%}
.bizc .bd{font-size:11px;color:var(--sub);margin-top:3px}
.bizc .bs{font-size:12px;color:var(--sub2);margin-top:8px;border-top:1px dashed var(--line);padding-top:7px;min-height:16px}
.bizc .bmeta{font-size:11px;color:var(--sub);margin-top:6px}
/* 사업 상세 헤더 */
.bizhero{border-radius:16px;padding:18px 22px;color:#fff;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bizhero h1{font-size:22px;font-weight:800}
.bizhero p{font-size:13px;opacity:.9;margin-top:3px}
.bizhero .badge{background:rgba(255,255,255,.22);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;display:inline-block;margin-top:8px;cursor:pointer}
.bizhero .ql{display:flex;gap:8px;flex-wrap:wrap}
.bizhero .ql a{background:rgba(255,255,255,.2);border-radius:9px;padding:8px 13px;font-size:12.5px;font-weight:700;color:#fff;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:14px;padding:15px 16px;border-left:4px solid var(--accent);cursor:pointer}
.kpi .v{font-size:25px;font-weight:800}.kpi .l{font-size:11.5px;color:var(--sub);margin-top:3px}
.kpi .dt{font-size:11px;font-weight:700;margin-top:5px}.kpi .dt.up{color:var(--green)}.kpi .dt.down{color:var(--red)}
.pipe{display:flex;gap:6px}
.step{flex:1;text-align:center;background:#F3EDD8;border-radius:9px;padding:10px 4px;position:relative;cursor:pointer}
.step.hot{background:#FBEAEA}.step .n{font-size:19px;font-weight:800}.step .s{font-size:10.5px;color:var(--sub)}.step.hot .n{color:var(--red)}
.pill{font-size:10px;background:#FBEAEA;color:var(--red);border-radius:10px;padding:1px 7px;position:absolute;top:-7px;right:6px;font-weight:700}
.money{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.money .m{background:var(--bg);border-radius:10px;padding:10px;cursor:pointer}.money .mv{font-size:16px;font-weight:800}.money .ml{font-size:10.5px;color:var(--sub);margin-top:2px}
.fu{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}.fu:last-child{border-bottom:none}
.fu .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}.fu .when{margin-left:auto;font-size:11px;color:var(--red);font-weight:700}
.fu .del{color:var(--line2);cursor:pointer;padding-left:4px}.fu .del:hover{color:var(--red)}
.log{font-size:12px;color:var(--sub2)}.log>div{padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}.log>div:last-child{border-bottom:none}
.log .t{color:var(--sub);white-space:nowrap;font-size:11px}.log .st{margin-left:auto;font-size:10.5px;border-radius:10px;padding:1px 8px;white-space:nowrap}

.links{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.lk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:12.5px;font-weight:700;cursor:pointer}.lk .d{font-size:11px;color:var(--sub);font-weight:400;margin-top:3px}
#memo,.bnote{width:100%;min-height:120px;border:none;background:transparent;resize:vertical;font-family:inherit;font-size:13px;color:var(--txt);line-height:1.7;outline:none}

/* 반응형 (모바일은 추후 정밀화) */
@media(max-width:900px){
  .wrap{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:4px;overflow-x:auto}
  .side .navlabel{width:100%}
  .aimini{margin:8px 0 0}
  .g3,.g2{grid-template-columns:1fr}
  .main{padding:16px}
}
</style>
</head>

function start(){
  if(started) return; started=true;
  const now=new Date(), H=now.getHours();
  document.getElementById('greet').textContent=(H<5?'늦은 밤까지 고생 많으세요, 사장님':H<12?'좋은 아침이에요, 사장님':H<18?'좋은 오후예요, 사장님':'오늘도 수고 많으셨어요, 사장님')+'.';
  document.getElementById('dateStr').textContent=now.getFullYear()+'년 '+(now.getMonth()+1)+'월 '+now.getDate()+'일';
  document.getElementById('dowStr').textContent=['일','월','화','수','목','금','토'][now.getDay()]+'요일';
  db.ref('home/tasks').on('value',s=>{tasks=s.val()||{}; refresh();});
  db.ref('home/deadlines').on('value',s=>{ddays=s.val()||{}; refresh();});
  db.ref('home/events').on('value',s=>{evs=s.val()||{}; refresh();});
  db.ref('home/biz').on('value',s=>{bizNotes=s.val()||{}; refresh();});
  db.ref('home/bizdata').on('value',s=>{bizdata=s.val()||{}; refresh();});
  db.ref('home/memo').on('value',s=>{memoVal=s.val()||''; var m=document.getElementById('memo'); if(m&&document.activeElement!==m)m.value=memoVal;});
  db.ref('.info/connected').on('value',s=>{const el=document.getElementById('sync'); el.textContent=s.val()?'● 동기화됨':'○ 오프라인'; el.style.color=s.val()?'var(--green)':'var(--red)';});
  db.ref('home/summary').on('value',s=>{ if(s.exists()){summary=s.val(); renderAiMini();} });
  loadSummary(); loadCrm();

}

function setView(v){ curView=v; renderNav(); renderView(); if(window.innerWidth<=900)window.scrollTo(0,0); }
function refresh(){ renderNav(); renderView(); renderSubline(); }

/* 사이드바 */
function renderNav(){
  document.getElementById('navBiz').innerHTML=BIZ.map(b=>{
    const open=Object.values(tasks).filter(t=>t.biz===b.k&&!t.done).length;
    return `<div class="nav ${curView==='biz:'+b.k?'on':''}" onclick="setView('biz:${b.k}')">
      <span class="dot" style="background:${b.c}"></span>${b.k}${open?`<span class="sd">${open}</span>`:''}</div>`;
  }).join('');
  document.querySelectorAll('.nav[data-v]').forEach(n=>n.classList.toggle('on',n.getAttribute('data-v')===curView));
}
function renderSubline(){
  const open=Object.values(tasks).filter(t=>!t.done).length;
  const over=Object.values(tasks).filter(t=>!t.done&&t.due&&t.due<todayKey()).length;
  document.getElementById('subline').textContent=`진행 중 업무 ${open}건`+(over?` · 지연 ${over}건`:'');
}

/* 공통 빌더 */
function dueLabel(d){ if(!d)return{t:'',o:false}; const diff=Math.round((new Date(d)-new Date(todayKey()))/864e5); return diff<0?{t:'지연 D+'+(-diff),o:true}:diff===0?{t:'오늘',o:true}:{t:'D-'+diff,o:false}; }
function taskRow(id,t){ const b=bizOf(t.biz), dl=dueLabel(t.due);
  return `<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="db.ref('home/tasks/${id}/done').set(this.checked)">
    <span class="tag" style="background:${b.bg};color:${b.tc}">${esc(t.biz)}</span>
    <span class="txt">${esc(t.txt)}</span><span class="due ${dl.o?'over':''}">${dl.t}</span>
    <span class="del" onclick="db.ref('home/tasks/${id}').remove()">✕</span></div>`; }
function ddRow(id,d){ const b=bizOf(d.biz); const diff=Math.round((new Date(d.date)-new Date(todayKey()))/864e5);
  const L=diff<0?{t:'지남',c:'far'}:diff===0?{t:'D-DAY',c:'soon'}:{t:'D-'+diff,c:diff<=3?'soon':diff<=7?'near':'far'};
  const md=d.date?(+d.date.split('-')[1])+'/'+(+d.date.split('-')[2]):'';
  return `<div class="dd"><span class="dot" style="background:${b.c}"></span>
    <span class="txt">${esc(d.txt)} <span style="color:var(--sub);font-size:11px">${md}</span></span>
    <span class="cd ${L.c}">${L.t}</span><span class="del" onclick="db.ref('home/deadlines/${id}').remove()">✕</span></div>`; }
function sortTasks(arr){ return arr.sort((a,b)=>(a.done-b.done)||((a.due||'9999')<(b.due||'9999')?-1:1)); }
function sortDd(arr){ return arr.sort((a,b)=>(a.date||'9999')<(b.date||'9999')?-1:1); }
function bizOpts(sel){ return BIZ.map(b=>`<option ${b.k===sel?'selected':''}>${b.k}</option>`).join(''); }

function tasksCard(bizFilter){
  const arr=sortTasks(Object.entries(tasks).map(([id,t])=>({id,...t})).filter(t=>!bizFilter||t.biz===bizFilter));
  const rows=arr.map(t=>taskRow(t.id,t)).join('')||'<div class="empty">등록된 업무가 없어요. 아래에서 추가하세요.</div>';
  const open=arr.filter(t=>!t.done).length;
  return `<div class="card"><h2>${bizFilter?'이 사업 업무':'오늘의 우선순위 업무'} <span class="cnt">진행 ${open}건</span></h2>
    <div>${rows}</div>
    <div class="addrow"><select id="tBiz">${bizOpts(bizFilter)}</select>
      <input type="text" id="tTxt" placeholder="업무 내용" onkeydown="if(event.key==='Enter')addTask()">
      <input type="date" id="tDue"><button onclick="addTask()">추가</button></div></div>`;
}
function ddCard(bizFilter){
  const arr=sortDd(Object.entries(ddays).map(([id,d])=>({id,...d})).filter(d=>!bizFilter||d.biz===bizFilter));
  const rows=arr.map(d=>ddRow(d.id,d)).join('')||'<div class="empty">등록된 마감이 없어요.</div>';
  return `<div class="card"><h2>🔥 ${bizFilter?'이 사업 마감':'마감 · D-day'} <span class="cnt">놓치면 안 되는 날</span></h2>
    <div>${rows}</div>
    <div class="addrow"><select id="dBiz">${bizOpts(bizFilter)}</select>
      <input type="text" id="dTxt" placeholder="마감 내용 (예: 대납, 세금신고)" onkeydown="if(event.key==='Enter')addDday()">
      <input type="date" id="dDate"><button onclick="addDday()">추가</button></div></div>`;
}
function calCard(){
  const y=calBase.getFullYear(),m=calBase.getMonth();
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  const evDays=new Set(Object.values(evs).map(e=>e.date));
  let c=['일','월','화','수','목','금','토'].map(d=>`<div class="dw">${d}</div>`).join('');
  for(let i=0;i<first;i++)c+='<div class="day dim"></div>';
  for(let d=1;d<=days;d++){const k=y+'-'+pad(m+1)+'-'+pad(d);
    c+=`<div class="day ${k===todayKey()?'today':''} ${k===selDay?'sel':''}" onclick="pickDay('${k}')">${d}${evDays.has(k)?'<span class="d"></span>':''}</div>`;}
  const list=Object.entries(evs).map(([id,e])=>({id,...e})).filter(e=>e.date===selDay).sort((a,b)=>a.time<b.time?-1:1);
  const [,mm,dd]=selDay.split('-');
  const evrows=list.map(e=>`<div class="ev"><span class="t">${esc(e.time)}</span><span>${esc(e.txt)}</span><span class="del" onclick="db.ref('home/events/${e.id}').remove()">✕</span></div>`).join('')||'<div class="empty">등록된 일정이 없어요.</div>';
  return `<div class="card"><h2>캘린더 <span class="cnt"><a href="https://calendar.google.com" target="_blank" style="color:var(--blue)">구글 캘린더 →</a></span></h2>
    <div class="calhead"><span class="calnav" onclick="moveM(-1)">‹</span><b>${y}년 ${m+1}월</b><span class="calnav" onclick="moveM(1)">›</span></div>
    <div class="cal">${c}</div>
    <div style="margin-top:12px;border-top:1px solid var(--line);padding-top:8px">
      <div style="font-size:12px;color:var(--sub2);margin-bottom:4px">${selDay===todayKey()?'오늘':(+mm)+'월 '+(+dd)+'일'} 일정 ${list.length?list.length+'건':''}</div>
      <div>${evrows}</div>
      <div class="addrow"><input type="time" id="eTime"><input type="text" id="eTxt" placeholder="일정 내용" onkeydown="if(event.key==='Enter')addEv()"><button onclick="addEv()">추가</button></div>
    </div></div>`;
}
function memoCard(){
  return `<div class="card"><h2>메모장 <span class="cnt memoinfo" id="memoSaved">자동 저장·동기화</span></h2>
    <textarea id="memo" placeholder="떠오르는 생각, 전화 메모, 오늘 챙길 것...">${esc(memoVal)}</textarea></div>`;

/* 사업 상세: 설정 기본값 + Firebase 오버라이드(수정분) 병합 */
function bd(k){ return bizdata[k]||{}; }
function effBadge(k){ return bd(k).badge ?? bizOf(k).badge; }
function effKpi(k){ return bd(k).kpi || bizOf(k).kpi; }
function effMoney(k){ return bd(k).money || bizOf(k).money; }
function effFu(k){ return bd(k).fu || bizOf(k).fu; }
function effPipe(k){ return bd(k).pipe || bizOf(k).pipe.map(p=>p[1]); }
function moneyCol(c){ return c==='green'?'var(--green)':c==='red'?'var(--red)':'inherit'; }

function bizView(k){
  const b=bizOf(k);
  const kpis=effKpi(k), money=effMoney(k), fu=effFu(k), pc=effPipe(k);
  const heroH=(b.hero||[]).map(l=>`<a onclick="location.href='${l[1]}'">${esc(l[0])} →</a>`).join('');
  const kpiH=kpis.map((x,i)=>`<div class="kpi" style="border-color:${b.c}" onclick="editKpi('${k}',${i})"><div class="v">${x[0]}</div><div class="l">${esc(x[1])}</div><div class="dt ${x[3]||''}">${esc(x[2]||'')}</div></div>`).join('');
  const pipeH=b.pipe.map((p,i)=>`<div class="step ${p[2]?'hot':''}" onclick="editPipe('${k}',${i})"><div class="n">${pc[i]??p[1]}</div><div class="s">${esc(p[0])}</div>${p[3]?`<span class="pill">${esc(p[3])}</span>`:''}</div>`).join('');
  const moneyH=money.map((m,i)=>`<div class="m" onclick="editMoney('${k}',${i})"><div class="mv" style="color:${moneyCol(m[2])}">${m[0]}</div><div class="ml">${esc(m[1])}</div></div>`).join('');
  const fuH=fu.length?fu.map((f,i)=>`<div class="fu"><span class="dot"></span>${esc(f[0])} <span style="color:var(--sub);font-size:11px">· ${esc(f[1])}</span><span class="when">${esc(f[2])}</span><span class="del" onclick="delFu('${k}',${i})">✕</span></div>`).join(''):'<div class="empty">없음 — 아래 + 추가</div>';

  return `<div class="bizhero" style="background:linear-gradient(120deg,${b.c},${b.tc})">
      <div><h1>${b.icon||''} ${b.k}</h1><p>${esc(b.desc)}</p><span class="badge" onclick="editBadge('${k}')">${esc(effBadge(k))} ✎</span></div>

      <div class="col">
        <div class="card"><h2>${esc(b.pipeTitle)} <span class="cnt">단계 클릭해 수정 · 🔴 병목</span></h2><div class="pipe">${pipeH}</div></div>
        ${tasksCard(k)}
        <div class="card"><h2>최근 활동 <span class="cnt">자동 연동 예정</span></h2><div class="log">${logH}</div></div>
      </div>
      <div class="col">
        <div class="card"><h2>${esc(b.moneyTitle)} <span class="cnt">숫자 클릭해 수정</span></h2><div class="money">${moneyH}</div></div>
        <div class="card"><h2>📞 다시 연락할 사람 <span class="cnt">팔로업 ${fu.length}건</span></h2>${fuH}
          <div class="addrow"><button onclick="addFu('${k}')">+ 연락 추가</button></div></div>
        ${ddCard(k)}
        <div class="card"><h2>📝 현황 메모</h2>

      </div>
    </div>
    <div class="links">${cardsH}</div>`;
}

document.addEventListener('input',e=>{ if(e.target.id!=='memo')return;
  clearTimeout(memoTimer); const el=document.getElementById('memoSaved'); if(el)el.textContent='입력 중...';
  memoTimer=setTimeout(()=>{ db.ref('home/memo').set(e.target.value).then(()=>{ const t=new Date(); const s=document.getElementById('memoSaved'); if(s)s.textContent=pad(t.getHours())+':'+pad(t.getMinutes())+' 저장됨'; }); },600); });

/* AI 요약 (사이드바 한 줄) */
function renderAiMini(){ if(!summary)return;
  document.getElementById('aiMini').innerHTML='🤖 AI 직원 <b>'+(summary['직원_총원']??'?')+'명</b><br>개입 '+(summary['개입_대기']??'–')+' · 검수 '+(summary['검수_대기']??'–')+' — 관제탑 →'; }
async function loadSummary(){ try{ const r=await fetch('home_summary.json?v='+Date.now()); if(!r.ok)throw 0; summary=await r.json(); renderAiMini(); }catch(e){} }
async function loadCrm(){ try{ const [rq,mo]=await Promise.all([db.ref('requests').once('value'),db.ref('dashMemo').once('value')]); crm={n:rq.numChildren(),memo:mo.val()||''}; }catch(e){} }

/* 사업 상세 수정 (클릭 → 수정, Firebase 저장) */
function cloneArr(a){ return (a||[]).map(x=>Array.isArray(x)?x.slice():x); }
function editKpi(k,i){ const a=cloneArr(effKpi(k)); const c=a[i]||['','','','up'];
  const v=prompt('KPI 수정 — "값 | 라벨 | 추세"\n예: 34 | 진행 딜 | ▲ 오늘 +12', c[0]+' | '+c[1]+' | '+(c[2]||'')); if(v===null)return;
  const p=v.split('|').map(s=>s.trim()); const dir=(p[2]||'').indexOf('▼')>=0?'down':(p[2]?'up':(c[3]||'')); a[i]=[p[0]||'',p[1]||c[1],p[2]||'',dir]; db.ref('home/bizdata/'+k+'/kpi').set(a); }
function editMoney(k,i){ const a=cloneArr(effMoney(k)); const c=a[i]||['','','']; const v=prompt('정산 항목 — "값 | 라벨"', c[0]+' | '+c[1]); if(v===null)return; const p=v.split('|').map(s=>s.trim()); a[i]=[p[0]||'',p[1]||c[1],c[2]||'']; db.ref('home/bizdata/'+k+'/money').set(a); }
function editPipe(k,i){ const a=(effPipe(k)||[]).slice(); const label=bizOf(k).pipe[i][0]; const n=prompt(label+' 단계 건수', a[i]??bizOf(k).pipe[i][1]); if(n===null)return; a[i]=(n===''?0:(parseInt(n,10)||0)); db.ref('home/bizdata/'+k+'/pipe').set(a); }
function editBadge(k){ const v=prompt('상태 배지 (예: 🟢 진행중 · ...)', effBadge(k)); if(v===null)return; db.ref('home/bizdata/'+k+'/badge').set(v.trim()); }
function addFu(k){ const v=prompt('다시 연락할 사람 — "이름 | 내용 | 시점"\n예: 김대표 | 대납 확인 | 오늘', ''); if(!v)return; const p=v.split('|').map(s=>s.trim()); const a=cloneArr(effFu(k)); a.push([p[0]||'',p[1]||'',p[2]||'']); db.ref('home/bizdata/'+k+'/fu').set(a); }
function delFu(k,i){ const a=cloneArr(effFu(k)); a.splice(i,1); db.ref('home/bizdata/'+k+'/fu').set(a); }
</script>
