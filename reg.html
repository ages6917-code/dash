<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주소가 바뀌었습니다</title>
<style>body{font-family:'Malgun Gothic',sans-serif;background:#eef1f6;color:#1f2937;display:flex;
 align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;padding:20px}
 .b{background:#fff;border-radius:14px;padding:26px 22px;max-width:420px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
 .b h1{font-size:18px;margin:0 0 8px}.b p{font-size:13.5px;line-height:1.7;color:#4b5563;margin:0}</style>
</head>
<body>
<div class="b">
  <h1>📦 주소가 하나로 합쳐졌습니다</h1>
  <p>이 화면은 <b>dash.html</b> 한 곳으로 통합됐습니다.<br>
     사장님께 받으신 <b>키가 들어간 주소</b>로 들어와 주세요.<br>잠시 후 자동으로 이동합니다.</p>
</div>
<script>
setTimeout(function(){ location.replace('dash.html' + (location.search || '')); }, 1200);
</script>
</body>
</html>
